name: NOR-56 prospectively registered canonical signed compact-v2 verifier

on:
  push:
    branches:
      - research/nor56-batch-compact-v2-20261118
    paths:
      - 'research/nor56_batch_codec/**'
      - '.github/workflows/nor56-batch-compact-v2.yml'
  pull_request:
    paths:
      - 'research/nor56_batch_codec/**'
      - '.github/workflows/nor56-batch-compact-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original_registration_and_source_free_security_controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin exact GMP and Ed25519 test fixture runtime
        run: python -m pip install --disable-pip-version-check cryptography==46.0.4 gmpy2==2.3.2
      - name: Original prospective NOR56 registration must predate implementation and timing
        run: |
          git merge-base --is-ancestor b186ee7478f27230478b099d7091b25817839464 HEAD
          test -s research/nor56_batch_codec/REGISTRATION.md
      - name: Compile source-only, canonical codec and four-arm full verifier modules
        run: python -m compileall -q research/nor56_batch_codec
      - name: Check exhaustive original support, full-root, 32768-bit and versioned signed security
        run: python -m unittest research.nor56_batch_codec.test_codec_v2 -v
      - name: Preserve original NOR55 4-of-5 FAIL with real TCP and old signed replay controls
        run: |
          python research/nor55_compact_witness/original_archive_audit.py
          python -m unittest research.nor55_compact_witness.test_codec_envelope -v
      - name: Continue original NOR50 signed native, NOR53 exact pack and signed bounds
        run: |
          python -m unittest research.nor50_memoized_exact.test_cached -v
          python -m unittest research.nor53_native_pack.test_fast_kernel -v
      - name: Check only original source grid contract, without generating a new source
        run: |
          python - <<'PY'
          from research.nor56_batch_codec import cohort,signed_v2
          assert cohort.REGISTERED=='b186ee7478f27230478b099d7091b25817839464'
          assert len(cohort.REPS)*len(cohort.LENGTHS)*len(cohort.PROFILES)*len(cohort.FAMILIES)==60
          assert len(cohort.historical_ids())==288
          assert signed_v2.FORMAT_V2=='compact-v2'
          print('NOR56 prospective source-free exact and security gates PASS')
          PY

  first_original_public_only_60_source_SHA_freeze:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'NOR56-FIRST-CPU')
    needs: original_registration_and_source_free_security_controls
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and SHA-freeze first new 60 public-only source identities before any timing
        run: |
          python -u research/nor56_batch_codec/cohort.py \
            --public-only-out /tmp/nor56_first_original_60_public_only.json
      - name: Independently verify 288 historical source exclusions and forbidden private fields
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          from research.nor56_batch_codec import cohort
          p=Path('/tmp/nor56_first_original_60_public_only.json')
          x,first_sha=cohort.read_fixture(p)
          rows=x['cases']
          assert len(rows)==len({r['source_sha256'] for r in rows})==60
          assert Counter(r['length'] for r in rows)=={769:20,1537:20,3073:20}
          assert Counter(r['stride'] for r in rows)=={1:12,4:36,8:12}
          assert set(r['source_sha256'] for r in rows).isdisjoint(cohort.historical_ids())
          assert all(not set(r).intersection(('inverse','root','witness','session',
                     'nonce','signature','payload','timing','private','provider')) for r in rows)
          assert x['no_inverse_root_payload_signature_session_or_timing']
          print('NOR56 FIRST ORIGINAL 60 PUBLIC-ONLY SOURCE SHA256',p.stat().st_size,first_sha)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nor56_first_original_60_public_only_source_roster
          path: /tmp/nor56_first_original_60_public_only.json
          retention-days: 90
          if-no-files-found: error

  first_original_four_arm_five_repeat_CPU:
    needs: first_original_public_only_60_source_SHA_freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin exact first GMP and research Ed25519 versions
        run: python -m pip install --disable-pip-version-check cryptography==46.0.4 gmpy2==2.3.2
      - uses: actions/download-artifact@v4
        with:
          name: nor56_first_original_60_public_only_source_roster
          path: /tmp/nor56
      - name: Run original 60-source four-arm five-repeat signed compact-v2 CPU and phase audit
        run: |
          python -u research/nor56_batch_codec/benchmark_cpu.py \
            --public-file /tmp/nor56/nor56_first_original_60_public_only.json \
            --repeats 5 --out /tmp/nor56/nor56_first_original_cpu.json
      - name: Preserve original first five gates and exact CPU SHA even on engineering FAIL
        run: |
          python - <<'PY'
          import json
          from hashlib import sha256
          from pathlib import Path
          p=Path('/tmp/nor56/nor56_first_original_cpu.json')
          raw=p.read_bytes()
          x=json.loads(raw)
          assert x['schema']=='nor56.first_60_source_signed_compact_v2_cpu.v1'
          assert x['registration_first_sha']=='b186ee7478f27230478b099d7091b25817839464'
          assert x['source_count']==60 and len(x['source_records'])==60
          assert x['repeat_count']==5 and len(x['arms'])==4
          assert len(x['original_five_registered_gates'])==5
          assert all(type(v) is bool for v in x['original_five_registered_gates'].values())
          assert x['first_original_engineering_pass']==all(x['original_five_registered_gates'].values())
          print('NOR56 FIRST ORIGINAL CPU RAW BYTES SHA256',len(raw),sha256(raw).hexdigest())
          print('NOR56 FIRST ORIGINAL FIVE GATES',x['original_five_registered_gates'])
          print('NOR56 ORIGINAL FIRST ENGINEERING PASS',x['first_original_engineering_pass'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nor56_first_original_60_signed_compact_v2_CPU
          path: |
            /tmp/nor56/nor56_first_original_cpu.json
            /tmp/nor56/nor56_first_original_60_public_only.json
          retention-days: 90
          if-no-files-found: warn
