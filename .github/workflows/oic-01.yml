name: OIC-01 finite observability reference

on:
  push:
    paths:
      - 'research/observational_inwardness_v1/**'
      - '.github/workflows/oic-01.yml'
  pull_request:
    paths:
      - 'research/observational_inwardness_v1/**'
      - '.github/workflows/oic-01.yml'

jobs:
  finite-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact tests
        run: python -m unittest discover -s research/observational_inwardness_v1 -p 'test_*.py' -v
      - name: Exact tests with assertions optimized away
        run: python -O -m unittest discover -s research/observational_inwardness_v1 -p 'test_*.py' -v
      - name: Pinned receipt replay
        run: python research/observational_inwardness_v1/run.py --check
      - name: Fault-tolerant audit-channel receipt replay
        run: python research/observational_inwardness_v1/robust_run.py --check
      - name: Raw-state fault-tolerant reference replay
        run: python research/observational_inwardness_v1/raw_run.py --check
      - name: Verify completed OIC-12 GRU receipt without torch
        run: python research/observational_inwardness_v1/verify_learned.py --check
      - name: Verify OIC-13 structural clock experiment receipt without torch
        run: python research/observational_inwardness_v1/verify_clock.py --check
      - name: Verify OIC-14 learned phase transition receipt without torch
        run: python research/observational_inwardness_v1/verify_receipt.py
      - name: Replay OIC-14 long-horizon angular drift from archived weights
        run: python research/observational_inwardness_v1/long_horizon.py --check
      - name: Verify OIC-15 hidden-phase family inference, exact oracle and fault receipts
        run: python research/observational_inwardness_v1/oic15_verify.py
