name: LSV-09 goal-projected exact and tangent diagnostics
on:
  push:
    paths:
      - 'research/levin_sieve_v1/pretrained_trm/**'
      - '.github/workflows/levin-goal-projected.yml'
  pull_request:
    paths:
      - 'research/levin_sieve_v1/pretrained_trm/**'
      - '.github/workflows/levin-goal-projected.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  task-directed-sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU PyTorch
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Independent exact rational proofs and pretrained interface tests
        run: python -m unittest discover -s research/levin_sieve_v1/pretrained_trm -p 'test_*.py' -v
      - name: Run exploratory pretrained gradient diagnostic (not a certificate)
        run: |
          mkdir -p runs/lsv09
          python research/levin_sieve_v1/pretrained_trm/run_goal_gradients.py --fetch --out runs/lsv09/gradients.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lsv09-goal-projected-tangent-observational
          path: runs/lsv09/gradients.json
          if-no-files-found: ignore
          retention-days: 30
