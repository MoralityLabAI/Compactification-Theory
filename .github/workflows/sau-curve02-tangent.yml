name: SAU-CURVE02 tangent-frame identification CPU

on:
  push:
    paths:
      - 'research/curved_sae_gauge_v1/sau_curve02.py'
      - 'research/curved_sae_gauge_v1/test_sau_curve02.py'
      - '.github/workflows/sau-curve02-tangent.yml'
  pull_request:
    paths:
      - 'research/curved_sae_gauge_v1/sau_curve02.py'
      - 'research/curved_sae_gauge_v1/test_sau_curve02.py'
      - '.github/workflows/sau-curve02-tangent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-gauge-identifiability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install 'numpy==2.2.6'
      - name: Verify tangent-SVD identities and controls
        run: python -m unittest discover -s research/curved_sae_gauge_v1 -p 'test_sau_curve02.py' -v
      - name: Run four-source-seed geometry sweep
        run: |
          mkdir -p runs/sau_curve02
          python research/curved_sae_gauge_v1/sau_curve02.py > runs/sau_curve02/results.json
          sha256sum runs/sau_curve02/results.json
          python - <<'PY'
          import json
          p = json.load(open('runs/sau_curve02/results.json'))
          assert len(p['seedwise']) == 72
          assert len(p['pooled']) == 18
          assert all(r['joint_infimum_sigma'] >= 0 for r in p['pooled'])
          print('SWEEP OK', p['protocol'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sau-curve02-tangent-sweep
          path: runs/sau_curve02/results.json
