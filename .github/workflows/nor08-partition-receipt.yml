name: NOR-08C frozen basin partition evidence audit

on:
  push:
    paths:
      - 'research/nor01_numerical_orbit_sketch/nor08_partition_receipt_audit.py'
      - 'research/nor01_numerical_orbit_sketch/results/nor08_heldout_partition_summary.json'
      - '.github/workflows/nor08-partition-receipt.yml'
  pull_request:
    paths:
      - 'research/nor01_numerical_orbit_sketch/nor08_partition_receipt_audit.py'
      - 'research/nor01_numerical_orbit_sketch/results/nor08_heldout_partition_summary.json'
      - '.github/workflows/nor08-partition-receipt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-contingency-and-exploratory-statistic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact case totals, source lock and one-sided hypergeometric count
        run: python research/nor01_numerical_orbit_sketch/nor08_partition_receipt_audit.py
