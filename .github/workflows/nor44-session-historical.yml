name: NOR-44 signed proposal-session chronology and challenge authenticity

on:
  push:
    branches:
      - research/nor44-session-precommit-historical-20261118
    paths:
      - 'research/nor44_session_protocol/**'
      - '.github/workflows/nor44-session-historical.yml'
  pull_request:
    paths:
      - 'research/nor44_session_protocol/**'
      - '.github/workflows/nor44-session-historical.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  session_protocol_security_unit_tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Ed25519 reference dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Check syntax, test real CSPRNG path and adversarial signed-session controls
        run: |
          python -m compileall -q research/nor44_session_protocol
          python -m unittest research.nor44_session_protocol.test_session_protocol -v
