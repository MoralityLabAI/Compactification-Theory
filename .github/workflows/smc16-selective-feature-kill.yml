name: SMC-16 selective active SAE kill and equal-dose tangent sham

on:
  push:
    paths:
      - 'research/real_recurrence_sae_v1/SMC16_PROTOCOL.md'
      - 'research/real_recurrence_sae_v1/smc16_selective_kill.py'
      - 'research/real_recurrence_sae_v1/test_smc16_selective_kill.py'
      - 'research/real_recurrence_sae_v1/audit_smc16.py'
      - 'research/real_recurrence_sae_v1/test_audit_smc16.py'
      - '.github/workflows/smc16-selective-feature-kill.yml'
  pull_request:
    paths:
      - 'research/real_recurrence_sae_v1/SMC16_PROTOCOL.md'
      - 'research/real_recurrence_sae_v1/smc16_selective_kill.py'
      - 'research/real_recurrence_sae_v1/test_smc16_selective_kill.py'
      - 'research/real_recurrence_sae_v1/audit_smc16.py'
      - 'research/real_recurrence_sae_v1/test_audit_smc16.py'
      - '.github/workflows/smc16-selective-feature-kill.yml'
  workflow_dispatch:

jobs:
  focused-unit-and-four-puzzle-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned source CPU Torch
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Geometry, source abstentions, scoring and independent replay unit checks
        run: |
          python -m unittest discover -s research/real_recurrence_sae_v1 -p 'test_smc16_selective_kill.py' -v
          python -m unittest discover -s research/real_recurrence_sae_v1 -p 'test_audit_smc16.py' -v
      - name: Recover original pretrained teacher and SAE snapshot
        uses: actions/download-artifact@v4
        with:
          name: smc11c-source-locked-same-fit-full
          run-id: 43721281348
          github-token: ${{ github.token }}
          path: runs/smc16/original
      - name: Recover independent teacher and SAE checkpoints
        uses: actions/download-artifact@v4
        with:
          name: smc13-independent-noncanonical-teachers
          run-id: 43728006836
          github-token: ${{ github.token }}
          path: runs/smc16/independent
      - name: Recover original visible-position-and-digit conditioned correspondence
        uses: actions/download-artifact@v4
        with:
          name: smc13-clue-conditioned-cross-teacher-transfer
          run-id: 43729335868
          github-token: ${{ github.token }}
          path: runs/smc16/conditioned
      - name: Audit all three source JSON receipt SHA-256
        run: |
          echo "7caafcb54e36f508b49a082892b689789a751f86b52d6d206e955e3782431087  runs/smc16/original/joint-full.json" | sha256sum -c -
          echo "1fc69e15c24087f631806a89d55beaf519c2f6ab58ac7b8193cf8fdc36d240e3  runs/smc16/independent/full.json" | sha256sum -c -
          echo "3b4637699d5af236af2d3b8aa5d04e024025b16e0d59395535892c104d472d07  runs/smc16/conditioned/conditioned.json" | sha256sum -c -
      - name: Run bounded four-puzzle and one-pair selective-kill pilot
        run: python research/real_recurrence_sae_v1/smc16_selective_kill.py --fetch-source --original-artifact runs/smc16/original --independent-artifact runs/smc16/independent --conditioned-receipt runs/smc16/conditioned/conditioned.json --pilot-puzzles 4 --pair-limit 1 --out runs/smc16/pilot.json
      - name: Independently audit original pilot observations
        run: python research/real_recurrence_sae_v1/audit_smc16.py --receipt runs/smc16/pilot.json --out runs/smc16/pilot-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smc16-selective-kill-pilot
          path: |
            runs/smc16/pilot.json
            runs/smc16/pilot-audit.json
          retention-days: 90
          if-no-files-found: warn

  fresh-128-puzzle-four-pair-full:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned source CPU Torch
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Recover original pretrained teacher and SAE snapshot
        uses: actions/download-artifact@v4
        with:
          name: smc11c-source-locked-same-fit-full
          run-id: 43721281348
          github-token: ${{ github.token }}
          path: runs/smc16/original
      - name: Recover independent teacher and SAE checkpoints
        uses: actions/download-artifact@v4
        with:
          name: smc13-independent-noncanonical-teachers
          run-id: 43728006836
          github-token: ${{ github.token }}
          path: runs/smc16/independent
      - name: Recover frozen calibration matching and conditioned null
        uses: actions/download-artifact@v4
        with:
          name: smc13-clue-conditioned-cross-teacher-transfer
          run-id: 43729335868
          github-token: ${{ github.token }}
          path: runs/smc16/conditioned
      - name: Pin original artifact SHA-256 before test
        run: |
          echo "7caafcb54e36f508b49a082892b689789a751f86b52d6d206e955e3782431087  runs/smc16/original/joint-full.json" | sha256sum -c -
          echo "1fc69e15c24087f631806a89d55beaf519c2f6ab58ac7b8193cf8fdc36d240e3  runs/smc16/independent/full.json" | sha256sum -c -
          echo "3b4637699d5af236af2d3b8aa5d04e024025b16e0d59395535892c104d472d07  runs/smc16/conditioned/conditioned.json" | sha256sum -c -
      - name: Full frozen selective feature kill and tangent sham on 128 fresh puzzles
        run: python research/real_recurrence_sae_v1/smc16_selective_kill.py --fetch-source --original-artifact runs/smc16/original --independent-artifact runs/smc16/independent --conditioned-receipt runs/smc16/conditioned/conditioned.json --out runs/smc16/full.json
      - name: Independent stdlib replay of geometry/rosters/eligible causal margins/gates
        run: python research/real_recurrence_sae_v1/audit_smc16.py --receipt runs/smc16/full.json --out runs/smc16/audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smc16-full-selective-kill-and-independent-audit
          path: |
            runs/smc16/full.json
            runs/smc16/audit.json
          retention-days: 90
          if-no-files-found: warn
