name: NOR-45 independently authorized program and faithful Merkle output verifier

on:
  push:
    branches:
      - research/nor45-authorized-program-witness-20261118
    paths:
      - 'research/nor45_authorized_program/**'
      - '.github/workflows/nor45-authorized-program.yml'
  pull_request:
    paths:
      - 'research/nor45_authorized_program/**'
      - '.github/workflows/nor45-authorized-program.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  program_authority_integrity_and_negative_controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test-only reference Ed25519 library
        run: |
          python -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Exact independent RRC25 and late hidden suffix root checks
        run: |
          python -m compileall -q research/nor45_authorized_program
          python -m unittest research.nor45_authorized_program.test_program_authority -v
