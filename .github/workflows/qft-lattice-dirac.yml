name: QFT lattice Dirac CPU replication

on:
  pull_request:
    paths:
      - "experiments/qft-lattice-map/**"
      - ".github/workflows/qft-lattice-dirac.yml"
  push:
    paths:
      - "experiments/qft-lattice-map/**"
      - ".github/workflows/qft-lattice-dirac.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dirac-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check numpy scipy
      - run: python -m unittest discover -s experiments/qft-lattice-map/tests -v
      - run: python experiments/qft-lattice-map/run.py --output /tmp/qft-lattice-dirac.json
      - name: Generate target-certified infinite-resolvent receipt
        run: |
          python experiments/qft-lattice-map/adaptive_certificate.py \
            --target 1/1000 --cutoff 1024 \
            --output /tmp/qft-adaptive-receipt.json
      - name: Replay certificate with solver absent
        run: python experiments/qft-lattice-map/adaptive_certificate.py --verify /tmp/qft-adaptive-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: qft-infinite-resolvent-tolerance
          path: /tmp/qft-adaptive-receipt.json
