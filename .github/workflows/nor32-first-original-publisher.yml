name: NOR-32 one-shot original eight-file evidence publisher

on:
  push:
    paths:
      - '.github/workflows/nor32-first-original-publisher.yml'

permissions:
  contents: write
  actions: read

jobs:
  permanently-preserve-first-nested-depth-originals:
    if: github.ref == 'refs/heads/research/nor32-nested-depth-audit-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/nor32-nested-depth-audit-20261117
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nor32_first_source_calibration_precommitment
          run-id: 44043154269
          github-token: ${{ github.token }}
          path: /tmp/nor32_original_prep
      - uses: actions/download-artifact@v4
        with:
          name: nor32_first_independent_evaluation_os_root
          run-id: 44043154269
          github-token: ${{ github.token }}
          path: /tmp/nor32_original_evaluation
      - uses: actions/download-artifact@v4
        with:
          name: nor32_first_leaked_root_attacks_and_full_outcome
          run-id: 44043154269
          github-token: ${{ github.token }}
          path: /tmp/nor32_original_late
      - name: SHA-check all eight original first-run raw bytes and publish deterministic ZIP
        run: |
          python - <<'PY'
          import json,hashlib,zipfile
          from pathlib import Path
          receipt=json.loads(Path('research/nor32_nested_audit_depth/results/nor32_first_original_receipt.json').read_text())
          dst=Path('research/nor32_nested_audit_depth/results/nor32_original_hosted.zip')
          originals={}
          for kind,info in receipt['original_raw'].items():
              base=('/tmp/nor32_original_prep' if kind in
                    ('fixture','calibration','pre_sealed','pre_manifest')
                    else '/tmp/nor32_original_evaluation' if kind=='evaluation'
                    else '/tmp/nor32_original_late')
              raw=(Path(base)/info['file']).read_bytes()
              assert len(raw)==info['bytes'],(kind,'bytes')
              assert hashlib.sha256(raw).hexdigest()==info['sha256'],(kind,'SHA256')
              originals[info['file']]=raw
          assert len(originals)==8
          with zipfile.ZipFile(dst,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for name in sorted(originals):
                  info=zipfile.ZipInfo(name,date_time=(2026,11,17,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0o644<<16
                  z.writestr(info,originals[name],compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          print('NOR32 FIRST PERMANENT EIGHT-FILE ARCHIVE BYTES',dst.stat().st_size)
          PY
          python research/nor32_nested_audit_depth/original_archive_audit.py
      - name: Commit immutable originally emitted source-only fixture, two OS roots and 23.6m decisions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/nor32_nested_audit_depth/results/nor32_original_hosted.zip
          git diff --cached --quiet && { echo 'Original archived bytes already committed'; exit 0; }
          git commit -m 'NOR-32: preserve exact original 2048-audit batch roots and 23.6m outcome bits'
          git push origin HEAD:refs/heads/research/nor32-nested-depth-audit-20261117
