name: SMC-13C position-and-clue-conditioned cross-checkpoint feature transfer

on:
  push:
    paths:
      - 'research/real_recurrence_sae_v1/smc13_conditioned_transfer.py'
      - 'research/real_recurrence_sae_v1/test_smc13_conditioned.py'
      - '.github/workflows/smc13-conditioned.yml'
  pull_request:
    paths:
      - 'research/real_recurrence_sae_v1/smc13_conditioned_transfer.py'
      - 'research/real_recurrence_sae_v1/test_smc13_conditioned.py'
      - '.github/workflows/smc13-conditioned.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  conditional-calibration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU Torch
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify centered observable-group controls and within-group permutations
        run: python -m unittest discover -s research/real_recurrence_sae_v1 -p 'test_smc13_conditioned.py' -v
      - name: Retrieve source-frozen original pretrained model SAE weights
        uses: actions/download-artifact@v4
        with:
          name: smc11c-source-locked-same-fit-full
          run-id: 43721281348
          github-token: ${{ github.token }}
          path: runs/smc13/original
      - name: Retrieve source-locked independent novel-family teacher checkpoints and SAEs
        uses: actions/download-artifact@v4
        with:
          name: smc13-independent-noncanonical-teachers
          run-id: 43728006836
          github-token: ${{ github.token }}
          path: runs/smc13/independent
      - name: Verify source hashes and novel-roster provenance
        run: |
          echo "7caafcb54e36f508b49a082892b689789a751f86b52d6d206e955e3782431087  runs/smc13/original/joint-full.json" | sha256sum -c -
          echo "1fc69e15c24087f631806a89d55beaf519c2f6ab58ac7b8193cf8fdc36d240e3  runs/smc13/independent/full.json" | sha256sum -c -
      - name: Fit calibration-only clue-conditioned SAE alignment and test disjoint puzzles
        run: |
          python research/real_recurrence_sae_v1/smc13_conditioned_transfer.py \
            --fetch-source \
            --original-sae-artifact runs/smc13/original \
            --independent-artifact runs/smc13/independent \
            --out runs/smc13/conditioned.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smc13-clue-conditioned-cross-teacher-transfer
          path: runs/smc13/conditioned.json
          retention-days: 90
          if-no-files-found: warn
