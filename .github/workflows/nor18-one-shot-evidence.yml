name: NOR-18 one-shot original evidence archive writer

on:
  push:
    paths:
      - '.github/workflows/nor18-one-shot-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-hash-check-and-preserve:
    if: github.ref == 'refs/heads/research/nor18-costed-prefix-frontier-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate source-locked 288 cases and audit original 12.9 MB JSON bytes
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nor18"
          python research/nor18_costed_prefix/experiment.py \
            --check --repetitions 4 --late-per-repetition 48 \
            --signed-per-repetition 12 --rational-per-repetition 12 \
            --out "$RUNNER_TEMP/nor18/nor18_full.json"
          echo "9905aa23466b98ba2068e6daf9206d35c453b8b3b75bd27c3ab7ff8f0db4041b  $RUNNER_TEMP/nor18/nor18_full.json" | sha256sum --check
          test "$(wc -c < "$RUNNER_TEMP/nor18/nor18_full.json")" -eq 12896423
          python research/nor18_costed_prefix/receipt_audit.py \
            --check --full "$RUNNER_TEMP/nor18/nor18_full.json"
      - name: Compress full original evidence bytes and verify ZIP contents
        run: |
          set -euo pipefail
          zip -q -X -j \
            research/nor18_costed_prefix/results/nor18_full.zip \
            "$RUNNER_TEMP/nor18/nor18_full.json"
          test "$(unzip -p research/nor18_costed_prefix/results/nor18_full.zip nor18_full.json | sha256sum | awk '{print $1}')" = \
            9905aa23466b98ba2068e6daf9206d35c453b8b3b75bd27c3ab7ff8f0db4041b
      - name: Commit source-locked original ZIP on isolated research branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/nor18_costed_prefix/results/nor18_full.zip
          git diff --cached --check
          git commit -m "NOR-18: archive full 288-case coefficient-work frontier evidence ZIP"
          git push origin "HEAD:research/nor18-costed-prefix-frontier-20261116"
