name: FC-09 train-only conjunctive AND/OR exact source

on:
  push:
    paths:
      - 'research/refutation_bench/fc09/train_data.py'
      - 'research/refutation_bench/tests/test_fc09_train.py'
      - '.github/workflows/refutation-fc09-train.yml'
  pull_request:
    paths:
      - 'research/refutation_bench/fc09/train_data.py'
      - 'research/refutation_bench/tests/test_fc09_train.py'
      - '.github/workflows/refutation-fc09-train.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-fc09-train:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source anti-leak, actual AND rules and finite certificates
        run: |
          python -m unittest research.refutation_bench.tests.test_fc09_train -v
      - name: Generate canonical frozen train source and Lean proofs
        run: |
          python -m research.refutation_bench.fc09.train_data \
            --out /tmp/FC09_train.jsonl \
            --lean /tmp/FC09_train.lean \
            --receipt /tmp/FC09_train_receipt.json
      - name: Install Lean 4.19.0
        run: |
          curl --fail --location --retry 3 \
            https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst \
            -o /tmp/lean-4.19.0-linux.tar.zst
          tar --zstd -xf /tmp/lean-4.19.0-linux.tar.zst -C /tmp
          echo /tmp/lean-4.19.0-linux/bin >> "$GITHUB_PATH"
      - name: Kernel compile every training and development positive proof
        run: |
          lean /tmp/FC09_train.lean 2>&1 | tee /tmp/FC09_train_lean.log
          if grep -E 'error:|sorryAx' /tmp/FC09_train_lean.log; then exit 1; fi
          test "$(grep -c 'does not depend on any axioms' /tmp/FC09_train_lean.log)" -ge 2
      - name: Preserve canonical source hashes and Lean logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fc09-train-only-${{ github.run_id }}
          path: |
            /tmp/FC09_train.jsonl
            /tmp/FC09_train.lean
            /tmp/FC09_train_receipt.json
            /tmp/FC09_train_lean.log
          retention-days: 30
          if-no-files-found: warn
