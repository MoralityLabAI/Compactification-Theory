name: SMC-15 active native SAE erasure on fresh Sudoku cohorts

on:
  push:
    paths:
      - 'research/real_recurrence_sae_v1/SMC15_PROTOCOL.md'
      - 'research/real_recurrence_sae_v1/smc15_active_necessity.py'
      - 'research/real_recurrence_sae_v1/test_smc15_active_necessity.py'
      - 'research/real_recurrence_sae_v1/audit_smc15.py'
      - 'research/real_recurrence_sae_v1/test_audit_smc15.py'
      - '.github/workflows/smc15-active-native-erasure.yml'
  pull_request:
    paths:
      - 'research/real_recurrence_sae_v1/SMC15_PROTOCOL.md'
      - 'research/real_recurrence_sae_v1/smc15_active_necessity.py'
      - 'research/real_recurrence_sae_v1/test_smc15_active_necessity.py'
      - 'research/real_recurrence_sae_v1/audit_smc15.py'
      - 'research/real_recurrence_sae_v1/test_audit_smc15.py'
      - '.github/workflows/smc15-active-native-erasure.yml'
  workflow_dispatch:

jobs:
  exact-checks-and-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-compatible CPU PyTorch
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Native active atom selection and independent stdlib audit regressions
        run: |
          python -m unittest discover -s research/real_recurrence_sae_v1 -p 'test_smc15_active_necessity.py' -v
          python -m unittest discover -s research/real_recurrence_sae_v1 -p 'test_audit_smc15.py' -v
      - name: Fetch original pretrained teacher SAE and source receipt
        uses: actions/download-artifact@v4
        with:
          name: smc11c-source-locked-same-fit-full
          run-id: 43721281348
          github-token: ${{ github.token }}
          path: runs/smc15/original
      - name: Fetch independently trained recurrent teachers and four SAE snapshots
        uses: actions/download-artifact@v4
        with:
          name: smc13-independent-noncanonical-teachers
          run-id: 43728006836
          github-token: ${{ github.token }}
          path: runs/smc15/independent
      - name: Fetch frozen SMC-13C clue-conditioned feature mappings
        uses: actions/download-artifact@v4
        with:
          name: smc13-clue-conditioned-cross-teacher-transfer
          run-id: 43729335868
          github-token: ${{ github.token }}
          path: runs/smc15/conditioned
      - name: Pin original receipts before intervention
        run: |
          echo "7caafcb54e36f508b49a082892b689789a751f86b52d6d206e955e3782431087  runs/smc15/original/joint-full.json" | sha256sum -c -
          echo "1fc69e15c24087f631806a89d55beaf519c2f6ab58ac7b8193cf8fdc36d240e3  runs/smc15/independent/full.json" | sha256sum -c -
          echo "3b4637699d5af236af2d3b8aa5d04e024025b16e0d59395535892c104d472d07  runs/smc15/conditioned/conditioned.json" | sha256sum -c -
      - name: Source-frozen four-puzzle native feature erasure pilot
        run: python research/real_recurrence_sae_v1/smc15_active_necessity.py --fetch-source --original-artifact runs/smc15/original --independent-artifact runs/smc15/independent --conditioned-receipt runs/smc15/conditioned/conditioned.json --pilot-puzzles 4 --pair-limit 1 --out runs/smc15/pilot.json
      - name: Independent audit of pilot
        run: python research/real_recurrence_sae_v1/audit_smc15.py --receipt runs/smc15/pilot.json --out runs/smc15/pilot-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smc15-active-native-erasure-pilot
          path: |
            runs/smc15/pilot.json
            runs/smc15/pilot-audit.json
          retention-days: 90
          if-no-files-found: warn

  fresh-128p-four-pair-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-compatible CPU PyTorch
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Fetch original pretrained teacher SAE and source receipt
        uses: actions/download-artifact@v4
        with:
          name: smc11c-source-locked-same-fit-full
          run-id: 43721281348
          github-token: ${{ github.token }}
          path: runs/smc15/original
      - name: Fetch independently trained recurrent teachers and four SAE snapshots
        uses: actions/download-artifact@v4
        with:
          name: smc13-independent-noncanonical-teachers
          run-id: 43728006836
          github-token: ${{ github.token }}
          path: runs/smc15/independent
      - name: Fetch frozen SMC-13C clue-conditioned feature mappings
        uses: actions/download-artifact@v4
        with:
          name: smc13-clue-conditioned-cross-teacher-transfer
          run-id: 43729335868
          github-token: ${{ github.token }}
          path: runs/smc15/conditioned
      - name: Strict frozen source receipt checks
        run: |
          echo "7caafcb54e36f508b49a082892b689789a751f86b52d6d206e955e3782431087  runs/smc15/original/joint-full.json" | sha256sum -c -
          echo "1fc69e15c24087f631806a89d55beaf519c2f6ab58ac7b8193cf8fdc36d240e3  runs/smc15/independent/full.json" | sha256sum -c -
          echo "3b4637699d5af236af2d3b8aa5d04e024025b16e0d59395535892c104d472d07  runs/smc15/conditioned/conditioned.json" | sha256sum -c -
      - name: All four active-matched erasures over two independent 64-puzzle families
        run: python research/real_recurrence_sae_v1/smc15_active_necessity.py --fetch-source --original-artifact runs/smc15/original --independent-artifact runs/smc15/independent --conditioned-receipt runs/smc15/conditioned/conditioned.json --out runs/smc15/full.json
      - name: Independent stdlib replay of calibration, dose, scores and registered gates
        run: python research/real_recurrence_sae_v1/audit_smc15.py --receipt runs/smc15/full.json --out runs/smc15/audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smc15-full-active-native-erasure-and-independent-audit
          path: |
            runs/smc15/full.json
            runs/smc15/audit.json
          retention-days: 90
          if-no-files-found: warn
