name: NOR-26 one-shot publisher of original first-run evidence

on:
  push:
    paths:
      - '.github/workflows/nor26-original-publisher.yml'

permissions:
  contents: write
  actions: read

jobs:
  preserve-original-immutable-hosted-bytes:
    if: github.ref == 'refs/heads/research/nor26-policy-aware-audit-game-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/nor26-policy-aware-audit-game-20261116
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nor26_original_public_sources_and_policyaware_game
          run-id: 43895351638
          github-token: ${{ github.token }}
          path: /tmp/nor26_first
      - name: Verify exact first-run bytes and create deterministic permanent ZIP
        run: |
          python - <<'PY'
          import json,hashlib,zipfile
          from pathlib import Path
          rec=json.loads(Path('research/nor26_policy_aware_audits/results/nor26_first_original_receipt.json').read_text())
          dst=Path('research/nor26_policy_aware_audits/results/nor26_original_hosted.zip')
          original={}
          for key in ('fixture','outcome'):
              a=rec[key]
              data=Path('/tmp/nor26_first',a['file']).read_bytes()
              assert len(data)==a['bytes']
              assert hashlib.sha256(data).hexdigest()==a['sha256']
              original[a['file']]=data
          dst.parent.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(dst,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as f:
              for name in sorted(original):
                  info=zipfile.ZipInfo(name,date_time=(2026,11,16,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0o644 << 16
                  f.writestr(info,original[name],compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          print('NOR26 FIRST RAW SOURCE-LOCKED ARCHIVE',dst.stat().st_size)
          PY
          python research/nor26_policy_aware_audits/original_archive_audit.py
      - name: Commit exact source-locked archive to preregistered branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/nor26_policy_aware_audits/results/nor26_original_hosted.zip
          git diff --cached --quiet && { echo 'Archive already committed'; exit 0; }
          git commit -m 'NOR-26: preserve immutable original first-run 12-source fixture and cross-play outcome'
          git push origin HEAD:refs/heads/research/nor26-policy-aware-audit-game-20261116
