name: SCM-21 CPU rank-four capacity audit
on:
  push:
    paths:
      - 'research/dimensional_atlas/gym/scm21_capacity/**'
      - '.github/workflows/scm21-cpu-capacity.yml'
  pull_request:
    paths:
      - 'research/dimensional_atlas/gym/scm21_capacity/**'
      - '.github/workflows/scm21-cpu-capacity.yml'
jobs:
  cpu-source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Deterministic dependency for constructed geometry control
        run: python -m pip install numpy==2.3.5
      - name: Exact count and overlap-bound regression tests
        run: python -m unittest discover -s research/dimensional_atlas/gym/scm21_capacity/tests -v
      - name: Source-locked reparse of SCM-20's full public summary
        run: |
          python research/dimensional_atlas/gym/scm21_capacity/analysis.py \
            --source research/dimensional_atlas/gym/scm20_causal_consistency/results/summary.json \
            --check
      - name: Deterministic synthetic control replay
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python research/dimensional_atlas/gym/scm21_capacity/synthetic.py --check
