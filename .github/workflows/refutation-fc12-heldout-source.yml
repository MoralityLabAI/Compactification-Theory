name: FC-12 untouched original MathCan typed-action heldout source

on:
  push:
    paths:
      - 'research/refutation_bench/fc12/test_data.py'
      - 'research/refutation_bench/tests/test_fc12_test.py'
      - '.github/workflows/refutation-fc12-heldout-source.yml'
  pull_request:
    paths:
      - 'research/refutation_bench/fc12/test_data.py'
      - 'research/refutation_bench/tests/test_fc12_test.py'
      - '.github/workflows/refutation-fc12-heldout-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-untouched-heldout:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact original MathCan revision, separate from frozen train-only source
        uses: actions/checkout@v4
        with:
          repository: patrickdugan/MathCan
          ref: c84e2025334e9a967c1297425a490f98d5b3d189
          path: _mathcan
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate four original heldout modules and exactly sixteen theorem names
        run: |
          python -m unittest research.refutation_bench.tests.test_fc12_test -v
          test "$(git -C _mathcan rev-parse HEAD)" = c84e2025334e9a967c1297425a490f98d5b3d189
      - name: Emit original heldout theorems with read-only intermediate state tracing
        run: |
          python -m research.refutation_bench.fc12.test_data \
            --source _mathcan --out /tmp/fc12_test
      - name: Install pinned Lean4.35
        run: |
          curl --fail --location --retry 3 \
            https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst \
            -o /tmp/lean435.tar.zst
          tar --zstd -xf /tmp/lean435.tar.zst -C /tmp
          echo /tmp/lean-4.35.0-linux/bin >> "$GITHUB_PATH"
      - name: Kernel-compile every original theorem proof and extract actual test tactic states
        run: |
          for file in /tmp/fc12_test/*.lean; do
            lean "$file" > "${file%.lean}.log" 2>&1
            if grep -E 'error:|sorryAx' "${file%.lean}.log"; then exit 1; fi
          done
          python -m research.refutation_bench.fc12.test_data \
            --out /tmp/fc12_test --extract
          sha256sum /tmp/fc12_test/actual_goal_states.jsonl
      - name: Store untouched exact test corpus, kernel logs and source digests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fc12-original-heldout-source-${{ github.run_id }}
          path: /tmp/fc12_test/
          retention-days: 30
          if-no-files-found: warn
