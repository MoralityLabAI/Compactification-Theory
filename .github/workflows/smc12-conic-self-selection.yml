name: SMC-12 frozen SAE exact angular cone certificates

on:
  push:
    paths:
      - 'research/real_recurrence_sae_v1/conic_self_selection_exact.py'
      - 'research/real_recurrence_sae_v1/smc12_cones.py'
      - 'research/real_recurrence_sae_v1/smc12_dictionary_controls.py'
      - 'research/real_recurrence_sae_v1/test_smc12_dictionary_controls.py'
      - 'research/real_recurrence_sae_v1/test_smc12_cones.py'
      - '.github/workflows/smc12-conic-self-selection.yml'
  pull_request:
    paths:
      - 'research/real_recurrence_sae_v1/conic_self_selection_exact.py'
      - 'research/real_recurrence_sae_v1/smc12_cones.py'
      - 'research/real_recurrence_sae_v1/smc12_dictionary_controls.py'
      - 'research/real_recurrence_sae_v1/test_smc12_dictionary_controls.py'
      - 'research/real_recurrence_sae_v1/test_smc12_cones.py'
      - '.github/workflows/smc12-conic-self-selection.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  pure-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU Torch for imported source helpers
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Test exact cone mathematics without source teacher data
        run: python -m unittest discover -s research/real_recurrence_sae_v1 -p 'test_smc12_cones.py' -v
      - name: Export exact-rational standalone cone toy receipt
        run: python research/real_recurrence_sae_v1/conic_self_selection_exact.py > olm12-toy.json
      - uses: actions/upload-artifact@v4
        with:
          name: smc12-olm12-toy
          path: olm12-toy.json
          if-no-files-found: warn

  exact-frozen-sae-cones:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original CPU Torch version used by source-trained SAE
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Run exact cone and provenance tampering regression tests
        run: python -m unittest discover -s research/real_recurrence_sae_v1 -p 'test_smc12_cones.py' -v
      - name: Retrieve verified SAME-FIT SAE weights and original 480-causal receipt
        uses: actions/download-artifact@v4
        with:
          name: smc11c-source-locked-same-fit-full
          run-id: 43721281348
          github-token: ${{ github.token }}
          path: runs/smc12/smc11-frozen
      - name: Strictly verify original source receipt and all three SAE binaries
        run: |
          echo "7caafcb54e36f508b49a082892b689789a751f86b52d6d206e955e3782431087  runs/smc12/smc11-frozen/joint-full.json" | sha256sum -c -
          echo "00542304e1f15f606a20519d59c7617d574a4f0266c9a33b2220cf146015c3da  runs/smc12/smc11-frozen/joint-frozen-weights/sae_seed71.pt" | sha256sum -c -
          echo "ba0bfd9d82d68bd3398bb37e8b7539d93dff6d4e21f153d44bfa9f1ccae2ebcb  runs/smc12/smc11-frozen/joint-frozen-weights/sae_seed89.pt" | sha256sum -c -
          echo "087787bcfdd4d4350b56595049c07a7fd62bfd7db69f52258905a872e1f5b5af  runs/smc12/smc11-frozen/joint-frozen-weights/sae_seed113.pt" | sha256sum -c -
      - name: Exact trained-vs-initial dictionary control regression tests
        run: python -m unittest discover -s research/real_recurrence_sae_v1 -p 'test_smc12_dictionary_controls.py' -v
      - name: Compute all 48 exact angular cones, 96 hyperplanes each
        run: |
          python research/real_recurrence_sae_v1/smc12_cones.py \
            --artifact-dir runs/smc12/smc11-frozen \
            --out runs/smc12/cones-full.json
      - name: Exact 288-atom train versus original-initialization cone audit
        run: |
          python research/real_recurrence_sae_v1/smc12_dictionary_controls.py \
            --artifact-dir runs/smc12/smc11-frozen \
            --out runs/smc12/dictionary-control.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smc12-exact-48-source-locked-angular-cones
          path: |
            runs/smc12/cones-full.json
            runs/smc12/dictionary-control.json
          retention-days: 90
          if-no-files-found: warn
