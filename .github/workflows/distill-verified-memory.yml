name: Distill verified research memory
on:
  pull_request:
    paths:
      - 'Distill/verified_memory.py'
      - 'Distill/tests/test_verified_memory.py'
      - '.github/workflows/distill-verified-memory.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-memory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.2.6
      - run: python -m unittest discover -s Distill/tests -p test_verified_memory.py -v
      - run: python -m Distill.verified_memory --out /tmp/distill-verified-memory
      - uses: actions/upload-artifact@v4
        with:
          name: distill-14-verified-memory
          path: /tmp/distill-verified-memory/
          if-no-files-found: error
          retention-days: 30
