name: NOR-17 one-shot source-locked full 288-case evidence archival writer

on:
  push:
    paths:
      - '.github/workflows/nor17-one-shot-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reproduce-and-preserve-full-evidence:
    if: github.ref == 'refs/heads/research/nor17-prefix-certificate-budgets-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce all 288 source-locked cases under frozen budgets and original SHA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nor17"
          python research/nor17_prefix_certificates/experiment.py \
            --check --repetitions 4 --late-per-repetition 48 \
            --signed-per-repetition 12 --rational-per-repetition 12 \
            --out "$RUNNER_TEMP/nor17/nor17_full.json"
          echo "827b9aab53674567d7aa77c655e33c8800ba9a7372a0f3bdc889cdbf4d9c6b7b  $RUNNER_TEMP/nor17/nor17_full.json" | sha256sum --check
          test "$(wc -c < "$RUNNER_TEMP/nor17/nor17_full.json")" -eq 4174026
          python research/nor17_prefix_certificates/receipt_audit.py \
            --check --full "$RUNNER_TEMP/nor17/nor17_full.json"
      - name: Preserve byte-identical original source JSON in compressed Git evidence file
        run: |
          set -euo pipefail
          zip -q -X -j \
            research/nor17_prefix_certificates/results/nor17_full.zip \
            "$RUNNER_TEMP/nor17/nor17_full.json"
          test "$(unzip -p research/nor17_prefix_certificates/results/nor17_full.zip nor17_full.json | sha256sum | awk '{print $1}')" = \
            827b9aab53674567d7aa77c655e33c8800ba9a7372a0f3bdc889cdbf4d9c6b7b
      - name: Commit frozen experiment evidence on isolated research branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/nor17_prefix_certificates/results/nor17_full.zip
          git diff --cached --check
          git commit -m "NOR-17: preserve 288-case full 4/8/16 public certificate evidence ZIP"
          git push origin "HEAD:research/nor17-prefix-certificate-budgets-20261116"
