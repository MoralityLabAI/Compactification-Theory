name: NOR-60 one-shot original first evidence archive
on:
  push:
    branches:
      - research/nor60-capstone-20261118
    paths:
      - '.github/workflows/nor60-first-evidence-publisher.yml'
permissions:
  contents: read
jobs:
  preserve-original-bytes:
    if: contains(github.event.head_commit.message, 'NOR60-ARCHIVE-ORIGINAL') && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/nor60-capstone-20261118
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download the exact original artifact and verify its observed hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/MoralityLabAI/Compactification-Theory/actions/artifacts/14436529899/zip > /tmp/nor60_original_hosted.zip
          python research/nor60_authorized_interpreter/archive_first.py --input-zip /tmp/nor60_original_hosted.zip
      - name: Commit original evidence once
        run: |
          python -m pip install --disable-pip-version-check cryptography==46.0.4 gmpy2==2.3.2
          python research/nor60_authorized_interpreter/original_archive_audit.py
      - name: Preserve audited archive in the branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/nor60_authorized_interpreter/results/nor60_first_original_hosted.zip research/nor60_authorized_interpreter/results/nor60_first_receipt.json
          git commit -m 'Archive byte-identical original NOR60 first CPU source and journal evidence'
          git push origin HEAD:research/nor60-capstone-20261118
