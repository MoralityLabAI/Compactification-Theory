name: SCM-10 scalable causal ball enclosures

on:
  push:
    paths:
      - "research/seifert_activation/**"
      - ".github/workflows/scm10-causal-ball.yml"
  pull_request:
    paths:
      - "research/seifert_activation/**"
      - ".github/workflows/scm10-causal-ball.yml"

permissions:
  contents: read

jobs:
  full-shape-cpu-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned CPU proof dependencies
        run: |
          python -m pip install numpy==2.3.5 sympy==1.14.0 mpmath==1.3.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile SCM-10
        run: python -m compileall -q research/seifert_activation
      - name: Check independent numerical and full-shape tests
        run: |
          python -m unittest discover -s research/seifert_activation/tests -p 'test_scm10_fast.py' -v
      - name: Check frozen reference sources and thresholds
        run: |
          python research/seifert_activation/scm10_reference.py --out research/seifert_activation/results/scm10_cpu_reference.json --check
