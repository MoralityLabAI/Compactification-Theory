name: SHAFT compactification (abstract finite reference)

on:
  pull_request:
    paths:
      - 'research/shaft_compactification/**'
      - '.github/workflows/shaft-compactification.yml'
  push:
    paths:
      - 'research/shaft_compactification/**'
      - '.github/workflows/shaft-compactification.yml'
  workflow_dispatch:

jobs:
  finite-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check optional GRU script syntax and frozen receipt schema
        run: |
          python -m py_compile research/shaft_compactification/experiments/trained_recurrence.py
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('research/shaft_compactification/results/trained_recurrence.json').read_text())
          assert r['training']['seeds'] == [101, 202]
          for seed in ('101', '202'):
              metrics = r['results'][seed]['depth']['64']
              assert metrics['explicit_reseed_from_code_at_32']['last_eight_steps'] > 0.90
              assert metrics['midrun_erasure_at_32']['last_eight_steps'] < 0.60
          print('Trained GRU receipt schema verified; retraining remains opt-in')
          PY
      - name: Check SHAFT-COMP-07 script and frozen summary
        run: |
          python -m py_compile research/shaft_compactification/experiments/predictive_state.py
          python -m research.shaft_compactification.behavioral_budget > /tmp/shaft-budget.json
          python - <<'PY'
          import json
          from pathlib import Path
          budget = json.loads(Path('/tmp/shaft-budget.json').read_text())
          assert budget['ceiling_successes_for_16_uniform_goals'] == {str(k): 2**k for k in range(5)}
          r = json.loads(Path('research/shaft_compactification/results/predictive_state_summary.json').read_text())
          assert r['base_seeds'] == [101, 202]
          assert r['probe_train_depths'] == [4, 8, 12]
          for seed in ('101', '202'):
              results = r['results'][seed]
              assert results['exact_true_goal_by_depth']['12'] == 1.0
              assert results['shuffled_label_exact_true_goal_at_12'] < 0.15
          full = json.loads(Path('research/shaft_compactification/results/predictive_state.json').read_text())
          assert full['training']['probe_supervision'].endswith('no goal IDs')
          for seed in ('101', '202'):
              for depth, measured in full['models'][seed]['independent_test'].items():
                  assert measured['probe_exact_true_goal_rate'] == r['results'][seed]['exact_true_goal_by_depth'][depth]
                  assert measured['probe_vs_true_goal_bit_accuracy'] == r['results'][seed]['probe_bit_accuracy_by_depth'][depth]
                  assert measured['teacher_vs_true_goal_bit_accuracy'] == r['results'][seed]['teacher_bit_accuracy_by_depth'][depth]
          for direction, record in full['cross_substrate'].items():
              assert record['behavioral_code_transfer']['semantic_code_inferred_from_source'] == r['cross_substrate'][direction]['semantic_code_inferred_from_source']
          print('SHAFT-COMP-07 source, counting identity, and full/summary receipt agreement verified')
          PY
      - name: Run synthetic finite tests
        run: python -m unittest discover -s research/shaft_compactification/tests -v
      - name: Reproduce SHAFT-COMP-06 finite quotient receipt
        run: |
          python -m research.shaft_compactification.depth_quotient > /tmp/shaft-depth-reference.json
          python - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('research/shaft_compactification/results/depth_quotient.json').read_text())
          actual = json.loads(Path('/tmp/shaft-depth-reference.json').read_text())
          assert expected == actual, 'SHAFT-COMP-06 depth quotient receipt drift'
          PY
      - name: Compare deterministic reference receipt
        run: |
          python -m research.shaft_compactification.experiment > /tmp/shaft-comp-reference.json
          python - <<'PY'
          import json
          from pathlib import Path
          prefix = Path('research/shaft_compactification/results/reference.json')
          expected = json.loads(prefix.read_text())
          observed = json.loads(Path('/tmp/shaft-comp-reference.json').read_text())
          assert observed == expected, 'SHAFT-COMP-05 reference drift'
          assert observed['heldout_distinguishable_pairs'] == observed['goal_pairs']
          print('Reproduced synthetic reference')
          PY

  lean-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lean 4 abstract observability proofs
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: research/shaft_compactification/lean
          auto-config: false
          build: true
          test: false
          use-mathlib-cache: false
      - name: Print Lean axiom dependencies
        working-directory: research/shaft_compactification/lean
        run: lake env lean Shaft/Observability.lean
