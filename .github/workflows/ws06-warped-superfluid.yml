name: WS-06 finite-momentum charged probe and GI 4D EFT
on:
  pull_request:
    paths:
      - 'research/warped_superfluid_v6/**'
      - '.github/workflows/ws06-warped-superfluid.yml'
  push:
    paths:
      - 'research/warped_superfluid_v6/**'
      - '.github/workflows/ws06-warped-superfluid.yml'
  workflow_dispatch:
jobs:
  verify-ws06:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install -r research/warped_superfluid_v6/requirements.txt
      - name: Run the 26 regression gates
        working-directory: research/warped_superfluid_v6
        run: python -m unittest discover -s tests -v
      - name: Reproduce the charged-probe and GI-EFT results
        working-directory: research/warped_superfluid_v6
        run: python run_experiment.py
      - name: Archive reproducible figure and numerical evidence
        uses: actions/upload-artifact@v4
        with:
          name: ws06-goldstone-and-gi-eft
          path: research/warped_superfluid_v6/results/
          retention-days: 30
