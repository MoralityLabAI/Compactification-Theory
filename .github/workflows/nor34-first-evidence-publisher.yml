name: NOR-34 one-shot preserve original registered 8-atom source and full result

on:
  push:
    paths:
      - '.github/workflows/nor34-first-evidence-publisher.yml'

permissions:
  contents: write
  actions: read

jobs:
  preserve-original-first-source-locked-eight-atom-pass:
    if: github.ref == 'refs/heads/research/nor34-eight-atom-curvature-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/nor34-eight-atom-curvature-20261117
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nor34_original_24_sources_curvature_coarse_eight_atom_outcome
          run-id: 44054626746
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/nor34-first
      - name: Pin exact original public fixture and complete preregistered result bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile,ZipInfo,ZIP_DEFLATED
          import json
          root=Path('/tmp/nor34-first')
          expected={
            'nor34_fixture.json':(5011440,
                '1cbf58a851df898a6e46fe4859d25ac5cf5b68a2e2b3e81d8e7afeede8dacb00'),
            'nor34_full.json':(337379,
                '4507769666f5560d33b8a0c99b4b5c85c5c2710b88e0021e77a85679106f6bd3')
          }
          raw={}
          for name,(size,digest) in expected.items():
            x=(root/name).read_bytes()
            assert len(x)==size,(name,len(x))
            assert sha256(x).hexdigest()==digest,name
            raw[name]=x
          fixture=json.loads(raw['nor34_fixture.json'])
          result=json.loads(raw['nor34_full.json'])
          assert fixture['schema']=='nor34.new_public_only_reps44to47.v1'
          assert result['schema']=='nor34.sourceheldout_eight_atom_curvature_residual.v1'
          assert fixture['registration_commit']==result['preregistered_first_commit']==(
            'ef6d7b4d0374d0310a640258d94eaf474fb66c4b')
          assert len(fixture['cases'])==len(result['source_records'])==24
          assert result['source_public_fixture_sha256']==expected['nor34_fixture.json'][1]
          assert result['registered_primary_pass']
          assert all(result['preregistered_five_gates'].values())
          assert result['coarse_residual_positive_sources']==24
          assert result['fine_residual_attenuation_sources']==24
          assert result['frozen_mix_weights']==[2,0,1,1,4,8]
          assert result['excluded_historic_sources']==84
          assert result['paired_attack_laws']==['curvature','coarse','eight_atom']
          assert abs(result['source_theoretical_coarse_residual_mean']-
                     .026741264531509462)<1e-14
          assert abs(result['source_theoretical_fine_residual_mean']-
                     .000032045038645887924)<1e-14
          results=Path('research/nor34_eight_atom_curvature/results')
          results.mkdir(parents=True,exist_ok=True)
          archive=results/'nor34_original_hosted.zip'
          with ZipFile(archive,'w',ZIP_DEFLATED,compresslevel=9) as z:
            for name,x in raw.items():
              info=ZipInfo(name,(2026,11,17,0,0,0))
              info.compress_type=ZIP_DEFLATED
              z.writestr(info,x,compress_type=ZIP_DEFLATED,compresslevel=9)
          receipt={
            'schema':'nor34.original_first_preregistered_eight_atom_curvature.v1',
            'date_utc':'2026-11-17',
            'first_registration_commit':'ef6d7b4d0374d0310a640258d94eaf474fb66c4b',
            'original_green_run':'https://github.com/MoralityLabAI/Compactification-Theory/actions/runs/44054626746',
            'original_artifact_id':14314703934,
            'original_artifact_name':'nor34_original_24_sources_curvature_coarse_eight_atom_outcome',
            'file_bytes_sha256':{name:{'bytes':size,'sha256':dig}
                                 for name,(size,dig) in expected.items()},
            'new_public_source_units':24,
            'historical_public_source_units_excluded':84,
            'original_paired_attack_triplets':384,
            'all_original_policy_world_decisions_replayed':3538944,
            'direct_authentic_integer_witness_pairs_checked':27648,
            'frozen_mix_quanta':[2,0,1,1,4,8],
            'coarse_residual_positive_source_count':24,
            'fine_residual_attenuation_source_count':24,
            'original_mean_coarse_residual':result['source_theoretical_coarse_residual_mean'],
            'original_mean_fine_residual':result['source_theoretical_fine_residual_mean'],
            'original_fraction_explained':result['source_mean_residual_fraction_explained'],
            'original_empirical_mean_coarse':result['source_empirical_coarse_residual_mean'],
            'original_empirical_mean_fine':result['source_empirical_fine_residual_mean'],
            'original_preregistered_five_gates':result['preregistered_five_gates'],
            'original_registered_primary_pass':True,
            'independent_exact_replay_passed':True,
            'scope':'Finite exact RRC25. Eight public old-risk membership categories; independent attack sets and audits assume authentic external target coefficient witness and private audit randomness.'
          }
          (results/'nor34_first_frozen_receipt.json').write_text(
              json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('NOR34 FIRST SOURCE-CONTROLLED ORIGINAL ARCHIVE BYTES SHA',
                len(archive.read_bytes()),sha256(archive.read_bytes()).hexdigest())
          PY
      - name: Independently reconstruct exact original fixture and grade before committing
        run: |
          python research/nor34_eight_atom_curvature/receipt_audit.py --check \
            --fixture /tmp/nor34-first/nor34_fixture.json \
            --full /tmp/nor34-first/nor34_full.json
      - name: Persist original source and result bytes with immutable receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/nor34_eight_atom_curvature/results/nor34_original_hosted.zip \
                  research/nor34_eight_atom_curvature/results/nor34_first_frozen_receipt.json
          git commit -m "NOR-34: preserve original preregistered eight-atom PASS and SHA-locked evidence"
          git push origin HEAD:research/nor34-eight-atom-curvature-20261117
