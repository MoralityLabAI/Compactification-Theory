name: BGI-01C Qwen 0.5B order-calibration pilot

on:
  push:
    branches:
      - research/bgi01c-qwen-order-invariant-20261030
    paths:
      - 'research/bgi_attractors_v1/model_eval/**'
      - '.github/workflows/bgi01c-qwen-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qwen-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONHASHSEED: "20261030"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Offline oracle and answer-swap tests
        run: |
          python -m unittest discover -s research/bgi_attractors_v1/model_eval/tests -v
      - name: Install pinned CPU inference dependencies
        run: |
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check transformers==4.46.3 huggingface_hub==0.27.1 safetensors==0.4.5
      - name: Run 288 paired Qwen CPU model forwards
        run: |
          python -u research/bgi_attractors_v1/model_eval/runner_v2.py
      - name: Validate full receipt and frozen model revision
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path("research/bgi_attractors_v1/model_eval/results/qwen2p5_05b_order_invariant_v1.json")
          r = json.loads(p.read_text())
          data = r["payload"]
          canon = json.dumps(data, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode()
          assert hashlib.sha256(canon).hexdigest() == r["sha256"]
          assert data["n_forward_calls"] == 288 and data["n_task_pairs"] == 144
          assert len(data["traces"]) == 144 and len(data["aggregates"]) == 12
          assert data["model_rev"] == "7ae557604adf67be50417f59c2c2f167def9a775"
          assert data["order_agreement_pass_fraction"] == 0.75
          for trace in data["traces"]:
              assert trace["input_tokens_regular"] <= 512
              assert trace["input_tokens_swapped"] <= 512
              assert trace["literal_regular"] in ("A", "B")
              assert trace["literal_swapped"] in ("A", "B")
              assert trace["model_evidence"]["original"]["method"] == "real_fp32_cpu_logits"
              assert trace["model_evidence"]["swapped"]["method"] == "real_fp32_cpu_logits"
          print("BGI-01C artifact completeness and digest VERIFIED", r["sha256"])
          PY
      - name: Upload complete option-swapped replay evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bgi01c-qwen05b-order-swapped-real-pilot
          path: research/bgi_attractors_v1/model_eval/results/qwen2p5_05b_order_invariant_v1.json
          if-no-files-found: warn
          retention-days: 30
