name: WS-01 Warped Superfluid

on:
  pull_request:
    paths:
      - 'research/warped_superfluid_v1/**'
      - '.github/workflows/ws01-warped-superfluid.yml'
  push:
    paths:
      - 'research/warped_superfluid_v1/**'
      - '.github/workflows/ws01-warped-superfluid.yml'

jobs:
  numerical-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical requirements
        run: python -m pip install -r research/warped_superfluid_v1/requirements.txt
      - name: Run eight reference tests
        working-directory: research/warped_superfluid_v1
        run: python -m unittest discover -s tests -v
      - name: Generate numerical results
        working-directory: research/warped_superfluid_v1
        run: python run_experiment.py > /dev/null
