name: SCM-09 verified centered exact-real intervals

on:
  push:
    paths:
      - "research/seifert_activation/**"
      - ".github/workflows/scm09-verified-centered.yml"
  pull_request:
    paths:
      - "research/seifert_activation/**"
      - ".github/workflows/scm09-verified-centered.yml"

permissions:
  contents: read

jobs:
  interval-proof-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install source-locked CPU dependencies
        run: |
          python -m pip install sympy==1.14.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile exact-real interval verifier
        run: python -m compileall -q research/seifert_activation
      - name: Test independently validated interval arithmetic
        run: |
          python -m unittest discover -s research/seifert_activation/tests -p 'test_validated_forward.py' -v
          python -m unittest discover -s research/seifert_activation/tests -p 'test_scm09_audit.py' -v
          python -m unittest discover -s research/seifert_activation/tests -p 'test_scm09_reference.py' -v
      - name: Regenerate and check source-bound synthetic receipt
        run: |
          python research/seifert_activation/scm09_reference.py --out research/seifert_activation/results/scm09_cpu_reference.json --check
