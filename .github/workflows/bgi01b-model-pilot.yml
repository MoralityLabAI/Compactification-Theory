name: BGI-01B pinned 135M behavioral pilot

on:
  push:
    branches:
      - research/bgi01b-smollm-model-pilot-20261030
    paths:
      - 'research/bgi_attractors_v1/model_eval/**'
      - '.github/workflows/bgi01b-model-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-real-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONHASHSEED: "20261030"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Validate frozen fixture world without ML packages
        run: |
          python -m unittest discover -s research/bgi_attractors_v1/model_eval/tests -v
      - name: Install explicitly pinned CPU inference dependencies
        run: |
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check transformers==4.46.3 huggingface_hub==0.27.1 safetensors==0.4.5
      - name: Run genuine SmolLM2 forward inference across all paired cases
        run: |
          python -u research/bgi_attractors_v1/model_eval/runner.py
      - name: Check provenance and trace completeness independently
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          path = Path("research/bgi_attractors_v1/model_eval/results/smollm2_135m_pilot_v1.json")
          doc = json.loads(path.read_text())
          data = doc["payload"]
          canonical = json.dumps(data, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode()
          assert hashlib.sha256(canonical).hexdigest() == doc["payload_sha256"]
          assert data["n_agent_forward_calls"] == 144
          assert len(data["scenarios"]) == 144
          assert len(data["aggregate"]) == 12
          assert data["model_revision"] == "12fd25f77366fa6b3b4b768ec3050bf629380bac"
          for row in data["scenarios"]:
              ev = row["model_evidence"]
              assert ev["inference_method"] == "next_token_binary_logits_v1"
              assert ev["input_tokens"] <= 512
              assert row["choice_letter"] in ("A", "B")
              assert row["emitted"] in ("SEND", "HOLD")
          print("BGI-01B exact receipt and full model trace VERIFIED", doc["payload_sha256"])
          PY
      - name: Upload full paired-action and model-logit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bgi01b-smollm2-135m-real-pilot
          path: research/bgi_attractors_v1/model_eval/results/smollm2_135m_pilot_v1.json
          if-no-files-found: warn
          retention-days: 30
