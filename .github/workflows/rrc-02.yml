name: RRC-02 recurrent symbolic grammar CPU replay
permissions:
  contents: read
on:
  push:
    paths:
      - 'research/rrc_compactification/**'
      - '.github/workflows/rrc-02.yml'
  pull_request:
    paths:
      - 'research/rrc_compactification/**'
      - '.github/workflows/rrc-02.yml'
  workflow_dispatch:
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact oracle, split, aliasing and checkpoint integrity tests
        run: python -m unittest discover -s research/rrc_compactification -p 'test_rrc02.py' -v
      - name: Verify source-bound, fully deterministic CPU receipt
        run: python research/rrc_compactification/rrc02.py --check
