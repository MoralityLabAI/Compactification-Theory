name: NOR-21 one-shot preservation of original degree512/1024 public source and graded CPU evidence

on:
  push:
    paths:
      - '.github/workflows/nor21-one-shot-original-archive.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  archive-original-public-and-future-sealed-results:
    if: github.ref == 'refs/heads/research/nor21-degree-scaling-oog-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nor21_degree512_1024_original_public_and_sealed_grades
          run-id: 43810513348
          github-token: ${{ github.token }}
          path: /tmp/nor21-original
      - name: Require exact SHA-256 for the original first completed test
        run: |
          set -euo pipefail
          test -f /tmp/nor21-original/nor21_fixture.json
          test -f /tmp/nor21-original/nor21_full.json
          echo "c16f4b92db3f61f2753c853c01dc3d3c401c58d8e05138f0a3ca6d58e10d08c2  /tmp/nor21-original/nor21_fixture.json" | sha256sum -c
          echo "c308a73f8267ff38b78dbbb9d0df909064de0608c5dbfc4ca8f6f84e0853ed29  /tmp/nor21-original/nor21_full.json" | sha256sum -c
          test "$(wc -c < /tmp/nor21-original/nor21_fixture.json)" -eq 7248513
          test "$(wc -c < /tmp/nor21-original/nor21_full.json)" -eq 197084
      - name: Independently replay source program and hidden future after fixed decisions
        run: |
          python research/nor21_degree_scaling/receipt_audit.py --check \
            --fixture /tmp/nor21-original/nor21_fixture.json \
            --full /tmp/nor21-original/nor21_full.json
      - name: Preserve original source and sealed first-run full JSON bytes
        run: |
          set -euo pipefail
          zip -q -X -j \
            research/nor21_degree_scaling/results/nor21_original_hosted.zip \
            /tmp/nor21-original/nor21_fixture.json \
            /tmp/nor21-original/nor21_full.json
          test "$(unzip -p research/nor21_degree_scaling/results/nor21_original_hosted.zip nor21_fixture.json | sha256sum | awk '{print $1}')" = \
            c16f4b92db3f61f2753c853c01dc3d3c401c58d8e05138f0a3ca6d58e10d08c2
          test "$(unzip -p research/nor21_degree_scaling/results/nor21_original_hosted.zip nor21_full.json | sha256sum | awk '{print $1}')" = \
            c308a73f8267ff38b78dbbb9d0df909064de0608c5dbfc4ca8f6f84e0853ed29
      - name: Commit original evidence ZIP on isolated NOR-21 branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/nor21_degree_scaling/results/nor21_original_hosted.zip
          git diff --cached --check
          git commit -m "NOR-21: preserve original 36-case degree-scaled public and sealed benchmark ZIP"
          git push origin "HEAD:research/nor21-degree-scaling-oog-20261116"
