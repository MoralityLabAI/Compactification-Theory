name: NOR-08E two natural-input basin capture exact receipts

on:
  push:
    paths:
      - 'research/nor01_numerical_orbit_sketch/nor08_dual_capture_audit.py'
      - 'research/nor01_numerical_orbit_sketch/results/nor08_dual_source_capture.json'
      - '.github/workflows/nor08-dual-capture-audit.yml'
  pull_request:
    paths:
      - 'research/nor01_numerical_orbit_sketch/nor08_dual_capture_audit.py'
      - 'research/nor01_numerical_orbit_sketch/results/nor08_dual_source_capture.json'
      - '.github/workflows/nor08-dual-capture-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-disjoint-natural-source-captures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit two source-locked rational interval captures and cross-basin separation
        run: python research/nor01_numerical_orbit_sketch/nor08_dual_capture_audit.py
