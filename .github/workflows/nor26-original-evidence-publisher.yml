name: NOR-26 one-shot first original policy-aware game archive

on:
  push:
    paths:
      - '.github/workflows/nor26-original-evidence-publisher.yml'

permissions:
  contents: write
  actions: read

jobs:
  permanently-archive-original:
    if: github.ref == 'refs/heads/research/nor26-policy-aware-audit-game-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/nor26-policy-aware-audit-game-20261116
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nor26_original_public_sources_and_policyaware_game
          run-id: 43895406255
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/nor26-original
      - name: SHA-pin exact first-run public-only fixture and outcome before writing
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile,ZipInfo,ZIP_DEFLATED
          import json
          root=Path('/tmp/nor26-original')
          f=(root/'nor26_fixture.json').read_bytes()
          r=(root/'nor26_full.json').read_bytes()
          assert len(f)==2838554
          assert sha256(f).hexdigest()=='e3f5a3df07d062d8681a39a7ddcba9a981b58af6f149f13bd372daf08ac6606f'
          assert len(r)==217954
          assert sha256(r).hexdigest()=='a451897b780b024aac49f543833bc5e3ec32a734489d3f7a9b14a929bd11669a'
          fixture=json.loads(f);out=json.loads(r)
          assert fixture['schema']=='nor26.fresh_public_only_12_sources.v1'
          assert out['schema']=='nor26.policy_aware_blind_attack_crossplay.v1'
          assert len(fixture['cases'])==len(out['source_records'])==12
          assert out['registered_primary_pass']
          assert out['primary_hybrid50_vs_static_wins']==12
          assert out['primary_exact_floor_verified'] and out['primary_informed_attack_evasion_verified']
          assert out['fixture_sha256']==sha256(f).hexdigest()
          receipt={
            'schema':'nor26.original_frozen_policy_aware_game.v1',
            'date_utc':'2026-11-16',
            'preregistration_commit':'51ee62518948505754236959c77930594daea011',
            'original_run':'https://github.com/MoralityLabAI/Compactification-Theory/actions/runs/43895406255',
            'original_artifact_id':14237839468,
            'artifact_name':'nor26_original_public_sources_and_policyaware_game',
            'fixture_bytes':len(f),'fixture_sha256':sha256(f).hexdigest(),
            'full_bytes':len(r),'full_sha256':sha256(r).hexdigest(),
            'source_count':12,'calibration_schedules_per_source':256,
            'evaluation_schedules_per_source':512,
            'attack_replicates_per_source_policy':8,
            'policy_count':7,'crossplay_matrix_dimensions':[7,7],
            'selfplay_hybrid_50_mean':out['primary_hybrid50_selfplay_mean'],
            'hybrid_50_over_static_source_wins':out['primary_hybrid50_vs_static_wins'],
            'registered_primary_pass':out['registered_primary_pass'],
            'exact_floor_verified':out['primary_exact_floor_verified'],
            'informed_evasion_verified':out['primary_informed_attack_evasion_verified'],
            'scope':'Exact finite public program, assumed honest external exact witness, schedule-blind prior attacks; source-wise correlated attack replicas/challenges.'
          }
          outdir=Path('research/nor26_policy_aware_audits/results')
          outdir.mkdir(parents=True,exist_ok=True)
          archive=outdir/'nor26_original_hosted.zip'
          with ZipFile(archive,'w',ZIP_DEFLATED,compresslevel=9) as z:
            for name,data in [('nor26_fixture.json',f),('nor26_full.json',r)]:
              info=ZipInfo(name,(2026,11,16,0,0,0))
              info.compress_type=ZIP_DEFLATED
              z.writestr(info,data,compress_type=ZIP_DEFLATED,compresslevel=9)
          (outdir/'nor26_first_frozen_receipt.json').write_text(
              json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('NOR26 ORIGINAL ZIP',len(archive.read_bytes()),
                sha256(archive.read_bytes()).hexdigest())
          PY
      - name: Independently reconstruct original source programs, trained attacks, and crossplay from archive
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from research.nor26_policy_aware_audits.receipt_audit import replay
          d=Path('research/nor26_policy_aware_audits/results')
          with ZipFile(d/'nor26_original_hosted.zip') as z:
            assert z.testzip() is None
            Path('/tmp/nor26_fixture_frozen.json').write_bytes(z.read('nor26_fixture.json'))
            Path('/tmp/nor26_full_frozen.json').write_bytes(z.read('nor26_full.json'))
          replay('/tmp/nor26_fixture_frozen.json','/tmp/nor26_full_frozen.json')
          PY
      - name: Commit the original immutable evidence and first receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/nor26_policy_aware_audits/results/nor26_original_hosted.zip \
                  research/nor26_policy_aware_audits/results/nor26_first_frozen_receipt.json
          git commit -m "NOR-26: preserve original SHA-locked policy-aware game and independent replay"
          git push origin HEAD:research/nor26-policy-aware-audit-game-20261116
