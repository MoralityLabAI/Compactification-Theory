name: NOR-48 original fixed 16 signed-source CPU FAIL SHA and report audit

on:
  push:
    branches:
      - research/nor48-signed-program-r-dispatch-20261118
    paths:
      - 'research/nor48_program_dispatch/results/**'
      - 'research/nor48_program_dispatch/original_archive_audit.py'
      - 'research/nor48_program_dispatch/RESULTS.md'
      - '.github/workflows/nor48-original-evidence.yml'
  pull_request:
    paths:
      - 'research/nor48_program_dispatch/results/**'
      - 'research/nor48_program_dispatch/original_archive_audit.py'
      - 'research/nor48_program_dispatch/RESULTS.md'
      - '.github/workflows/nor48-original-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original_first_CPU_immutable_failure:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Recheck original first 27,609-byte SHA and original 0.818287 performance FAIL
        run: |
          python research/nor48_program_dispatch/original_archive_audit.py
      - name: Verify original sourcewise medians and no-R direct dispatch counts
        run: |
          python - <<'PY'
          import json,statistics
          from pathlib import Path
          raw=Path('research/nor48_program_dispatch/results/nor48_first_original_cpu.json').read_bytes()
          data=json.loads(raw)
          rows=data['source_records']
          assert len(rows)==16
          assert len([r for r in rows if r['has_R_in_authorized_program']])==12
          assert len([r for r in rows if r['direct_selected_for_no_R']])==4
          assert all(r['all_four_full_exact_outputs_and_roots_equal'] for r in rows)
          assert statistics.median(r['dispatcher_over_direct'] for r in rows)>=.75
          assert data['first_original_engineering_pass'] is False
          print('NOR48 original negative-speed observation SHA-locked')
          PY
