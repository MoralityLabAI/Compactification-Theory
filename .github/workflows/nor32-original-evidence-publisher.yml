name: NOR-32 one-shot preserve original failed scientific result and raw evidence

on:
  push:
    paths:
      - '.github/workflows/nor32-original-evidence-publisher.yml'

permissions:
  contents: write
  actions: read

jobs:
  preserve-original-preregistered-fail:
    if: github.ref == 'refs/heads/research/nor32-unseen-support-transfer-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/nor32-unseen-support-transfer-20261117
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nor32_first_original_public_24_sources_and_ood_full_outcome
          run-id: 44042332472
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/nor32-original
      - name: Pin original first source-only fixture, original complete FAIL and evidence SHA256
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile,ZipInfo,ZIP_DEFLATED
          directory=Path('/tmp/nor32-original')
          original={
            'nor32_fixture.json':(3892735,'129dba8ef9b1ae64edf58f9b71d6de761c3f4ca4fe5be4224e2495e3353518b7'),
            'nor32_full.json':(1142260,'4b475c62c7289574c9ff74b67e2634f9094b9c60f4d296269588cbe591bed0e9')
          }
          raw={}
          for name,(size,digest) in original.items():
            b=(directory/name).read_bytes()
            assert len(b)==size
            assert sha256(b).hexdigest()==digest
            raw[name]=b
          fixture=json.loads(raw['nor32_fixture.json'])
          result=json.loads(raw['nor32_full.json'])
          assert fixture['schema']=='nor32.fresh_public_only_reps32to35.v1'
          assert result['schema']=='nor32.unseen_six_support_equal_budget_transfer.v1'
          assert len(fixture['cases'])==len(result['source_records'])==24
          assert result['public_fixture_sha256']==original['nor32_fixture.json'][1]
          assert result['frozen_mixture_weights']==[2,0,1,1,4,8]
          assert result['registered_primary_pass'] is False
          assert result['registered_five_gates']=={
              'blind_ood_mean_and_source_wins':False,
              'worst_family_source_wins':True,
              'retain_60pct_of_pure_uniform_ood':True,
              'calibrated_ood_and_legacy_template_retention':True,
              'source_witness_floor_replay_controls':True}
          assert result['primary_ood_blind_source_wins']==4
          assert result['primary_worst_family_source_wins']==24
          assert result['primary_policyaware_ood_source_wins']==19
          assert result['primary_legacy_relative_retention_source_count']==22
          receipt={
             'schema':'nor32.original_first_preregistered_ood_support_transfer.v1',
             'registered_date_utc':'2026-11-17',
             'first_registration_commit':'07f0f91211c21b3a7ed540ebcb246faffc7377e0',
             'first_original_completed_grader_run':'https://github.com/MoralityLabAI/Compactification-Theory/actions/runs/44042332472',
             'original_artifact_id':14310062534,
             'original_artifact_name':'nor32_first_original_public_24_sources_and_ood_full_outcome',
             'original_file_sizes_and_sha256':{
               name:{'bytes':size,'sha256':digest}
               for name,(size,digest) in original.items()},
             'new_test_public_source_units':24,
             'excluded_historical_source_units':36,
             'new_ood_support_family_count':6,
             'calibration_schedules_per_source':256,
             'evaluation_schedules_per_source':512,
             'blind_attacks_per_support':8,
             'policyaware_restarts_per_support_policy':4,
             'auditor_policy_count':6,
             'expected_independent_audit_decisions':11206656,
             'exact_witness_pairs_directly_rechecked':87552,
             'frozen_mixture_weights':[2,0,1,1,4,8],
             'source_ood_blind_wins':result['primary_ood_blind_source_wins'],
             'mean_ood_blind_gain':result['primary_ood_blind_mean_gain_vs_hybrid50'],
             'worst_ood_family_wins':result['primary_worst_family_source_wins'],
             'policyaware_ood_source_wins':result['primary_policyaware_ood_source_wins'],
             'legacy_template_mean':result['primary_legacy_template_detection'],
             'registered_five_gates':result['registered_five_gates'],
             'scientific_primary_pass':False,
             'scope':'Unseen support-generation mechanisms may overlap historical risk supports; assumed honest external exact target witness and independent audit coins.'
          }
          results=Path('research/nor32_ood_audits/results')
          results.mkdir(parents=True,exist_ok=True)
          archive=results/'nor32_original_hosted.zip'
          with ZipFile(archive,'w',ZIP_DEFLATED,compresslevel=9) as z:
            for name,data in raw.items():
              entry=ZipInfo(name,(2026,11,17,0,0,0))
              entry.compress_type=ZIP_DEFLATED
              z.writestr(entry,data,compress_type=ZIP_DEFLATED,compresslevel=9)
          (results/'nor32_first_frozen_receipt.json').write_text(
              json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print('NOR32 ORIGINAL FAILED EXPERIMENT ARCHIVE BYTES SHA256',
                len(archive.read_bytes()),sha256(archive.read_bytes()).hexdigest())
          PY
      - name: Replay immutable original failed result independently with original RRC25 interpreter
        run: |
          python research/nor32_ood_audits/receipt_audit.py --check \
            --fixture /tmp/nor32-original/nor32_fixture.json \
            --full /tmp/nor32-original/nor32_full.json
      - name: Preserve original evidence and scientific FAIL in GitHub source control
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/nor32_ood_audits/results/nor32_original_hosted.zip \
                  research/nor32_ood_audits/results/nor32_first_frozen_receipt.json
          git commit -m "NOR-32: preserve original preregistered FAIL and exact first source/grade bytes"
          git push origin HEAD:research/nor32-unseen-support-transfer-20261117
