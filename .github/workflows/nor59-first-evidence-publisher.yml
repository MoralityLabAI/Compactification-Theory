name: NOR-59 one-shot source-locked first genuine signed NOR45 5-of-5 PASS archive

on:
  push:
    branches:
      - research/nor59-nor45-authorized-static-merkle-20261118
    paths:
      - '.github/workflows/nor59-first-evidence-publisher.yml'

permissions:
  contents: write
  actions: read

jobs:
  preserve_original_first_authenticated_NOR45_static_Merkle_PASS:
    if: github.ref == 'refs/heads/research/nor59-nor45-authorized-static-merkle-20261118' && contains(github.event.head_commit.message, 'NOR59-ARCHIVE-FIRST')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/nor59-nor45-authorized-static-merkle-20261118
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nor59_first_original_60_full_NOR45_signed_static_root_CPU
          run-id: 44321699757
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/nor59_original
      - name: Preserve original first NOR45 CPU/source SHA, gates and full authorized result report
        run: python -m research.nor59_authorized_merkle.archive_first
      - name: Independently verify byte-exact original signed program source and first CPU 5-of-5 PASS
        run: python research/nor59_authorized_merkle/original_archive_audit.py
      - name: Commit immutable original source/CPU SHA ZIP, receipt and signed NOR45 result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/nor59_authorized_merkle/results/nor59_first_original_hosted.zip \
                  research/nor59_authorized_merkle/results/nor59_first_receipt.json \
                  research/nor59_authorized_merkle/RESULTS.md
          git commit -m 'NOR-59: preserve original 60 authenticated NOR45 program 5-of-5 PASS'
          for i in $(seq 1 12); do
            git fetch origin research/nor59-nor45-authorized-static-merkle-20261118
            git rebase FETCH_HEAD
            if git push origin HEAD:research/nor59-nor45-authorized-static-merkle-20261118; then
              exit 0
            fi
            sleep 2
          done
          exit 1
