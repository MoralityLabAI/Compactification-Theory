name: FC-03 preregistered exact test generator and Lean checks

on:
  push:
    paths:
      - 'research/refutation_bench/fc03/**'
      - 'research/refutation_bench/tests/test_fc03.py'
      - '.github/workflows/refutation-fc03-presealed.yml'
  pull_request:
    paths:
      - 'research/refutation_bench/fc03/**'
      - 'research/refutation_bench/tests/test_fc03.py'
      - '.github/workflows/refutation-fc03-presealed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-certification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit unseen family balance, split independence and countermodels
        run: |
          python -m unittest -v research.refutation_bench.tests.test_fc03
      - name: Generate test split, Lean source, digests
        run: |
          python -m research.refutation_bench.fc03.generator \
            --out /tmp/fc03_test.jsonl \
            --lean /tmp/FC03.lean \
            --receipt /tmp/fc03_receipt.json
      - name: Install Lean 4.19.0
        run: |
          curl --fail --location --retry 3 \
            https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst \
            -o /tmp/lean-4.19.0-linux.tar.zst
          tar --zstd -xf /tmp/lean-4.19.0-linux.tar.zst -C /tmp
          echo /tmp/lean-4.19.0-linux/bin >> "$GITHUB_PATH"
      - name: Kernel-compile 192 positive proof terms without sorry
        run: |
          lean --version
          lean /tmp/FC03.lean 2>&1 | tee /tmp/fc03_lean.log
          if grep -E 'error:|sorryAx' /tmp/fc03_lean.log; then
            exit 1
          fi
          grep -F 'does not depend on any axioms' /tmp/fc03_lean.log
      - name: Save generator and exact proof receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fc03-exact-${{ github.run_id }}
          path: |
            /tmp/fc03_test.jsonl
            /tmp/FC03.lean
            /tmp/fc03_receipt.json
            /tmp/fc03_lean.log
          retention-days: 14
          if-no-files-found: warn
