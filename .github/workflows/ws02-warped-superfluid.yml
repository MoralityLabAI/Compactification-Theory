name: WS-02 Charged Brane and Radion
on:
  push:
    paths:
      - 'research/warped_superfluid_v2/**'
      - '.github/workflows/ws02-warped-superfluid.yml'
  pull_request:
    paths:
      - 'research/warped_superfluid_v2/**'
      - '.github/workflows/ws02-warped-superfluid.yml'

jobs:
  cpu-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install numerical dependencies
        run: python -m pip install -r research/warped_superfluid_v2/requirements.txt
      - name: Verify 18 numerical and mathematical tests
        working-directory: research/warped_superfluid_v2
        run: python -m unittest discover -s tests -v
      - name: Regenerate model diagnostics
        working-directory: research/warped_superfluid_v2
        run: python run_experiment.py > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ws02-model-diagnostics
          path: research/warped_superfluid_v2/results/
