name: RB-CG-11 elaborated source provenance
on:
  push:
    paths:
      - 'research/refutation_bench/critique_generation_cg11/**'
      - '.github/workflows/refutation-cg11.yml'
  pull_request:
    paths:
      - 'research/refutation_bench/critique_generation_cg11/**'
      - '.github/workflows/refutation-cg11.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU Torch and Lean
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst -o /tmp/lean435.tar.zst
          tar --zstd -xf /tmp/lean435.tar.zst -C /tmp
          echo "/tmp/lean-4.35.0-linux/bin" >> "$GITHUB_PATH"
      - name: Extract real kernel dependencies, reconcile axiom closure, and train metered rankers
        run: |
          lean --version
          python -u research/refutation_bench/critique_generation_cg11/search.py --out /tmp/cg11
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cg11-native-graph-receipts
          path: /tmp/cg11
          retention-days: 30
