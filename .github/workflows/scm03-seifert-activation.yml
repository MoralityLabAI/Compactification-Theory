name: SCM-03 Seifert activation synthetic checks

on:
  push:
    paths:
      - "research/seifert_activation/**"
      - ".github/workflows/scm03-seifert-activation.yml"
  pull_request:
    paths:
      - "research/seifert_activation/**"
      - ".github/workflows/scm03-seifert-activation.yml"

permissions:
  contents: read

jobs:
  synthetic-braid-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install exact algebra and CPU neural dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install sympy==1.14.0 numpy==2.3.5
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile synthetic instrument
        run: python -m compileall -q research/seifert_activation
      - name: Run exact algebra and mock visit-hook regressions
        run: python -m unittest discover -s research/seifert_activation/tests -v
