name: NOR-29 preregistered early entropy disclosure and 32-attack cohorts

on:
  push:
    paths:
      - 'research/nor29_early_entropy/**'
      - '.github/workflows/nor29-early-root.yml'
  pull_request:
    paths:
      - 'research/nor29_early_entropy/**'
      - '.github/workflows/nor29-early-root.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-registration-and-source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert protocol first commit precedes every experiment artifact
        run: |
          git merge-base --is-ancestor 2447248fa8c192991da695ed06af2d17d642dc5f HEAD
          test -s research/nor29_early_entropy/REGISTRATION.md
      - name: Python compilation, source isolation, HMAC and commitment attack controls
        run: |
          python -m compileall -q research/nor29_early_entropy
          python -m unittest research.nor29_early_entropy.test_experiment -v
      - name: SHA audit exact first original source, root and result raw bytes
        run: python research/nor29_early_entropy/original_archive_audit.py

  prep-24-public-sources-and-768-blind-commitments:
    needs: frozen-registration-and-source-controls
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Produce and freeze 24 source-only public identities before attacks and root
        run: |
          mkdir -p /tmp/nor29_prep
          python research/nor29_early_entropy/prepare.py \
            --make-fixture /tmp/nor29_prep/nor29_fixture.json
      - name: Verify first public source fixture identity split and original bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          b=Path('/tmp/nor29_prep/nor29_fixture.json').read_bytes()
          z=json.loads(b)
          assert z['schema']=='nor29.public_only_24_fresh_sources.v1'
          assert z['source_offset']==139329000 and z['replicates']==[12,13,14,15]
          assert len(z['cases'])==24 and len({c['full_public_input_sha256'] for c in z['cases']})==24
          assert z['source_only'] and z['hidden_truth_absent'] and z['attack_sets_absent']
          assert z['challenge_entropy_absent']
          assert all(not any(x in c for x in ('program','future','attack','nonce','root','witness'))
                     for c in z['cases'])
          print('NOR29 PUBLIC SOURCE FIRST BYTES SHA256',len(b),sha256(b).hexdigest())
          PY
      - name: Mint 768 independently salted commitment preimages before challenge entropy
        run: |
          python research/nor29_early_entropy/prepare.py --prepare \
            --fixture /tmp/nor29_prep/nor29_fixture.json \
            --sealed /tmp/nor29_prep/nor29_early_sealed.json \
            --manifest /tmp/nor29_prep/nor29_early_manifest.json
          python research/nor29_early_entropy/prepare.py --verify \
            --fixture /tmp/nor29_prep/nor29_fixture.json \
            --sealed /tmp/nor29_prep/nor29_early_sealed.json \
            --manifest /tmp/nor29_prep/nor29_early_manifest.json
      - name: Freeze PREP byte hashes before CHALLENGE job can start
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          for k in ('fixture','early_sealed','early_manifest'):
              b=Path('/tmp/nor29_prep',f'nor29_{k}.json').read_bytes()
              print('NOR29 FIRST ORIGINAL PREP',k,len(b),sha256(b).hexdigest())
          z=json.loads(Path('/tmp/nor29_prep/nor29_early_manifest.json').read_bytes())
          assert z['attack_count']==768 and z['challenge_entropy_absent']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nor29_first_source_only_and_768_precommitments
          path: /tmp/nor29_prep/
          if-no-files-found: error
          retention-days: 90

  challenge-new-os-root-after-blind-binding:
    needs: prep-24-public-sources-and-768-blind-commitments
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nor29_first_source_only_and_768_precommitments
          path: /tmp/nor29_prep
      - name: Audit immutable early PREP commitments before OS root exists
        run: |
          python research/nor29_early_entropy/prepare.py --verify \
            --fixture /tmp/nor29_prep/nor29_fixture.json \
            --sealed /tmp/nor29_prep/nor29_early_sealed.json \
            --manifest /tmp/nor29_prep/nor29_early_manifest.json
      - name: Draw fresh 256-bit OS root then freeze 24x3x512 HMAC schedules
        run: |
          mkdir -p /tmp/nor29_challenge
          python research/nor29_early_entropy/challenge.py \
            --fixture /tmp/nor29_prep/nor29_fixture.json \
            --manifest /tmp/nor29_prep/nor29_early_manifest.json \
            --out /tmp/nor29_challenge/nor29_challenges.json
      - name: Verify original schedules have been SHA-frozen before attacker sees root
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          b=Path('/tmp/nor29_challenge/nor29_challenges.json').read_bytes()
          x=json.loads(b)
          assert x['schema']=='nor29.single_fresh_os_root_24x3x512_schedules.v1'
          assert x['root_origin']=='os_secrets_token_bytes_32'
          assert len(bytes.fromhex(x['root_hex_disclosed_after_freeze']))==32
          assert len(x['records'])==24
          assert all(len(v)==512 for r in x['records'] for v in r['schedules'].values())
          print('NOR29 FIRST ORIGINAL ROOT COMMIT',x['root_commitment_sha256'])
          print('NOR29 FIRST ORIGINAL SCHEDULES SHA256',len(b),sha256(b).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nor29_first_new_root_and_frozen_audit_schedules
          path: /tmp/nor29_challenge/
          if-no-files-found: error
          retention-days: 90

  leaked-root-2304-fixed-batch-attacks-and-grade:
    needs: challenge-new-os-root-after-blind-binding
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nor29_first_source_only_and_768_precommitments
          path: /tmp/nor29_prep
      - uses: actions/download-artifact@v4
        with:
          name: nor29_first_new_root_and_frozen_audit_schedules
          path: /tmp/nor29_challenge
      - name: Realize deliberately compromised root before making NEW source-specific commitments
        run: |
          mkdir -p /tmp/nor29_late
          python research/nor29_early_entropy/leaked_root_attacker.py --make \
            --fixture /tmp/nor29_prep/nor29_fixture.json \
            --early-manifest /tmp/nor29_prep/nor29_early_manifest.json \
            --challenge /tmp/nor29_challenge/nor29_challenges.json \
            --sealed /tmp/nor29_late/nor29_late_sealed.json \
            --public /tmp/nor29_late/nor29_late_manifest.json
      - name: Freeze and validate all 2304 root-aware batch-fixed attack preimages
        run: |
          python research/nor29_early_entropy/leaked_root_attacker.py --verify \
            --fixture /tmp/nor29_prep/nor29_fixture.json \
            --early-manifest /tmp/nor29_prep/nor29_early_manifest.json \
            --challenge /tmp/nor29_challenge/nor29_challenges.json \
            --sealed /tmp/nor29_late/nor29_late_sealed.json \
            --public /tmp/nor29_late/nor29_late_manifest.json
      - name: Grade exact witnessed alterations on the identical precommitted schedule batch
        run: |
          python research/nor29_early_entropy/grade.py \
            --fixture /tmp/nor29_prep/nor29_fixture.json \
            --early-sealed /tmp/nor29_prep/nor29_early_sealed.json \
            --early-manifest /tmp/nor29_prep/nor29_early_manifest.json \
            --challenge /tmp/nor29_challenge/nor29_challenges.json \
            --late-sealed /tmp/nor29_late/nor29_late_sealed.json \
            --late-manifest /tmp/nor29_late/nor29_late_manifest.json \
            --out /tmp/nor29_late/nor29_full.json
      - name: Report registered scientific PASS or FAIL and original bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          a=Path('/tmp/nor29_late')
          for k in ('late_sealed','late_manifest','full'):
              b=(a/f'nor29_{k}.json').read_bytes()
              print('NOR29 FIRST ORIGINAL LATE',k,len(b),sha256(b).hexdigest())
          z=json.loads((a/'nor29_full.json').read_bytes())
          assert z['schema']=='nor29.batch_fixed_early_root_leakage_v1'
          assert len(z['source_records'])==24
          assert z['fixed_batch_decisions']==2359296
          assert z['fully_informed_per_schedule_decisions']==36864
          assert z['late_attack_opens_old_commitment']==0
          assert z['fully_informed_per_schedule_detected']==0
          assert z['shift_magnitude_disagreements']==0
          print('NOR29 REGISTERED SCIENTIFIC PASS',z['registered_primary_pass'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nor29_first_leaked_root_attacks_and_full_results
          path: /tmp/nor29_late/
          if-no-files-found: error
          retention-days: 90

  original-source-locked-independent-replay:
    needs: leaked-root-2304-fixed-batch-attacks-and-grade
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nor29_first_source_only_and_768_precommitments
          path: /tmp/nor29_prep
      - uses: actions/download-artifact@v4
        with:
          name: nor29_first_new_root_and_frozen_audit_schedules
          path: /tmp/nor29_challenge
      - uses: actions/download-artifact@v4
        with:
          name: nor29_first_leaked_root_attacks_and_full_results
          path: /tmp/nor29_late
      - name: Independently replay native algebra, SHA commitments, sparse HMAC schedules, greedy schedule sets and paired decisions
        run: |
          python research/nor29_early_entropy/receipt_audit.py \
            --fixture /tmp/nor29_prep/nor29_fixture.json \
            --early-sealed /tmp/nor29_prep/nor29_early_sealed.json \
            --early-manifest /tmp/nor29_prep/nor29_early_manifest.json \
            --challenge /tmp/nor29_challenge/nor29_challenges.json \
            --late-sealed /tmp/nor29_late/nor29_late_sealed.json \
            --late-manifest /tmp/nor29_late/nor29_late_manifest.json \
            --outcome /tmp/nor29_late/nor29_full.json
      - name: Independently recheck source-controlled first original byte hashes
        run: python research/nor29_early_entropy/original_archive_audit.py
