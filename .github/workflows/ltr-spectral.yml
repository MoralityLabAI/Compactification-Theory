name: LTR spectral finite checks
on:
  pull_request:
    paths:
      - 'research/logos_topos_spectral/**'
      - '.github/workflows/ltr-spectral.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exact rational tests
        run: python3 -m unittest discover -s research/logos_topos_spectral -p 'test_*.py' -v
      - name: Presentation sensitivity example
        run: python3 research/logos_topos_spectral/spectral.py
