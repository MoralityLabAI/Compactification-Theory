name: BGI-01H certified model repair progress

on:
  push:
    branches:
      - research/bgi01h-progress-certificate-20261030
    paths:
      - 'research/bgi_attractors_v1/progress_repair/**'
      - '.github/workflows/bgi01h-progress-repair.yml'
  pull_request:
    paths:
      - 'research/bgi_attractors_v1/progress_repair/**'
      - '.github/workflows/bgi01h-progress-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: research/bgi_attractors_v1/verified_repair:research/bgi_attractors_v1/factored_admission:research/bgi_attractors_v1/progress_repair
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Verify model/fallback attribution and finite progress invariants
        run: python -m unittest discover -s research/bgi_attractors_v1/progress_repair/tests -v
      - name: Independently repeat both finite certificates
        run: |
          python - <<'PY'
          from core import exhaustive_certificate
          from controller import exhaustive_progress_certificate
          base = exhaustive_certificate()
          c = exhaustive_progress_certificate()
          assert (base["verified_edges"], base["blocked_regressions"]) == (352,80)
          assert c["states"] == 32
          assert c["proposals_per_state"] == 11
          assert c["edges_checked"] == 352
          assert c["safe_progress_invariant"] is True
          print("BGI01H_EXACT_PROGRESS=" + repr(c))
          PY

  qwen-real:
    needs: exact-proof
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONPATH: research/bgi_attractors_v1/verified_repair:research/bgi_attractors_v1/factored_admission:research/bgi_attractors_v1/progress_repair
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONHASHSEED: "20261030"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pinned Qwen CPU runtime
        run: |
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check transformers==4.46.3 huggingface_hub==0.27.1 safetensors==0.4.5
      - name: Compare real model selections with and without externally attested fallback
        run: |
          python -u research/bgi_attractors_v1/progress_repair/run_model.py
      - name: Validate receipt, independent progress invariant and source attribution
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, hashlib
          p=Path("research/bgi_attractors_v1/progress_repair/results/bgi01h_qwen15b_progress_v1.json")
          doc=json.loads(p.read_text())
          d=doc["payload"]
          canonical=json.dumps(d,sort_keys=True,separators=(",",":"),ensure_ascii=False,allow_nan=False).encode()
          assert hashlib.sha256(canonical).hexdigest()==doc["sha256"]
          assert d["model"]["id"]=="Qwen/Qwen2.5-1.5B-Instruct"
          assert d["model"]["revision"]=="775b11afaf83e0dc75bd5abaf90133e47b3ec082"
          assert d["total_model_callbacks"]==60
          assert d["real_model_forwards"]+d["identical_prompt_cache_hits"]==60
          assert d["progress_exhaustive_certificate"]["edges_checked"]==352
          assert d["core_policy_exhaustive_certificate"]["blocked_regressions"]==80
          results=d["result"]["scenarios"]
          assert len(results)==10
          for case in results:
              for mode in ("model_only","model_plus_fallback"):
                  x=case[mode]
                  assert x["ledger_verified"] is True
                  assert len(x["attempts"])==3
                  assert x["external_substitutions"]==sum(
                      z["external_fallback_used"] for z in x["attempts"])
                  assert x["model_progress_steps"]==sum(
                      z["model_progress"] for z in x["attempts"])
                  for a in x["attempts"]:
                      assert a["inference"]["type"]=="real_cpu_autoregressive_greedy"
                      assert a["inference"]["input_tokens"]<=1024
                      assert a["inference"]["output_tokens"]<=80
              fallback=case["model_plus_fallback"]
              assert fallback["potential_final"]==max(0,len(case["damaged_guards"])-3)
              if len(case["damaged_guards"])<=3:
                  assert fallback["full_recovery"]
          print("BGI01H_FULL_RECEIPT_VERIFIED="+doc["sha256"])
          PY
      - name: Archive complete model proposals, verified edits and external fallback ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bgi01h-qwen15b-progress-certified
          path: research/bgi_attractors_v1/progress_repair/results/bgi01h_qwen15b_progress_v1.json
          if-no-files-found: warn
          retention-days: 30
