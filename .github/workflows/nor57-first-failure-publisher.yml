name: NOR-57 one-shot immutable ORIGINAL first engineering reporting FAIL archive

on:
  push:
    branches:
      - research/nor57-authenticated-source-selector-20261118
    paths:
      - '.github/workflows/nor57-first-failure-publisher.yml'

permissions:
  contents: write
  actions: read

jobs:
  preserve_original_first_failed_CPU_job_log_without_invented_JSON:
    if: github.ref == 'refs/heads/research/nor57-authenticated-source-selector-20261118' && contains(github.event.head_commit.message, 'NOR57-ARCHIVE-FIRST-FAIL')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/nor57-authenticated-source-selector-20261118
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nor57_first_original_60_public_only_source_roster
          run-id: 44303440474
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/nor57_original_source
      - name: Fetch unchanged original failed CPU job log from GitHub Actions API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output /tmp/nor57_first_failed_CPU_job_log.txt \
            'https://api.github.com/repos/MoralityLabAI/Compactification-Theory/actions/jobs/134799161696/logs'
          test -s /tmp/nor57_first_failed_CPU_job_log.txt
          python - <<'PY'
          from pathlib import Path
          x=Path('/tmp/nor57_first_failed_CPU_job_log.txt').read_text()
          assert "KeyError: 'frozen_selector_decision'" in x
          assert "NOR57 FIRST CPU 60 /60" in x
          print('NOR57 original failed job log retrieved, bytes',len(x.encode()))
          PY
      - name: Archive raw original first source and failed log, never fabricate first CPU JSON
        run: python research/nor57_authenticated_router/archive_failed_first.py
      - name: Independently audit original source SHA, all 60 printed routes, missing CPU JSON and first FAIL
        run: python research/nor57_authenticated_router/original_failure_audit.py
      - name: Commit immutable first source/log/FAIL receipt, with rebase and bounded retry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/nor57_authenticated_router/results/nor57_first_original_failure_hosted.zip \
                  research/nor57_authenticated_router/results/nor57_first_failure_receipt.json \
                  research/nor57_authenticated_router/RESULTS.md
          git commit -m 'NOR-57: archive first 60-source CPU result writer engineering FAIL'
          for i in $(seq 1 12); do
            git fetch origin research/nor57-authenticated-source-selector-20261118
            git rebase FETCH_HEAD
            if git push origin HEAD:research/nor57-authenticated-source-selector-20261118; then
              exit 0
            fi
            sleep 2
          done
          exit 1
