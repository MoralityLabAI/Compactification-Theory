name: SMC-10C validated local Lipschitz SAE neighborhoods

on:
  push:
    paths:
      - 'research/real_recurrence_sae_v1/smc10_local_lipschitz.py'
      - 'research/real_recurrence_sae_v1/test_smc10_local_lipschitz.py'
      - '.github/workflows/smc10-lipschitz.yml'
  pull_request:
    paths:
      - 'research/real_recurrence_sae_v1/smc10_*'
      - '.github/workflows/smc10-lipschitz.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Arb and CPU torch
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install python-flint==0.9.0
      - name: Exact local Lipschitz transfer tests
        run: python -m unittest discover -s research/real_recurrence_sae_v1 -p 'test_smc10_local_lipschitz.py' -v
      - name: Frozen pretrained two-puzzle local Lipschitz pilot
        run: |
          python research/real_recurrence_sae_v1/smc10_local_lipschitz.py \
            --fetch --max-test-puzzles 2 --seeds 71 --steps 300 \
            --radii 0.02,0.2 --budgets 0,1e-12,1e-10,1e-8,1e-6 \
            --precision 160 --out runs/smc10/lipschitz-pilot.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smc10c-verified-local-lipschitz-pilot
          path: runs/smc10/lipschitz-pilot.json
          if-no-files-found: warn

  full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Arb and CPU torch
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install python-flint==0.9.0
      - name: Frozen pretrained 16-puzzle 3-seed endpoint Lipschitz certificates
        run: |
          python research/real_recurrence_sae_v1/smc10_local_lipschitz.py \
            --fetch --max-test-puzzles 16 --seeds 71,89,113 --steps 300 \
            --radii 0.02,0.2 --budgets 0,1e-12,1e-10,1e-8,1e-6 \
            --precision 160 --out runs/smc10/lipschitz-full.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smc10c-verified-local-lipschitz-full
          path: runs/smc10/lipschitz-full.json
          if-no-files-found: warn
          retention-days: 90
