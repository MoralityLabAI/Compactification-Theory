name: LSV-13 ball-validated pretrained goal-rank minors
on:
  push:
    paths:
      - 'research/levin_sieve_v1/pretrained_trm/validated_minor.py'
      - 'research/levin_sieve_v1/pretrained_trm/run_validated_minor.py'
      - 'research/levin_sieve_v1/pretrained_trm/test_validated_minor.py'
      - 'research/levin_sieve_v1/pretrained_trm/VALIDATED_MINOR.md'
      - 'research/levin_sieve_v1/pretrained_trm/verify_serialized_minors.py'
      - 'research/levin_sieve_v1/pretrained_trm/test_serialized_minors.py'
      - '.github/workflows/levin-validated-minors.yml'
  pull_request:
    paths:
      - 'research/levin_sieve_v1/pretrained_trm/validated_minor.py'
      - 'research/levin_sieve_v1/pretrained_trm/run_validated_minor.py'
      - 'research/levin_sieve_v1/pretrained_trm/test_validated_minor.py'
      - 'research/levin_sieve_v1/pretrained_trm/VALIDATED_MINOR.md'
      - 'research/levin_sieve_v1/pretrained_trm/verify_serialized_minors.py'
      - 'research/levin_sieve_v1/pretrained_trm/test_serialized_minors.py'
      - '.github/workflows/levin-validated-minors.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verified-interval-differentiation:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PyTorch and Arb runtime
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install python-flint==0.9.0
      - name: Ball differentiation and standalone exact-rational witness tests
        run: |
          python -m unittest discover -s research/levin_sieve_v1/pretrained_trm -p 'test_validated_minor.py' -v
          python -m unittest discover -s research/levin_sieve_v1/pretrained_trm -p 'test_serialized_minors.py' -v
      - name: Verify exact-real pretrained goal-rank minor
        run: |
          mkdir -p runs/lsv13
          python research/levin_sieve_v1/pretrained_trm/run_validated_minor.py --fetch --max-cases 64 --precision 128 --out runs/lsv13/verified.json
      - name: Independent exact-rational proof replay of all 1024 entries
        run: |
          python research/levin_sieve_v1/pretrained_trm/verify_serialized_minors.py runs/lsv13/verified.json
          python -c "import json; r=json.load(open('runs/lsv13/verified.json')); assert r['cases_checked']==64 and r['rigorously_verified_rank_four_cases']==64 and r['cases_discharge_original_lsv12_entry_error_budget']==64 and r['total_rigorously_checked_autograd_derivative_entries']==1024"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lsv13-validated-pretrained-rank-minor
          path: runs/lsv13/verified.json
          if-no-files-found: ignore
          retention-days: 60
