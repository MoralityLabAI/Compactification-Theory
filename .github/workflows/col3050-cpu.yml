name: COL-COMP-02 CPU activation audit
on:
  push:
    paths: ['research/collatz_3050_rank_frontier/**', '.github/workflows/col3050-cpu.yml']
  pull_request:
    paths: ['research/collatz_3050_rank_frontier/**', '.github/workflows/col3050-cpu.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.3.5
      - run: cd research/collatz_3050_rank_frontier && python -m unittest -v
