name: NOR-19 one-shot preserve original first-run public fixture and memory timings

on:
  push:
    paths:
      - '.github/workflows/nor19-one-shot-original-archive.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  archive-original-hosted-bytes:
    if: github.ref == 'refs/heads/research/nor19-streamed-cached-verifier-20261116'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: nor19-new64-public-fixture-and-five-mode-cpu-memory-results
          run-id: 43804264372
          github-token: ${{ github.token }}
          path: /tmp/nor19-original
      - name: Verify immutable first-run public source and CPU/memory bytes
        run: |
          set -euo pipefail
          test -f /tmp/nor19-original/nor19_public_fixture.json
          test -f /tmp/nor19-original/nor19_full.json
          echo "97fc9ccd3830bc666e6af6d0a86d3b000ef2b8d0a7a29a406ff38fbd08707f3f  /tmp/nor19-original/nor19_public_fixture.json" | sha256sum -c
          echo "16d6ce9acb042aff76d48f46b7d07ff76a4efca1ade26314cdc52926eb0e1a16  /tmp/nor19-original/nor19_full.json" | sha256sum -c
          test "$(wc -c < /tmp/nor19-original/nor19_public_fixture.json)" -eq 1290607
          test "$(wc -c < /tmp/nor19-original/nor19_full.json)" -eq 680861
      - name: Preserve the original unchanged fixture and benchmark together
        run: |
          set -euo pipefail
          mkdir -p research/nor19_streamed_verifier/results
          zip -q -X -j research/nor19_streamed_verifier/results/nor19_original_hosted.zip \
            /tmp/nor19-original/nor19_public_fixture.json \
            /tmp/nor19-original/nor19_full.json
          test "$(unzip -p research/nor19_streamed_verifier/results/nor19_original_hosted.zip nor19_public_fixture.json | sha256sum | awk '{print $1}')" = \
            97fc9ccd3830bc666e6af6d0a86d3b000ef2b8d0a7a29a406ff38fbd08707f3f
          test "$(unzip -p research/nor19_streamed_verifier/results/nor19_original_hosted.zip nor19_full.json | sha256sum | awk '{print $1}')" = \
            16d6ce9acb042aff76d48f46b7d07ff76a4efca1ade26314cdc52926eb0e1a16
      - name: Commit original hosted public-only measurements to isolated research branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/nor19_streamed_verifier/results/nor19_original_hosted.zip
          git diff --cached --check
          git commit -m "NOR-19: preserve original 64-case streamed CPU and memory evidence bytes"
          git push origin "HEAD:research/nor19-streamed-cached-verifier-20261116"
