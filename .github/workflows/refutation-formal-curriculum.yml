name: RefutationBench exact curriculum (Lean + finite countermodels)

on:
  push:
    paths:
      - 'research/refutation_bench/formal_curriculum/**'
      - 'research/refutation_bench/tests/test_formal_curriculum.py'
      - '.github/workflows/refutation-formal-curriculum.yml'
  pull_request:
    paths:
      - 'research/refutation_bench/formal_curriculum/**'
      - 'research/refutation_bench/tests/test_formal_curriculum.py'
      - '.github/workflows/refutation-formal-curriculum.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-horn:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate finite entailment and countermodel data
        run: |
          python -m unittest -v research.refutation_bench.tests.test_formal_curriculum
      - name: Generate deterministic split files, Lean theorems and SHA receipt
        run: |
          python -m research.refutation_bench.formal_curriculum.generator \
            --out /tmp/formal_curriculum.jsonl \
            --lean /tmp/FormalCurriculum.lean \
            --receipt /tmp/formal_curriculum_receipt.json
      - name: Install Lean 4.19.0 kernel (same as LoopedTransformers LR-01)
        run: |
          curl --fail --location --retry 3 \
            https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst \
            -o /tmp/lean-4.19.0-linux.tar.zst
          tar --zstd -xf /tmp/lean-4.19.0-linux.tar.zst -C /tmp
          echo /tmp/lean-4.19.0-linux/bin >> "$GITHUB_PATH"
      - name: Compile every positive Horn theorem in Lean
        run: |
          lean --version
          lean /tmp/FormalCurriculum.lean 2>&1 | tee /tmp/formal_curriculum_lean.log
          if grep -E 'error:|sorryAx' /tmp/formal_curriculum_lean.log; then
            exit 1
          fi
      - name: Publish reproducibility receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refutation-horn-${{ github.run_id }}
          path: |
            /tmp/formal_curriculum.jsonl
            /tmp/FormalCurriculum.lean
            /tmp/formal_curriculum_receipt.json
            /tmp/formal_curriculum_lean.log
          retention-days: 14
          if-no-files-found: warn
