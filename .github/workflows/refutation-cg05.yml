name: RB-CG-05 original Lean theorem correspondence audit
on:
  push:
    paths:
      - 'research/refutation_bench/critique_generation_cg05/**'
      - '.github/workflows/refutation-cg05.yml'
  pull_request:
    paths:
      - 'research/refutation_bench/critique_generation_cg05/**'
      - '.github/workflows/refutation-cg05.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: patrickdugan/MathCan
          ref: 6d02b611c7358216379cb36952512a104e0bdb8e
          path: _mathcan
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Lean
        run: |
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst -o /tmp/lean435.tar.zst
          tar --zstd -xf /tmp/lean435.tar.zst -C /tmp
          echo /tmp/lean-4.35.0-linux/bin >> "$GITHUB_PATH"
      - name: Certify original modules and paired advertised propositions
        run: |
          lean --version
          python -u research/refutation_bench/critique_generation_cg05/audit.py --source _mathcan --out /tmp/cg05
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cg05-original-source-receipts
          path: /tmp/cg05
          retention-days: 30
