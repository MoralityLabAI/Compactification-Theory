name: COE-05 phase-order and clock-gauge certificates

on:
  pull_request:
    paths:
      - 'research/chromatic_observer_gym_v1/**'
      - '.github/workflows/coe05-phase-order.yml'
  push:
    branches: [main]
    paths:
      - 'research/chromatic_observer_gym_v1/**'
      - '.github/workflows/coe05-phase-order.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-and-frozen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact finite math and frozen-head evidence (no model downloads)
        run: python -m unittest discover -s research/chromatic_observer_gym_v1 -p 'test_phase_order.py' -v
      - name: Replay new model cohort without torch
        run: |
          python research/chromatic_observer_gym_v1/phase_order_replay.py \
            --activation research/chromatic_observer_gym_v1/replication_activations.json.gz \
            --receipt research/chromatic_observer_gym_v1/new_fit_phase_receipt.json
      - name: Recompute exhaustive fit-only search with NumPy
        run: |
          python -m pip install 'numpy==2.3.5'
          python research/chromatic_observer_gym_v1/phase_order_search.py \
            --input research/chromatic_observer_gym_v1/replication_activations.json.gz \
            --out /tmp/coe05_recomputed.json
          python - <<'PY'
          import json
          root='research/chromatic_observer_gym_v1/'
          a=json.load(open(root+'new_fit_phase_receipt.json'))
          b=json.load(open('/tmp/coe05_recomputed.json'))
          for x,y in zip(a['records'],b['records']):
              assert x['model_seed']==y['model_seed']
              assert x['candidate_count']==y['candidate_count']
              for key in ('primary_stable_order_head','comparative_best_total_head'):
                  for field in ('candidate_index','fit_stable_novel_edges',
                      'fit_order_only_hits','fit_total_edge_hits',
                      'heldout_order_only_hits','heldout_total_edge_hits',
                      'heldout_count_only_hits','heldout_order_only_by_context'):
                      assert x[key][field]==y[key][field], (x['model_seed'],key,field)
          print('Fit-only selection exactly recovered across independent CI runtime')
          PY
