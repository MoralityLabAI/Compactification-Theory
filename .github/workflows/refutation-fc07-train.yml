name: FC-07 train-only misleading ancestry, exact source and Lean proof

on:
  push:
    paths:
      - 'research/refutation_bench/fc07/train_data.py'
      - 'research/refutation_bench/tests/test_fc07_train.py'
      - '.github/workflows/refutation-fc07-train.yml'
  pull_request:
    paths:
      - 'research/refutation_bench/fc07/train_data.py'
      - 'research/refutation_bench/tests/test_fc07_train.py'
      - '.github/workflows/refutation-fc07-train.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check alternate goal producers and training split
        run: python -m unittest research.refutation_bench.tests.test_fc07_train -v
      - name: Freeze canonical source JSONL and Lean positive terms
        run: |
          python -m research.refutation_bench.fc07.train_data \
            --out /tmp/FC07_train.jsonl \
            --lean /tmp/FC07_train.lean \
            --receipt /tmp/FC07_train_receipt.json
      - name: Install Lean 4.19.0
        run: |
          curl --fail --location --retry 3 \
            https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst \
            -o /tmp/lean-4.19.0-linux.tar.zst
          tar --zstd -xf /tmp/lean-4.19.0-linux.tar.zst -C /tmp
          echo /tmp/lean-4.19.0-linux/bin >> "$GITHUB_PATH"
      - name: Compile every valid train/dev Horn theorem
        run: |
          lean /tmp/FC07_train.lean 2>&1 | tee /tmp/FC07_train_lean.log
          if grep -E 'error:|sorryAx' /tmp/FC07_train_lean.log; then exit 1; fi
          test "$(grep -c 'does not depend on any axioms' /tmp/FC07_train_lean.log)" -ge 2
      - name: Archive training-only receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fc07-train-source-${{ github.run_id }}
          path: |
            /tmp/FC07_train.jsonl
            /tmp/FC07_train.lean
            /tmp/FC07_train_receipt.json
            /tmp/FC07_train_lean.log
          retention-days: 30
          if-no-files-found: warn
