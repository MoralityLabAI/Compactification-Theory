name: RB-CG-01 verified critique generation
on:
  push:
    paths:
      - 'research/refutation_bench/critique_generation_cg01/**'
      - '.github/workflows/refutation-cg01.yml'
  pull_request:
    paths:
      - 'research/refutation_bench/critique_generation_cg01/**'
      - '.github/workflows/refutation-cg01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Lean
        run: |
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst -o /tmp/lean.tar.zst
          tar --zstd -xf /tmp/lean.tar.zst -C /tmp
          echo /tmp/lean-4.19.0-linux/bin >> "$GITHUB_PATH"
      - name: Generate and independently certify all source families and witnesses
        run: |
          lean --version
          python -u research/refutation_bench/critique_generation_cg01/corpus.py --out /tmp/cg01-source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cg01-source-native
          path: /tmp/cg01-source
          retention-days: 14
  critique-cpu:
    needs: source-native
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU Torch
        run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - uses: actions/download-artifact@v4
        with:
          name: cg01-source-native
          path: /tmp/cg01-source
      - name: Train four models and verify generated critiques
        run: python -u research/refutation_bench/critique_generation_cg01/train.py --corpus /tmp/cg01-source --out /tmp/cg01-models
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cg01-model-results
          path: /tmp/cg01-models
          retention-days: 14
