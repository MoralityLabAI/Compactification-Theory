name: NOR-56 one-shot original source CPU 3-of-5 FAIL evidence archive

on:
  push:
    branches:
      - research/nor56-batch-compact-v2-20261118
    paths:
      - '.github/workflows/nor56-first-evidence-publisher.yml'

permissions:
  contents: write
  actions: read

jobs:
  preserve_original_first_signed_compact_v2_FAIL:
    if: github.ref == 'refs/heads/research/nor56-batch-compact-v2-20261118' && contains(github.event.head_commit.message, 'NOR56-ARCHIVE-FIRST')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/nor56-batch-compact-v2-20261118
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nor56_first_original_60_signed_compact_v2_CPU
          run-id: 44296895730
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/nor56_first
      - name: Copy exact raw first source/CPU bytes and publish frozen original FAIL
        run: python research/nor56_batch_codec/archive_first.py
      - name: Independently audit first raw SHAs, all 60 full roots, samples and frozen gates
        run: python research/nor56_batch_codec/original_archive_audit.py
      - name: Commit immutable first original source/CPU bytes and 3-of-5 FAIL receipt
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/nor56_batch_codec/results/nor56_first_original_hosted.zip \
                  research/nor56_batch_codec/results/nor56_first_receipt.json \
                  research/nor56_batch_codec/RESULTS.md
          git commit -m 'NOR-56: preserve first 60-source signed batch-v2 3-of-5 engineering FAIL'
          for i in $(seq 1 12); do
            git fetch origin research/nor56-batch-compact-v2-20261118
            git rebase FETCH_HEAD
            if git push origin HEAD:research/nor56-batch-compact-v2-20261118; then
              exit 0
            fi
            sleep 2
          done
          exit 1
