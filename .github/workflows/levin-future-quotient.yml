name: LSV-17 future-behavior quotient pilot

on:
  push:
    paths:
      - 'research/levin_sieve_v1/pretrained_trm/quotient_discovery.py'
      - 'research/levin_sieve_v1/pretrained_trm/test_quotient_discovery.py'
      - 'research/levin_sieve_v1/pretrained_trm/LSV17_FUTURE_QUOTIENT.md'
      - '.github/workflows/levin-future-quotient.yml'
  pull_request:
    paths:
      - 'research/levin_sieve_v1/pretrained_trm/quotient_discovery.py'
      - 'research/levin_sieve_v1/pretrained_trm/test_quotient_discovery.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked CPU runtime
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Unit and negative controls
        run: python -m unittest discover -s research/levin_sieve_v1/pretrained_trm -p 'test_quotient_discovery.py' -v
      - name: Source-locked 16-case pretrained causal pilot
        run: python research/levin_sieve_v1/pretrained_trm/quotient_discovery.py --fetch --max-cases 16 --probe-epochs 180 --out runs/lsv17/pilot.json
      - name: Upload frozen pilot receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lsv17-source-locked-pilot
          path: runs/lsv17/pilot.json
          if-no-files-found: warn
          retention-days: 60
