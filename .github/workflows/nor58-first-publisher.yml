name: NOR-58 one-shot immutable first 5-of-5 exact static Merkle PASS evidence publisher
# Archive retry only: original hosted first source and CPU bytes and gate scores are identical.

on:
  push:
    branches:
      - research/nor58-static-merkle-template-20261118
    paths:
      - '.github/workflows/nor58-first-publisher.yml'

permissions:
  contents: write
  actions: read

jobs:
  preserve_original_first_sixty_source_static_merkle_PASS:
    if: github.ref == 'refs/heads/research/nor58-static-merkle-template-20261118' && contains(github.event.head_commit.message, 'NOR58-ARCHIVE-FIRST')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/nor58-static-merkle-template-20261118
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nor58_first_original_60_signed_static_merkle_CPU
          run-id: 44316658346
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/nor58_original
      - name: Copy byte-identical first CPU/source and freeze registered original 5-of-5 PASS
        run: python -m research.nor58_static_merkle.archive_first
      - name: Independently audit all first raw SHAs, signed full root parity and sourcewise five gates
        run: python research/nor58_static_merkle/original_archive_audit.py
      - name: Commit immutable source/CPU ZIP, SHA receipt and full original result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/nor58_static_merkle/results/nor58_first_original_hosted.zip \
                  research/nor58_static_merkle/results/nor58_first_receipt.json \
                  research/nor58_static_merkle/RESULTS.md
          git commit -m 'NOR-58: archive first 60-source exact static Merkle 5-of-5 engineering PASS'
          for i in $(seq 1 12); do
            git fetch origin research/nor58-static-merkle-template-20261118
            git rebase FETCH_HEAD
            if git push origin HEAD:research/nor58-static-merkle-template-20261118; then
              exit 0
            fi
            sleep 2
          done
          exit 1
