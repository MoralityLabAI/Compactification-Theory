name: RRC-07 first-fault recurrent refinement CPU audit
permissions:
  contents: read
on:
  push:
    paths:
      - 'research/rrc_compactification/**'
      - '.github/workflows/rrc-07.yml'
  pull_request:
    paths:
      - 'research/rrc_compactification/**'
      - '.github/workflows/rrc-07.yml'
  workflow_dispatch:
jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight CPU vectorized numerical operations
        run: python -m pip install 'numpy>=2,<3'
      - name: Verify first-fault proofs, finite certificates and scalar-NumPy parity
        run: python -m unittest discover -s research/rrc_compactification -p 'test_rrc07.py' -v
      - name: Recompute source/checkpoint-bound held-out run
        run: python research/rrc_compactification/bench07.py --check
      - name: Small earlier Euler algebra regression tests
        run: python -m unittest discover -s research/rrc_compactification -p 'test_rrc05.py' -v
