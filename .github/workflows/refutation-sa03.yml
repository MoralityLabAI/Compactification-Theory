name: SA-03 recurrent proof audit acquisition
on:
  push:
    paths:
      - 'research/refutation_bench/semantic_audit_sa03/**'
      - '.github/workflows/refutation-sa03.yml'
  pull_request:
    paths:
      - 'research/refutation_bench/semantic_audit_sa03/**'
      - '.github/workflows/refutation-sa03.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  learned-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU Torch and Lean
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst -o /tmp/lean.tar.zst
          tar --zstd -xf /tmp/lean.tar.zst -C /tmp
          echo /tmp/lean-4.19.0-linux/bin >> "$GITHUB_PATH"
      - name: Native certification, train-only imitation, and prospective evaluation
        run: |
          lean --version
          python -u research/refutation_bench/semantic_audit_sa03/train.py --out /tmp/sa03
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sa03-native-training-results
          path: /tmp/sa03
          retention-days: 14
