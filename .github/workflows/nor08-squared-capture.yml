name: NOR-08B certified squared-source entry into second trained basin

on:
  push:
    paths:
      - 'research/nor01_numerical_orbit_sketch/nor08_squared_capture.py'
      - 'research/nor01_numerical_orbit_sketch/test_nor08_squared_capture.py'
      - 'research/nor01_numerical_orbit_sketch/results/nor08_expanded_second_ball.json'
      - '.github/workflows/nor08-squared-capture.yml'
  pull_request:
    paths:
      - 'research/nor01_numerical_orbit_sketch/nor08_squared_capture.py'
      - 'research/nor01_numerical_orbit_sketch/test_nor08_squared_capture.py'
      - 'research/nor01_numerical_orbit_sketch/results/nor08_expanded_second_ball.json'
      - '.github/workflows/nor08-squared-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-interval-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test original squared source and certified expanded basin radius
        run: python -m unittest research.nor01_numerical_orbit_sketch.test_nor08_squared_capture -v

  bounded-exact-capture:
    needs: source-interval-regression
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact 12-step blocks from original squared public-input state
        run: python research/nor01_numerical_orbit_sketch/nor08_squared_capture.py --check --max-blocks 70 --stride 5 --out /tmp/nor08_squared_capture.json
      - name: Print exact witness or explicit inconclusive result
        run: |
          python - <<'PY'
          import json
          from fractions import Fraction as Q
          from pathlib import Path
          r=json.loads(Path('/tmp/nor08_squared_capture.json').read_text())
          assert r['schema']=='nor08.second_basin.squared_natural_source_capture.v1'
          assert r['checkpoint_sha256']=='54f225f2a61c52fee5a740576eaab3bcbc5280a595fc1ac1ac115ec8ac26c41b'
          assert not r['floating_point_acceptance']
          assert r['source_metadata']['family']=='squared'
          w=r['certified_capture']
          if w:
              R=Q(r['certified_second_basin_radius_fraction'])
              d=Q(w['target_center_distance_upper_fraction'])
              e=Q(w['tracked_state_error_upper_fraction'])
              margin=Q(w['exact_clearance_fraction'])
              assert d+e+margin==R and margin>=0
              print('NOR-08B SQUARED NATURAL SOURCE CAPTURE CERTIFIED',
                    'steps=',w['zero_input_steps'],
                    'distance_upper=',float(d),
                    'state_error_upper=',float(e),
                    'clearance=',float(margin))
          else:
              print('NOR-08B SOURCE CAPTURE NOT ESTABLISHED',
                    'blocks=',r['checked_blocks'],
                    'final_distance=',r['trace'][-1]['target_center_distance_upper_float'],
                    'error_bound=',r['trace'][-1]['state_error_radius_upper_float'])
          print('TRACE SHA-256',r['exact_trace_sha256'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nor08-second-basin-exact-source-capture-or-inconclusive
          path: /tmp/nor08_squared_capture.json
