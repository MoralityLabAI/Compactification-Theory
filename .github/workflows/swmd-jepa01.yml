name: SWMD-JEPA-01 tests

on:
  push:
    paths:
      - "experiments/swmd-jepa-01/**"
      - ".github/workflows/swmd-jepa01.yml"
  pull_request:
    paths:
      - "experiments/swmd-jepa-01/**"
      - ".github/workflows/swmd-jepa01.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU PyTorch
        run: python -m pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Unit and deterministic four-arm smoke
        run: python -m unittest discover -s experiments/swmd-jepa-01/tests -v
      - name: Optimized-mode checks
        run: python -O -m unittest discover -s experiments/swmd-jepa-01/tests -v
