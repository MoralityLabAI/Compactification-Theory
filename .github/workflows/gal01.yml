name: GAL-01 exact scale replay
on:
  pull_request:
    paths:
      - 'Galacticity/**'
      - '.github/workflows/gal01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node Galacticity/gal01.mjs > /tmp/gal01.json
      - run: diff -u Galacticity/receipt.json /tmp/gal01.json
      - run: node Galacticity/learned_router.mjs > /tmp/router.json
      - run: |
          python - <<'PY'
          import json
          a=json.load(open('/tmp/router.json'))
          b=json.load(open('Galacticity/router_receipt.json'))
          for k in ('training','heldout','gatedCorrect','adversary'):
              assert a[k]==b[k], k
          assert a['training_admission'] is False
          PY
      - run: node Galacticity/gal02.mjs > /tmp/gal02.json
      - run: diff -u Galacticity/gal02_receipt.json /tmp/gal02.json
      - run: node Galacticity/gal03.mjs > /tmp/gal03.json
      - run: diff -u Galacticity/gal03_receipt.json /tmp/gal03.json
      - run: node Galacticity/gal03_basis.mjs > /tmp/gal03_basis.json
      - run: diff -u Galacticity/gal03_basis_receipt.json /tmp/gal03_basis.json
      - run: node Galacticity/gal04_rent_buy.mjs > /tmp/gal04_rent_buy.json
      - run: diff -u Galacticity/gal04_rent_buy_receipt.json /tmp/gal04_rent_buy.json
      - run: node Galacticity/gal04_market.mjs > /tmp/gal04_market.json
      - run: diff -u Galacticity/gal04_market_receipt.json /tmp/gal04_market.json
      - run: node Galacticity/gal04_guard.mjs > /tmp/gal04_guard.json
      - run: diff -u Galacticity/gal04_guard_receipt.json /tmp/gal04_guard.json
      - run: node Galacticity/gal05_paths.mjs > /tmp/gal05_paths.json
      - run: diff -u Galacticity/gal05_paths_receipt.json /tmp/gal05_paths.json
      - run: node Galacticity/gal05_portfolio.mjs > /tmp/gal05_portfolio.json
      - run: diff -u Galacticity/gal05_portfolio_receipt.json /tmp/gal05_portfolio.json
      - run: node Galacticity/gal05_gym.mjs selftest > /tmp/gal05_gym.json
      - run: diff -u Galacticity/gal05_gym_receipt.json /tmp/gal05_gym.json
      - run: node Galacticity/gal06_stochastic.mjs > /tmp/gal06_stochastic.json
      - run: diff -u Galacticity/gal06_stochastic_receipt.json /tmp/gal06_stochastic.json
      - run: node Galacticity/gal06_risk.mjs > /tmp/gal06_risk.json
      - run: diff -u Galacticity/gal06_risk_receipt.json /tmp/gal06_risk.json
      - run: node Galacticity/gal06_gym.mjs selftest > /tmp/gal06_gym.json
      - run: diff -u Galacticity/gal06_gym_receipt.json /tmp/gal06_gym.json
      - run: node Galacticity/gal07_ambiguity.mjs > /tmp/gal07_ambiguity.json
      - run: diff -u Galacticity/gal07_ambiguity_receipt.json /tmp/gal07_ambiguity.json
      - run: node Galacticity/gal07_risk.mjs > /tmp/gal07_risk.json
      - run: diff -u Galacticity/gal07_risk_receipt.json /tmp/gal07_risk.json
      - run: node Galacticity/gal07_gym.mjs selftest > /tmp/gal07_gym.json
      - run: diff -u Galacticity/gal07_gym_receipt.json /tmp/gal07_gym.json
      - run: node Galacticity/gal08_structure.mjs > /tmp/gal08_structure.json
      - run: diff -u Galacticity/gal08_structure_receipt.json /tmp/gal08_structure.json
      - run: node Galacticity/gal08_certificates.mjs > /tmp/gal08_certificates.json
      - run: diff -u Galacticity/gal08_certificates_receipt.json /tmp/gal08_certificates.json
      - run: node Galacticity/gal08_economics.mjs > /tmp/gal08_economics.json
      - run: diff -u Galacticity/gal08_economics_receipt.json /tmp/gal08_economics.json
      - run: python Galacticity/test_distill_profile.py
