name: NOR-14 one-shot full evidence archive

on:
  push:
    paths:
      - '.github/workflows/nor14-archive-full-evidence.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-original-hosted-receipt:
    if: github.ref == 'refs/heads/research/nor14-archive-full-artifact-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate NOR-14 JSON and require byte-for-byte frozen receipt match
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nor14"
          python research/nor14_conditional_basin/experiment.py --check --repetitions 4 --per-family 12 --out "$RUNNER_TEMP/nor14/nor14_full.json"
          echo "57b4b82550dce6228356dae924264a95f38d66b3974c038b574eadcad9f7df2d  $RUNNER_TEMP/nor14/nor14_full.json" | sha256sum --check
          test "$(wc -c < "$RUNNER_TEMP/nor14/nor14_full.json")" -eq 1380694
      - name: Preserve full evidence JSON as source-locked ZIP archive
        run: |
          set -euo pipefail
          zip -q -X -j "research/nor14_conditional_basin/results/nor14_full.zip" "$RUNNER_TEMP/nor14/nor14_full.json"
          test "$(unzip -p research/nor14_conditional_basin/results/nor14_full.zip nor14_full.json | sha256sum | awk '{print $1}')" = 57b4b82550dce6228356dae924264a95f38d66b3974c038b574eadcad9f7df2d
      - name: Commit archive on isolated archival branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/nor14_conditional_basin/results/nor14_full.zip
          git diff --cached --check
          git commit -m "NOR-14: archive 288-case full evidence ZIP with frozen JSON SHA-256"
          git push origin "HEAD:research/nor14-archive-full-artifact-20261115"
