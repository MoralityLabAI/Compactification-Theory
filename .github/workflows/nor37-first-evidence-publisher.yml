name: NOR-37 one-shot preserve first source-heldout randomized curvature result

on:
  push:
    paths:
      - '.github/workflows/nor37-first-evidence-publisher.yml'

permissions:
  contents: write
  actions: read

jobs:
  preserve-original-first-registered-stochastic-result:
    if: github.ref == 'refs/heads/research/nor37-stochastic-intraatom-curvature-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/nor37-stochastic-intraatom-curvature-20261117
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nor37_first_original_source_and_stochastic_policyaware_grade
          run-id: 44079786124
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/nor37-first
      - name: Confirm original public source and complete grade EXACT first SHA and frozen gates
        run: |
          python - <<'PY'
          from hashlib import sha256
          from zipfile import ZipFile,ZipInfo,ZIP_DEFLATED
          from pathlib import Path
          import json
          originals={
            'nor37_fixture.json':(4857464,
                'f969925a159aa3e36d7061e2e65e0a6b9e6e0f82634e2a7e52b4dac874df6710'),
            'nor37_full.json':(559101,
                '4852bd7de8012484db34404519553ae4d1e9f388203f2fdbf8b7516a534b684c'),
          }
          blobs={}
          for name,(size,h) in originals.items():
            data=(Path('/tmp/nor37-first')/name).read_bytes()
            assert len(data)==size,(name,len(data))
            assert sha256(data).hexdigest()==h,name
            blobs[name]=data
          src=json.loads(blobs['nor37_fixture.json'])
          full=json.loads(blobs['nor37_full.json'])
          assert src['schema']=='nor37.new_public_only_reps56to59.v1'
          assert full['schema']=='nor37.stochastic_intraatom_curvature_policyaware.v1'
          assert src['registered_first_commit']==full['registration_first_commit']==(
              'a87401971de2cdefd7f36110fc6beae009c43bef')
          assert src['public_only'] and src['planted_and_private_target_absent']
          assert src['attack_witness_and_audit_absent']
          assert full['fresh_source_units']==len(src['cases'])==len(full['source_records'])==24
          assert full['historical_sources_excluded']==src['excluded_historical_sources']==156
          assert full['public_fixture_sha256']==originals['nor37_fixture.json'][1]
          assert full['original_mix_weights']==[2,0,1,1,4,8]
          assert len(full['auditor_policies'])==10
          assert full['calibration_schedules_per_source']==256
          assert full['heldout_schedules_per_source']==512
          assert full['greedy_restarts_per_policy']==8
          assert full['audit_budget']==16 and full['attack_radius']==4
          assert full['registered_primary_pass']
          assert all(full['registered_five_gates'].values())
          assert all(x==24 for x in full['source_direction_wins'].values())
          assert abs(full['source_means']['self_stoch50_minus_deterministic']-
                     .01007080078125)<1e-15
          assert abs(full['source_means']['worst_class_stoch50_minus_deterministic']-
                     .010457356770833334)<1e-15
          assert abs(full['source_means']['top_stoch50_minus_atom_random']-
                     .05687332262050345)<1e-15
          assert abs(full['source_means']['mix_self_stoch50_minus_deterministic']-
                     .013115564982096354)<1e-15
          assert abs(full['source_means']['mix_top_stoch50_minus_original']-
                     .05932643687247575)<1e-15
          assert abs(full['retained_ratio_stochastic_to_deterministic_top_gain']-
                     .32645170603295337)<1e-15
          assert all(rec['honest_target_false_rejections']==0
                     and rec['fully_schedule_informed_attacker_detections']==0
                     and rec['delta_decision_disagreements']==0
                     and all(v==0 for v in rec['exact_quota_and_control_checks'].values())
                     for rec in full['source_records'])
          out=Path('research/nor37_stochastic_curvature/results')
          out.mkdir(parents=True,exist_ok=True)
          archive=out/'nor37_original_hosted.zip'
          with ZipFile(archive,'w',ZIP_DEFLATED,compresslevel=9) as z:
            for name,data in blobs.items():
              info=ZipInfo(name,(2026,11,17,0,0,0))
              info.compress_type=ZIP_DEFLATED
              z.writestr(info,data,compress_type=ZIP_DEFLATED,compresslevel=9)
          receipt={
            'schema':'nor37.original_first_sourceheldout_stochastic_curvature.v1',
            'date_utc':'2026-11-17',
            'first_registration_commit':'a87401971de2cdefd7f36110fc6beae009c43bef',
            'first_original_grader_run':'https://github.com/MoralityLabAI/Compactification-Theory/actions/runs/44079786124',
            'first_original_artifact_id':14327326409,
            'first_original_artifact_name':'nor37_first_original_source_and_stochastic_policyaware_grade',
            'original_file_bytes_sha256':{
                name:{'bytes':size,'sha256':h} for name,(size,h) in originals.items()},
            'new_independent_source_units':24,
            'excluded_historical_source_units':156,
            'auditor_and_attacker_policy_classes':10,
            'stochastic_sensitivity_levels':[25,50,75],
            'blind_attack_control_families':4,
            'attack_restarts_per_family':8,
            'calibration_schedules_per_source':256,
            'heldout_schedules_per_source':512,
            'expected_replayed_crossplay_decisions':30277632,
            'recorded_direct_integer_witness_pairs':29568,
            'source_direction_wins':full['source_direction_wins'],
            'source_means':full['source_means'],
            'registered_five_gates':full['registered_five_gates'],
            'registered_primary_pass':True,
            'source_aware_exploration_tradeoff':full['retained_ratio_stochastic_to_deterministic_top_gain'],
            'scope':'Finite synthetic RRC25. Random public curvature window and independent per-atom uniform exploration. External honest true-target coefficient witness and independent private audit coins assumed. Greedy attacker is approximate.'
          }
          (out/'nor37_first_frozen_receipt.json').write_text(
              json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('NOR37 ORIGINAL FIRST ARCHIVE BYTES SHA256',
                len(archive.read_bytes()),sha256(archive.read_bytes()).hexdigest())
          PY
      - name: Independently reconstruct first original source/grade and ten-policy cross-play before archiving
        run: |
          python research/nor37_stochastic_curvature/receipt_audit.py --check \
            --fixture /tmp/nor37-first/nor37_fixture.json \
            --full /tmp/nor37-first/nor37_full.json
      - name: Commit original first source and grade bytes with immutable SHA receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/nor37_stochastic_curvature/results/nor37_original_hosted.zip \
                  research/nor37_stochastic_curvature/results/nor37_first_frozen_receipt.json
          git commit -m "NOR-37: archive first prospectively registered stochastic-auditor result"
          git pull --rebase origin research/nor37-stochastic-intraatom-curvature-20261117
          git push origin HEAD:research/nor37-stochastic-intraatom-curvature-20261117
