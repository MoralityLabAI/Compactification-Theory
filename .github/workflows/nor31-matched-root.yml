name: NOR-31 preregistered equal-budget calibration versus leaked evaluation root

on:
  push:
    paths:
      - 'research/nor31_matched_root/**'
      - '.github/workflows/nor31-matched-root.yml'
  pull_request:
    paths:
      - 'research/nor31_matched_root/**'
      - '.github/workflows/nor31-matched-root.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze-registration-and-finite-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate initial NOR-31 source-independent registration parent
        run: |
          git merge-base --is-ancestor dd0e9f60cdab90ed2b2fb482dedc7496f7f50870 HEAD
          test -s research/nor31_matched_root/REGISTRATION.md
      - name: Source splits, independent root domains, attack budget and commitment controls
        run: |
          python -m compileall -q research/nor31_matched_root
          python -m unittest research.nor31_matched_root.test_experiment -v
      - name: SHA-check all eight exact original hosted first-run files
        run: python research/nor31_matched_root/original_archive_audit.py

  prep-independent-root-24-sources-and-2304-commitments:
    needs: freeze-registration-and-finite-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and freeze first 24 genuinely fresh public-only RRC25 sources
        run: |
          mkdir -p /tmp/nor31_prep
          python research/nor31_matched_root/source.py --make-fixture \
            /tmp/nor31_prep/nor31_fixture.json
          python research/nor31_matched_root/source.py --validate \
            /tmp/nor31_prep/nor31_fixture.json
      - name: Freeze original source-only bytes before calibration root exists
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          x=Path('/tmp/nor31_prep/nor31_fixture.json').read_bytes()
          obj=json.loads(x)
          assert obj['schema']=='nor31.public_only_24_fresh_sources.v1'
          assert obj['source_offset']==150031000
          assert obj['replicates']==[22,23,24,25]
          assert len(obj['cases'])==24
          assert len({c['full_public_input_sha256'] for c in obj['cases']})==24
          assert obj['source_only'] and obj['hidden_truth_absent']
          assert obj['attack_sets_absent'] and obj['challenge_entropy_absent']
          print('NOR31 SOURCE FROZEN',len(x),sha256(x).hexdigest())
          PY
      - name: Mint first independent 256-bit OS calibration root and 512 per-policy schedules
        run: |
          python research/nor31_matched_root/sampler.py \
            --phase calibration --fixture /tmp/nor31_prep/nor31_fixture.json \
            --out /tmp/nor31_prep/nor31_calibration.json
      - name: Freeze calibration root and all calibration schedules before attack choices
        run: |
          python research/nor31_matched_root/sampler.py --phase calibration \
            --fixture /tmp/nor31_prep/nor31_fixture.json \
            --verify /tmp/nor31_prep/nor31_calibration.json
      - name: Choose 2304 blind pre-root attacks from 512 calibration schedules and publish salted commitments
        run: |
          python research/nor31_matched_root/attacks.py \
            --class independent_calibration --make \
            --fixture /tmp/nor31_prep/nor31_fixture.json \
            --phase /tmp/nor31_prep/nor31_calibration.json \
            --sealed /tmp/nor31_prep/nor31_pre_sealed.json \
            --manifest /tmp/nor31_prep/nor31_pre_manifest.json
      - name: Check every original attack and deliberately mutated opening before eval root mint
        run: |
          python research/nor31_matched_root/attacks.py \
            --class independent_calibration --verify \
            --fixture /tmp/nor31_prep/nor31_fixture.json \
            --phase /tmp/nor31_prep/nor31_calibration.json \
            --sealed /tmp/nor31_prep/nor31_pre_sealed.json \
            --manifest /tmp/nor31_prep/nor31_pre_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path
          from hashlib import sha256
          for k in ('fixture','calibration','pre_sealed','pre_manifest'):
              blob=Path('/tmp/nor31_prep',f'nor31_{k}.json').read_bytes()
              print('NOR31 FIRST ORIGINAL PREP',k,len(blob),sha256(blob).hexdigest())
          m=json.loads(Path('/tmp/nor31_prep/nor31_pre_manifest.json').read_bytes())
          assert m['attack_count']==2304 and not m['root_of_phase_known_before_committing']
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nor31_first_source_calibration_precommitment
          path: /tmp/nor31_prep/
          if-no-files-found: error
          retention-days: 90

  challenge-evaluation-root-after-precommit:
    needs: prep-independent-root-24-sources-and-2304-commitments
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nor31_first_source_calibration_precommitment
          path: /tmp/nor31_prep
      - name: Check all original binding commitments prior to evaluation seed generation
        run: |
          python research/nor31_matched_root/attacks.py \
            --class independent_calibration --verify \
            --fixture /tmp/nor31_prep/nor31_fixture.json \
            --phase /tmp/nor31_prep/nor31_calibration.json \
            --sealed /tmp/nor31_prep/nor31_pre_sealed.json \
            --manifest /tmp/nor31_prep/nor31_pre_manifest.json
      - name: Mint independent fresh OS evaluation root and freeze 24x3x512 schedules
        run: |
          mkdir -p /tmp/nor31_evaluation
          python research/nor31_matched_root/sampler.py \
            --phase evaluation \
            --fixture /tmp/nor31_prep/nor31_fixture.json \
            --manifest /tmp/nor31_prep/nor31_pre_manifest.json \
            --calibration /tmp/nor31_prep/nor31_calibration.json \
            --out /tmp/nor31_evaluation/nor31_evaluation.json
      - name: SHA-freeze evaluation phase before leaked-root attacker is invoked
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          a=json.loads(Path('/tmp/nor31_prep/nor31_calibration.json').read_bytes())
          b=Path('/tmp/nor31_evaluation/nor31_evaluation.json').read_bytes()
          z=json.loads(b)
          assert a['root_hex_disclosed_after_freeze']!=z['root_hex_disclosed_after_freeze']
          assert a['phase']=='calibration' and z['phase']=='evaluation'
          assert a['root_origin']==z['root_origin']=='os_secrets_token_bytes_32'
          assert len(z['records'])==24
          assert all(len(v)==512 for row in z['records'] for v in row['schedules'].values())
          print('NOR31 EVALUATION ROOT COMMITMENT',z['root_commitment_sha256'])
          print('NOR31 EVALUATION SCHEDULE FREEZE',len(b),sha256(b).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nor31_first_independent_evaluation_os_root
          path: /tmp/nor31_evaluation/
          if-no-files-found: error
          retention-days: 90

  leaked-root-matched-2304-attacks-and-first-grading:
    needs: challenge-evaluation-root-after-precommit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nor31_first_source_calibration_precommitment
          path: /tmp/nor31_prep
      - uses: actions/download-artifact@v4
        with:
          name: nor31_first_independent_evaluation_os_root
          path: /tmp/nor31_evaluation
      - name: With leaked evaluation root, search exact same 512-schedule budget and tie seeds
        run: |
          mkdir -p /tmp/nor31_late
          python research/nor31_matched_root/attacks.py \
            --class leaked_evaluation_root --make \
            --fixture /tmp/nor31_prep/nor31_fixture.json \
            --phase /tmp/nor31_evaluation/nor31_evaluation.json \
            --calibration /tmp/nor31_prep/nor31_calibration.json \
            --pre-manifest /tmp/nor31_prep/nor31_pre_manifest.json \
            --sealed /tmp/nor31_late/nor31_late_sealed.json \
            --manifest /tmp/nor31_late/nor31_late_manifest.json
      - name: Independently check all 2304 postroot commitments and changed positions
        run: |
          python research/nor31_matched_root/attacks.py \
            --class leaked_evaluation_root --verify \
            --fixture /tmp/nor31_prep/nor31_fixture.json \
            --phase /tmp/nor31_evaluation/nor31_evaluation.json \
            --calibration /tmp/nor31_prep/nor31_calibration.json \
            --pre-manifest /tmp/nor31_prep/nor31_pre_manifest.json \
            --sealed /tmp/nor31_late/nor31_late_sealed.json \
            --manifest /tmp/nor31_late/nor31_late_manifest.json
      - name: Grade exact target witness on 2,359,296 matched fixed-batch decisions
        run: |
          python research/nor31_matched_root/grade.py \
            --fixture /tmp/nor31_prep/nor31_fixture.json \
            --calibration /tmp/nor31_prep/nor31_calibration.json \
            --pre-sealed /tmp/nor31_prep/nor31_pre_sealed.json \
            --pre-manifest /tmp/nor31_prep/nor31_pre_manifest.json \
            --evaluation /tmp/nor31_evaluation/nor31_evaluation.json \
            --late-sealed /tmp/nor31_late/nor31_late_sealed.json \
            --late-manifest /tmp/nor31_late/nor31_late_manifest.json \
            --out /tmp/nor31_late/nor31_full.json
      - name: Freeze exact original grading bytes and retain any scientific FAIL
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          for name in ('late_sealed','late_manifest','full'):
              raw=Path('/tmp/nor31_late',f'nor31_{name}.json').read_bytes()
              print('NOR31 FIRST ORIGINAL LATE',name,len(raw),sha256(raw).hexdigest())
          z=json.loads(Path('/tmp/nor31_late/nor31_full.json').read_bytes())
          assert z['schema']=='nor31.prospective_independent_calibration_vs_leaked_eval_root.v1'
          assert z['fixed_batch_decisions']==2359296
          assert len(z['source_records'])==24
          assert z['original_early_commitments']==2304
          assert z['post_eval_root_commitments']==2304
          assert z['per_schedule_informed_tests']==36864
          assert z['per_schedule_informed_detections']==0
          assert z['delta_disagreements']==0
          print('NOR31 REGISTERED SCIENTIFIC PASS',z['registered_primary_pass'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nor31_first_leaked_root_attacks_and_full_outcome
          path: /tmp/nor31_late/
          if-no-files-found: error
          retention-days: 90

  independent-first-original-schedule-and-attack-replay:
    needs: leaked-root-matched-2304-attacks-and-first-grading
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nor31_first_source_calibration_precommitment
          path: /tmp/nor31_prep
      - uses: actions/download-artifact@v4
        with:
          name: nor31_first_independent_evaluation_os_root
          path: /tmp/nor31_evaluation
      - uses: actions/download-artifact@v4
        with:
          name: nor31_first_leaked_root_attacks_and_full_outcome
          path: /tmp/nor31_late
      - name: Rebuild native RRC25 targets, both independent HMAC roots, greedy searches and all decisions
        run: |
          python research/nor31_matched_root/receipt_audit.py \
            --fixture /tmp/nor31_prep/nor31_fixture.json \
            --calibration /tmp/nor31_prep/nor31_calibration.json \
            --pre-sealed /tmp/nor31_prep/nor31_pre_sealed.json \
            --pre-manifest /tmp/nor31_prep/nor31_pre_manifest.json \
            --evaluation /tmp/nor31_evaluation/nor31_evaluation.json \
            --late-sealed /tmp/nor31_late/nor31_late_sealed.json \
            --late-manifest /tmp/nor31_late/nor31_late_manifest.json \
            --outcome /tmp/nor31_late/nor31_full.json
      - name: Independently verify source-controlled SHA-256 of all original first-run artifacts
        run: python research/nor31_matched_root/original_archive_audit.py
