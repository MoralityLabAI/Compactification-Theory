name: NOR-28 one-shot original PREP and OS root evidence publisher

on:
  push:
    paths:
      - '.github/workflows/nor28-first-original-publisher.yml'

permissions:
  contents: write
  actions: read

jobs:
  preserve-first-os-entropy-commitment-original-bytes:
    if: github.ref == 'refs/heads/research/nor28-commit-then-entropy-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/nor28-commit-then-entropy-20261117
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nor28_first_precommitted_sources_attacks
          run-id: 44019242345
          github-token: ${{ github.token }}
          path: /tmp/nor28_original_prep
      - uses: actions/download-artifact@v4
        with:
          name: nor28_first_os_entropy_schedules_and_outcomes
          run-id: 44019242345
          github-token: ${{ github.token }}
          path: /tmp/nor28_original_challenge
      - name: Verify all FIVE exact first-run byte streams and publish deterministic source archive
        run: |
          python - <<'PY'
          import zipfile,hashlib,json
          from pathlib import Path
          ref=json.loads(Path('research/nor28_commit_entropy/results/nor28_first_original_receipt.json').read_text())
          dst=Path('research/nor28_commit_entropy/results/nor28_original_hosted.zip')
          raw={}
          for key in ('fixture','sealed','manifest','challenges','full'):
              spec=ref['raw'][key]
              src=Path('/tmp/nor28_original_prep' if key in ('fixture','sealed','manifest')
                       else '/tmp/nor28_original_challenge')/spec['name']
              data=src.read_bytes()
              assert len(data)==spec['bytes'],(key,len(data))
              assert hashlib.sha256(data).hexdigest()==spec['sha256'],key
              raw[spec['name']]=data
          with zipfile.ZipFile(dst,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for name in sorted(raw):
                  info=zipfile.ZipInfo(name,date_time=(2026,11,17,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0o644<<16
                  z.writestr(info,raw[name],compress_type=zipfile.ZIP_DEFLATED,compresslevel=9)
          print('NOR28 FIRST PERMANENT ARCHIVE',dst.stat().st_size)
          PY
          python research/nor28_commit_entropy/original_archive_audit.py
      - name: Commit original first-run evidence as binary artifact to NOR-28 branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/nor28_commit_entropy/results/nor28_original_hosted.zip
          git diff --cached --quiet && { echo 'Original archive already source-controlled'; exit 0; }
          git commit -m 'NOR-28: preserve exact first committed attacks, fresh OS seed and 147456 decisions'
          git push origin HEAD:refs/heads/research/nor28-commit-then-entropy-20261117
