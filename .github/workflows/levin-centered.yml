name: LSV-08 exploratory centered sensitivity
on:
  push:
    paths:
      - 'research/levin_sieve_v1/pretrained_trm/**'
      - '.github/workflows/levin-centered.yml'
  pull_request:
    paths:
      - 'research/levin_sieve_v1/pretrained_trm/**'
      - '.github/workflows/levin-centered.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pretrained-centered-exploratory:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyTorch CPU pinned
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned Arb interval runtime
        run: python -m pip install python-flint==0.9.0
      - name: Test all mathematical and empirical controls
        run: python -m unittest discover -s research/levin_sieve_v1/pretrained_trm -p 'test_*.py' -v
      - name: Execute exploratory frozen checkpoint benchmark
        run: |
          mkdir -p runs/lsv08
          python research/levin_sieve_v1/pretrained_trm/run_centered.py --fetch --out runs/lsv08/centered.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lsv08-exploratory-centered-reachability
          path: runs/lsv08/centered.json
          if-no-files-found: ignore
          retention-days: 30
