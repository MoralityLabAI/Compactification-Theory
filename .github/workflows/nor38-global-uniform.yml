name: NOR-38 prospective global uniform-reserve audit, frozen 48 sources, policy-aware cross-play

on:
  push:
    branches:
      - research/nor38-global-uniform-curvature-20261117
    paths:
      - 'research/nor38_global_uniform/**'
      - '.github/workflows/nor38-global-uniform.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prospective-registration-and-predata-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original NOR-38 preregistration before any source or outcome
        run: |
          git merge-base --is-ancestor 37f9ed96b122ea16fb681dd5df638cbc4285d1e4 HEAD
          test -s research/nor38_global_uniform/REGISTRATION.md
      - name: Check first NOR-37 original archive pins, full-output reserve and independent replayer parity
        run: |
          python -m compileall -q research/nor38_global_uniform
          python -m unittest research.nor38_global_uniform.test_experiment -v

  first_public_only_fixture:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'NOR38-FIRST-GRADE')
    needs: prospective-registration-and-predata-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze complete 48 fresh PUBLIC-only source inputs before calibration and grading
        run: |
          python research/nor38_global_uniform/experiment.py --make-fixture /tmp/nor38_fixture.json
      - name: Independently check public-only source roster SHA and all fields
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          from collections import Counter
          import json
          raw=Path('/tmp/nor38_fixture.json').read_bytes()
          x=json.loads(raw)
          assert x['schema']=='nor38.global_uniform_public_only_reps60to67.v1'
          assert x['registered_first_commit']=='37f9ed96b122ea16fb681dd5df638cbc4285d1e4'
          assert x['replicates']==list(range(60,68))
          assert x['source_offset']==130038000
          assert x['excluded_historical_sources']==180
          assert x['public_only'] and x['planted_and_private_target_absent']
          assert x['attack_witness_and_audit_absent']
          assert len(x['cases'])==48
          assert len({r['full_public_input_sha256'] for r in x['cases']})==48
          assert Counter(r['degree'] for r in x['cases'])=={512:24,1024:24}
          assert not any(any(name in r for name in
            ('program','future','target','attack','witness','audit')) for r in x['cases'])
          print('NOR38 FIRST PUBLIC ONLY SOURCE BYTES SHA',len(raw),sha256(raw).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nor38_first_original_public_only_source_fixture
          path: /tmp/nor38_fixture.json
          if-no-files-found: error
          retention-days: 90

  first_registered_global_uniform_grade:
    needs: first_public_only_fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONHASHSEED: "0"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nor38_first_original_public_only_source_fixture
          path: /tmp/nor38
      - name: Grade seven equal-budget adversarially calibrated auditors on 48 first sources
        run: |
          python -u research/nor38_global_uniform/experiment.py \
            --fixture /tmp/nor38/nor38_fixture.json \
            --out /tmp/nor38/nor38_full.json
      - name: Preserve original first grade and scientific PASS or FAIL without tuning
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json
          f=Path('/tmp/nor38/nor38_fixture.json').read_bytes()
          raw=Path('/tmp/nor38/nor38_full.json').read_bytes()
          x=json.loads(raw)
          assert x['schema']=='nor38.global_uniform_policyaware.v1'
          assert x['registration_first_commit']=='37f9ed96b122ea16fb681dd5df638cbc4285d1e4'
          assert x['public_fixture_sha256']==sha256(f).hexdigest()
          assert x['fresh_source_units']==len(x['source_records'])==48
          assert x['historical_sources_excluded']==180
          assert len(x['auditor_policies'])==7 and len(x['registered_five_gates'])==5
          assert x['global_uniform_probabilities']=={'global7_mix':[7,16],'global8_mix':[8,16]}
          assert x['calibration_schedules_per_source']==256
          assert x['heldout_schedules_per_source']==512
          assert x['greedy_restarts_per_policy']==8
          assert x['audit_budget']==16 and x['attack_radius']==4
          assert all(r['honest_target_false_rejections']==0 and
                     r['fully_schedule_informed_attacker_detections']==0 and
                     r['delta_decision_disagreements']==0 and
                     all(v==0 for v in r['exact_quota_and_control_checks'].values())
                     for r in x['source_records'])
          print('NOR38 FIRST FROZEN PUBLIC SOURCE BYTES SHA256',len(f),sha256(f).hexdigest())
          print('NOR38 FIRST COMPLETE GRADE BYTES SHA256',len(raw),sha256(raw).hexdigest())
          print('NOR38 ORIGINAL SCIENCE PASS',x['registered_primary_pass'])
          print('NOR38 FIVE PRE-FROZEN GATES',x['registered_five_gates'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nor38_first_original_source_and_global_uniform_grade
          path: |
            /tmp/nor38/nor38_fixture.json
            /tmp/nor38/nor38_full.json
          if-no-files-found: warn
          retention-days: 90

  independent_full_source_greedy_and_exact_crossplay_replay:
    needs: first_registered_global_uniform_grade
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nor38_first_original_source_and_global_uniform_grade
          path: /tmp/nor38
      - name: Independently regenerate 48 sources, all 7 greedy attackers and all 12x7 heldout crossplay
        run: |
          python -u research/nor38_global_uniform/receipt_audit.py --check \
            --fixture /tmp/nor38/nor38_fixture.json \
            --full /tmp/nor38/nor38_full.json
