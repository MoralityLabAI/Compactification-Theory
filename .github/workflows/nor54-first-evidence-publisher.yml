name: NOR-54 one-shot immutable first 4-of-5 FAIL evidence publisher

on:
  push:
    branches:
      - research/nor54-native-gmp-frontier-20261118
    paths:
      - '.github/workflows/nor54-first-evidence-publisher.yml'

permissions:
  contents: write
  actions: read

jobs:
  archive_original_first_60_source_verifier_only_vs_local_e2e_FAIL:
    if: github.ref == 'refs/heads/research/nor54-native-gmp-frontier-20261118' && contains(github.event.head_commit.message, 'NOR54-ARCHIVE-FIRST')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/nor54-native-gmp-frontier-20261118
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nor54_first_original_60_matched_native_gmp_e2e_CPU
          run-id: 44288506867
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/nor54_first
      - name: Copy byte-identical first source and CPU JSON and score unchanged five gates
        run: |
          set -eu
          test ! -e research/nor54_matched_frontier/results/nor54_first_original_hosted.zip
          mkdir -p research/nor54_matched_frontier/results
          python - <<'PY'
          import json
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile,ZipInfo,ZIP_DEFLATED
          folder=Path('/tmp/nor54_first')
          cpu=(folder/'nor54_first_original_cpu.json').read_bytes()
          source=(folder/'nor54_first_original_60_public_only.json').read_bytes()
          assert len(cpu)==177615
          assert sha256(cpu).hexdigest()=='27f7926a53aee3bd25520a1c9e227041997b4bdb9a92a8876cd73af267f67ed1'
          assert len(source)==1474198
          assert sha256(source).hexdigest()=='9ac35fdee19a8b9a5b2d08c1ff890bddb3141b69232c4a2687d46195c37a627d'
          d,fixture=json.loads(cpu),json.loads(source)
          assert d['schema']=='nor54.first_60_matched_native_fast_gmp_e2e_cpu.v1'
          assert fixture['schema']=='nor54.first_public_only_60_matched_exact_series.v1'
          assert d['first_registration_sha']==fixture['first_registration_sha']=='10e7ac3c3fdefec89d90d7a98a947099db8af86e'
          assert d['first_public_only_source_sha256']==sha256(source).hexdigest()
          assert d['source_count']==d['source_success_count']==60
          assert d['source_failure_count']==0
          assert len(d['first_original_five_registered_gates'])==5
          assert d['first_original_five_registered_gates']=={
              'sparse_m3073_fast_compressed_gmp_over_compressed_native_under_0p85':True,
              'sparse_m3073_local_produce_serialize_verify_over_native_under_1p50':False,
              'dense_s1_native_and_gmp_compressed_over_full_under_1p10':True,
              'all_60_exact_full_vectors_merkle_and_hostile_source_controls':True,
              'first_60_source_SHA_five_repeats_caps_and_reentrant_archive':True}
          assert d['first_original_engineering_pass'] is False
          dest=Path('research/nor54_matched_frontier/results')
          archive=dest/'nor54_first_original_hosted.zip'
          with ZipFile(archive,'w',compression=ZIP_DEFLATED,compresslevel=9) as z:
              for name,raw in (
                  ('nor54_first_original_cpu.json',cpu),
                  ('nor54_first_original_60_public_only.json',source)):
                  info=ZipInfo(name,date_time=(1980,1,1,0,0,0))
                  info.compress_type=ZIP_DEFLATED
                  z.writestr(info,raw,compress_type=ZIP_DEFLATED,compresslevel=9)
          sparse=d['primary_sixteen_sparse_m3073']
          dense=d['primary_twelve_dense_controls']
          original_primary={
            'sparse_verifier_over_compressed_native':
                sparse['median_fast_compressed_verify_over_compressed_native'],
            'sparse_local_produce_serialize_verify_over_compressed_native':
                sparse['median_produce_serialize_fast_verify_over_compressed_native'],
            'dense_native_compressed_over_full':
                dense['median_compressed_native_over_full_native'],
            'dense_fast_gmp_compressed_over_full':
                dense['median_fast_compressed_over_fast_full']
          }
          receipt={
            'schema':'nor54.first_original_60_source_CPU_archive.v1',
            'original_run':44288506867,
            'first_cpu_artifact_id':14420281905,
            'first_public_source_artifact_id':14420037504,
            'registration_first_sha':'10e7ac3c3fdefec89d90d7a98a947099db8af86e',
            'original_CPU_bytes':177615,
            'original_CPU_sha256':'27f7926a53aee3bd25520a1c9e227041997b4bdb9a92a8876cd73af267f67ed1',
            'original_source_bytes':1474198,
            'original_source_sha256':'9ac35fdee19a8b9a5b2d08c1ff890bddb3141b69232c4a2687d46195c37a627d',
            'original_archive_zip_bytes':archive.stat().st_size,
            'original_archive_zip_sha256':sha256(archive.read_bytes()).hexdigest(),
            'original_first_five_registered_gates':d['first_original_five_registered_gates'],
            'first_original_engineering_pass':False,
            'original_primary':original_primary,
            'original_by_profile':d['by_profile'],
            'original_secondary_workload':d['secondary_ten_block_source_median_workload'],
            'runtime':{'cpu_model':d['cpu_model'],
                       'python_version':d['python_version'],
                       'gmp':d['gmp_backend']},
            'limitation':'Transparent synthetic exact integer algebra; local end-to-end includes full witness production/JSON codec and independent verifier/root but no provider network/signatures or m3073 signed-native grammar.'
          }
          (dest/'nor54_first_receipt.json').write_text(
              json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          def fmt(x):return f'{x:.6f}x'
          totals=d['secondary_ten_block_source_median_workload']['source_median_total_ms']
          baseline=totals['compressed_native_R_root']
          lines=[
            '# NOR-54: first source-locked native vs fast GMP and local producer crossover',
            '',
            '**Original first engineering result: FAIL (4/5 registered gates).**',
            '',
            'The [first hosted run #44288506867](https://github.com/MoralityLabAI/Compactification-Theory/actions/runs/44288506867) completed 60 new SHA-frozen public-only sources after registration commit [10e7ac3c](https://github.com/MoralityLabAI/Compactification-Theory/commit/10e7ac3c3fdefec89d90d7a98a947099db8af86e). All five timed arms produced exactly identical complete integer inverse vectors and independently recomputed full original NOR45 Merkle roots. The first source-only job uploaded the original 60 source IDs before any inverse timing.',
            '',
            '## Immutable first evidence',
            '',
            '- Original CPU JSON **177,615 raw bytes**, SHA256 `27f7926a53aee3bd25520a1c9e227041997b4bdb9a92a8876cd73af267f67ed1`.',
            '- Original public-only source fixture **1,474,198 raw bytes**, SHA256 `9ac35fdee19a8b9a5b2d08c1ff890bddb3141b69232c4a2687d46195c37a627d`.',
            '- Original source job artifact **14420037504** preceded dependent first CPU job artifact **14420281905**. Both exact original JSON byte streams are inside [source-controlled first ZIP](results/nor54_first_original_hosted.zip), with separately anchored ZIP hash and original gate flags in [first receipt](results/nor54_first_receipt.json) and permanent [read-only SHA/ratio auditor](original_archive_audit.py).',
            '- CPU: Ubuntu 24.04, Python 3.12, gmpy2 2.3.2, five deterministic source-seeded interleaved repetitions per arm. The 168 original NOR51–53 SHA identities were excluded.',
            '',
            '## Exactly five first registered engineering gates',
            '',
            '| Frozen gate | Original result | Verdict |',
            '| --- | ---: | --- |',
            f'| Sparse m3073, 16 cases: fast compressed GMP verifier / compressed native <0.85 | **{fmt(original_primary["sparse_verifier_over_compressed_native"])}** | PASS |',
            f'| Same 16: local full witness produce + serialize/parse + fast verify / compressed native <1.50 | **{fmt(original_primary["sparse_local_produce_serialize_verify_over_compressed_native"])}** | **FAIL** |',
            f'| Dense stride1 controls, native compressed/full and fast GMP compressed/full both <1.10 | **{fmt(original_primary["dense_native_compressed_over_full"])}**, **{fmt(original_primary["dense_fast_gmp_compressed_over_full"])}** | PASS |',
            '| All 60 exact output vectors/full Merkle roots and adversarial tampering controls | **60/60 plus predata** | PASS |',
            '| Source-first SHA, 168 prior exclusions, five repeats, signed GMP caps, immutable archive | **PASS** | PASS |',
            '',
            '## Verifier service economics',
            '',
            'On the exact same sixteen sparse m3073 inputs, supplying the complete untrusted inverse witness made fast packed-GMP verification **26.0% faster** by median sourcewise ratio than recomputing that inverse with exact compressed native R. The registered full local computation arm includes fresh native compressed inverse generation, entire decimal witness JSON serialization and parsing, a separate exact fast GMP verification and the full Merkle root. Its **1.711785x** median sourcewise ratio is **71.2% slower** than compressed-native direct execution and fails the original <1.50 gate. This study provides evidence that cheap verification of a supplied exact witness need not imply cheaper complete local computation. Network transfer, provider signing/session and honesty costs remain external.',
            '',
            '## Source profile dependence',
            '',
            '| Profile | Sources | Fast compressed GMP verifier / compressed native | Local end-to-end / compressed native |',
            '| --- | ---: | ---: | ---: |'
          ]
          for profile in ('s1-b2','s4-b2','s8-b2','s4-b8','s4-b16'):
              group=d['by_profile'][profile]
              lines.append(
                  f'| {profile} | {group["count"]} | '+
                  fmt(group['median_fast_compressed_verify_over_compressed_native'])+
                  ' | '+fmt(group['median_produce_serialize_fast_verify_over_compressed_native'])+' |')
          lines+=['',
                 'Across all source lengths and profiles, median sourcewise fast compressed GMP/compressed native was **0.782652x** and local end-to-end/compressed native **1.394233x**. These pooled ratios have different population weights from the **registered sixteen-case m3073 sparse primary**, whose local end-to-end gate FAILS. There is precision-dependent crossover: at stride4-b16, GMP verifier/compressed native rises to 1.215x by sourcewise median.',
                 '',
                 '## Predeclared secondary matched-workload totals',
                 '',
                 '| Whole-output and full-root timed arm | Sum of source-median wall times | Ratio to compressed native |',
                 '| --- | ---: | ---: |']
          for name,label in (
              ('full_native_R_root','Original full native inverse'),
              ('compressed_native_R_root','Support-compressed native inverse'),
              ('fast_full_gmp_witness_root','Fast full GMP witness verification'),
              ('fast_compressed_gmp_witness_root','Fast compressed GMP verification'),
              ('compressed_produce_serialize_fast_verify_root','Local compressed produce/JSON/fast verify')):
              lines.append(f'| {label} | {totals[name]:.3f} ms | {totals[name]/baseline:.6f}x |')
          lines+=['',
                  'The local producer+verifier workload-total ratio across all 60 source medians was **1.498824x**; this exploratory secondary aggregate does not override the original sparse-m3073 primary **FAIL**. Ten matched replicate/profile block resampling intervals are preserved in the first CPU JSON.',
                  '',
                  '## Full-length output and independent cost ledgers',
                  '',
                  'The independent NOR51 full native reference inverse was created once outside each source’s five-arm timing loop and used as the same untrusted witness for the two GMP verifier-only arms. Its production time, exact canonical decimal JSON size and serialization time were recorded separately. The end-to-end arm freshly generated its own compressed inverse on **each timed invocation**, serialized and parsed that full witness, checked original full source/witness bounds and exact signed identity through NOR53 fast GMP, then rebuilt one complete original Merkle root. The SHA identity of each source, original resource bounds, each five-sample arm timing and identical output root are in the first CPU JSON.',
                  '',
                  '## Limits and next controlled study',
                  '',
                  'These are synthetic algebra-only exact signed integer series. At m3073 this kernel is outside NOR45’s currently authenticated signed native program grammar. No remote provider identity, external honest target, zero-knowledge proof, succinctness, actual network latency or session signature costs are established. A next experiment should measure a separately authenticated producer-to-verifier channel and register a selector using only public signed source complexity, with root verification and adversarial provider replay preserved. Distinguish local production cost from a justified remote-verification use case.',
                  ''
          ]
          Path('research/nor54_matched_frontier/RESULTS.md').write_text('\n'.join(lines))
          print('NOR54 ORIGINAL CPU SHA',receipt['original_CPU_sha256'])
          print('NOR54 FIRST SOURCE SHA',receipt['original_source_sha256'])
          print('NOR54 ORIGINAL FIRST ENGINEERING 4/5 FAIL',receipt['original_primary'])
          PY
      - name: Independent read-only original SHA, five sample and first 4/5 FAIL audit
        run: python research/nor54_matched_frontier/original_archive_audit.py
      - name: Commit original first raw CPU/source and registered failure unchanged
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/nor54_matched_frontier/results/nor54_first_original_hosted.zip \
                  research/nor54_matched_frontier/results/nor54_first_receipt.json \
                  research/nor54_matched_frontier/RESULTS.md
          git commit -m 'NOR-54: archive first 60-source local witness production 4-of-5 FAIL'
          for i in $(seq 1 12); do
            git fetch origin research/nor54-native-gmp-frontier-20261118
            git rebase FETCH_HEAD
            if git push origin HEAD:research/nor54-native-gmp-frontier-20261118; then
              exit 0
            fi
            sleep 2
          done
          exit 1
