name: BGI-01E 1.5B exploratory scale-control replay

on:
  push:
    branches:
      - research/bgi01e-qwen15b-scale-control-20261030
    paths:
      - 'research/bgi_attractors_v1/direct_pilot/run_model_15b.py'
      - 'research/bgi_attractors_v1/direct_pilot/BGI01E.md'
      - '.github/workflows/bgi01e-qwen15b.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qwen-15b-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONHASHSEED: "20261030"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Regression tests shared with frozen 0.5B protocol
        run: |
          python -m unittest discover -s research/bgi_attractors_v1/direct_pilot/tests -v
      - name: Install pinned CPU inference libraries
        run: |
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check transformers==4.46.3 huggingface_hub==0.27.1 safetensors==0.4.5
      - name: Execute genuine 1.5B CPU generation on unchanged BGI-01D protocol
        run: |
          python -u research/bgi_attractors_v1/direct_pilot/run_model_15b.py
      - name: Verify 1.5B receipt, fixture identity and full trace
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path("research/bgi_attractors_v1/direct_pilot/results/qwen15b_direct_policy_v1.json")
          r=json.loads(p.read_text())
          d=r["payload"]
          canonical=json.dumps(d,sort_keys=True,separators=(",",":"),ensure_ascii=False).encode()
          assert hashlib.sha256(canonical).hexdigest()==r["sha256"]
          assert d["model_id"]=="Qwen/Qwen2.5-1.5B-Instruct"
          assert d["model_revision"]=="775b11afaf83e0dc75bd5abaf90133e47b3ec082"
          fixture=Path("research/bgi_attractors_v1/direct_pilot/fixtures.json").read_bytes()
          assert hashlib.sha256(fixture).hexdigest()==d["fixture"]["sha256_bytes"]
          assert d["fixture"]["sha256_bytes"]=="b0aaaa9e22a4de02661f97260c5b1fecc7a4157765c661610a0e70719f4e2ca8"
          assert len(d["traces"])==512 and len(d["proposals"])==3 and len(d["summary"])==28
          assert d["actual_model_forward_calls"] + d["reused_identical_prompt_results"]==518
          assert d["quality_gate"]["status"] in ("PASS_BASELINE_SEMANTIC_PROBE","FAIL_BASELINE_SEMANTIC_PROBE")
          assert all(row["inference"]["model_forward"]=="deterministic_greedy_full_generation" for row in d["traces"])
          print("BGI-01E full 1.5B model evidence verified",r["sha256"])
          PY
      - name: Upload full raw 1.5B decision and policy JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bgi01e-qwen15b-scale-control-evidence
          path: research/bgi_attractors_v1/direct_pilot/results/qwen15b_direct_policy_v1.json
          if-no-files-found: warn
          retention-days: 30
