name: LSV-14 positive-radius pretrained goal rank
on:
  push:
    paths:
      - 'research/levin_sieve_v1/pretrained_trm/robust_minor.py'
      - 'research/levin_sieve_v1/pretrained_trm/run_robust_minor.py'
      - 'research/levin_sieve_v1/pretrained_trm/test_robust_minor.py'
      - 'research/levin_sieve_v1/pretrained_trm/ROBUST_RANK_REGION.md'
      - '.github/workflows/levin-robust-rank.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  certify-radius:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PyTorch and Arb runtime
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install python-flint==0.9.0
      - name: Unit tests for full-box validation
        run: python -m unittest discover -s research/levin_sieve_v1/pretrained_trm -p test_robust_minor.py -v
      - name: Initial full-coordinate interval test on frozen roster
        run: |
          mkdir -p runs/lsv14
          python research/levin_sieve_v1/pretrained_trm/run_robust_minor.py --fetch --radius 1e-12 --max-cases 64 --precision 160 --out runs/lsv14/r1e-12.json
          python - <<'PY'
          import json
          p=json.load(open('runs/lsv14/r1e-12.json'))
          print('CERTIFIED_COUNT',p['replay']['positive_radius_rank_four_cases'],'/',p['cases_checked'])
          assert p['cases_checked']==64
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lsv14-robust-rank-full-ambient
          path: runs/lsv14/*.json
          retention-days: 60
          if-no-files-found: warn
