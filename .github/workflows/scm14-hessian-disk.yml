name: SCM-14 Source Hessian and affine-disk remainder
on:
  push:
    paths:
      - 'research/seifert_activation/**'
      - '.github/workflows/scm14-hessian-disk.yml'
  pull_request:
    paths:
      - 'research/seifert_activation/**'
      - '.github/workflows/scm14-hessian-disk.yml'
permissions:
  contents: read
jobs:
  source-hessian:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned CPU verifier dependencies
        run: |
          python -m pip install sympy==1.14.0 numpy==2.3.5 mpmath==1.3.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile source Hessian and conditional bridge
        run: python -m compileall -q research/seifert_activation/scm14_hessian.py research/seifert_activation/scm14_bridge.py research/seifert_activation/scm14_reference.py
      - name: Independent derivatives, refusals and bridge tests
        run: python -m unittest discover -s research/seifert_activation/tests -p 'test_scm14*.py' -v
      - name: Reproduce frozen full-shape synthetic source curvature
        run: python research/seifert_activation/scm14_reference.py --check --out research/seifert_activation/results/scm14_cpu_reference.json
