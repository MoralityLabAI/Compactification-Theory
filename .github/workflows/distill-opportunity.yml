name: Distill certified research opportunities
on:
  pull_request:
    paths:
      - 'Distill/program_opportunity.py'
      - 'Distill/opportunity_campaign.py'
      - 'Distill/tests/test_opportunity.py'
      - '.github/workflows/distill-opportunity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  opportunity:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s Distill/tests -p test_opportunity.py -v
      - run: python -m Distill.opportunity_campaign --out /tmp/distill-opportunity
      - uses: actions/upload-artifact@v4
        with:
          name: distill-09-full-receipts
          path: /tmp/distill-opportunity/
          if-no-files-found: error
          retention-days: 30
