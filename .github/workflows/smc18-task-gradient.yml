name: SMC-18 clean task gradient and inactive SAE dual

on:
  push:
    paths:
      - 'research/real_recurrence_sae_v1/SMC18_PROTOCOL.md'
      - 'research/real_recurrence_sae_v1/smc18_task_gradient.py'
      - 'research/real_recurrence_sae_v1/test_smc18_task_gradient.py'
      - 'research/real_recurrence_sae_v1/audit_smc18.py'
      - 'research/real_recurrence_sae_v1/test_audit_smc18.py'
      - '.github/workflows/smc18-task-gradient.yml'
  pull_request:
    paths:
      - 'research/real_recurrence_sae_v1/SMC18_PROTOCOL.md'
      - 'research/real_recurrence_sae_v1/smc18_task_gradient.py'
      - 'research/real_recurrence_sae_v1/test_smc18_task_gradient.py'
      - 'research/real_recurrence_sae_v1/audit_smc18.py'
      - 'research/real_recurrence_sae_v1/test_audit_smc18.py'
      - '.github/workflows/smc18-task-gradient.yml'
  workflow_dispatch:

jobs:
  toy-gradient-checks-and-four-puzzle-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-compatible CPU torch
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Test clean autograd, physical inactive dual, numerical curvature and independent replay
        run: |
          python -m unittest discover -s research/real_recurrence_sae_v1 -p 'test_smc18_task_gradient.py' -v
          python -m unittest discover -s research/real_recurrence_sae_v1 -p 'test_audit_smc18.py' -v
      - name: Fetch original pretrained model and SAE with locked receipts
        uses: actions/download-artifact@v4
        with:
          name: smc11c-source-locked-same-fit-full
          run-id: 43721281348
          github-token: ${{ github.token }}
          path: runs/smc18/original
      - name: Fetch independent teacher and four SAE checkpoints
        uses: actions/download-artifact@v4
        with:
          name: smc13-independent-noncanonical-teachers
          run-id: 43728006836
          github-token: ${{ github.token }}
          path: runs/smc18/independent
      - name: Fetch original conditioned Hungarian feature mapping
        uses: actions/download-artifact@v4
        with:
          name: smc13-clue-conditioned-cross-teacher-transfer
          run-id: 43729335868
          github-token: ${{ github.token }}
          path: runs/smc18/conditioned
      - name: Verify source and mapping receipts before any new test
        run: |
          echo "7caafcb54e36f508b49a082892b689789a751f86b52d6d206e955e3782431087  runs/smc18/original/joint-full.json" | sha256sum -c -
          echo "1fc69e15c24087f631806a89d55beaf519c2f6ab58ac7b8193cf8fdc36d240e3  runs/smc18/independent/full.json" | sha256sum -c -
          echo "3b4637699d5af236af2d3b8aa5d04e024025b16e0d59395535892c104d472d07  runs/smc18/conditioned/conditioned.json" | sha256sum -c -
      - name: Run source-pinned four-puzzle gradient pilot
        run: python research/real_recurrence_sae_v1/smc18_task_gradient.py --fetch-source --original-artifact runs/smc18/original --independent-artifact runs/smc18/independent --conditioned-receipt runs/smc18/conditioned/conditioned.json --pilot-puzzles 4 --pair-limit 1 --out runs/smc18/pilot.json
      - name: Independently audit pilot gradient and inactive dual
        run: python research/real_recurrence_sae_v1/audit_smc18.py --receipt runs/smc18/pilot.json --out runs/smc18/pilot-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smc18-gradient-pilot-and-independent-audit
          path: |
            runs/smc18/pilot.json
            runs/smc18/pilot-audit.json
          retention-days: 90
          if-no-files-found: warn

  fresh-128-puzzle-four-pair-task-gradient:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-compatible CPU torch
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Fetch original pretrained model and SAE
        uses: actions/download-artifact@v4
        with:
          name: smc11c-source-locked-same-fit-full
          run-id: 43721281348
          github-token: ${{ github.token }}
          path: runs/smc18/original
      - name: Fetch independent teacher and SAE checkpoints
        uses: actions/download-artifact@v4
        with:
          name: smc13-independent-noncanonical-teachers
          run-id: 43728006836
          github-token: ${{ github.token }}
          path: runs/smc18/independent
      - name: Fetch original SMC13C conditioned feature matching
        uses: actions/download-artifact@v4
        with:
          name: smc13-clue-conditioned-cross-teacher-transfer
          run-id: 43729335868
          github-token: ${{ github.token }}
          path: runs/smc18/conditioned
      - name: Source receipt SHA-256 checks before new task gradient
        run: |
          echo "7caafcb54e36f508b49a082892b689789a751f86b52d6d206e955e3782431087  runs/smc18/original/joint-full.json" | sha256sum -c -
          echo "1fc69e15c24087f631806a89d55beaf519c2f6ab58ac7b8193cf8fdc36d240e3  runs/smc18/independent/full.json" | sha256sum -c -
          echo "3b4637699d5af236af2d3b8aa5d04e024025b16e0d59395535892c104d472d07  runs/smc18/conditioned/conditioned.json" | sha256sum -c -
      - name: Source-frozen four-pair × 128 fresh puzzles clean gradients and curvature
        run: python research/real_recurrence_sae_v1/smc18_task_gradient.py --fetch-source --original-artifact runs/smc18/original --independent-artifact runs/smc18/independent --conditioned-receipt runs/smc18/conditioned/conditioned.json --out runs/smc18/full.json
      - name: Independently replay physical inactive dual and registered gradient gates
        run: python research/real_recurrence_sae_v1/audit_smc18.py --receipt runs/smc18/full.json --out runs/smc18/audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smc18-full-task-gradient-curvature-and-audit
          path: |
            runs/smc18/full.json
            runs/smc18/audit.json
          retention-days: 90
          if-no-files-found: warn
