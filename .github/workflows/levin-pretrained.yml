name: LSV-05 pinned pretrained TRM CPU audit
on:
  push:
    paths:
      - 'research/levin_sieve_v1/pretrained_trm/**'
      - '.github/workflows/levin-pretrained.yml'
  pull_request:
    paths:
      - 'research/levin_sieve_v1/pretrained_trm/**'
      - '.github/workflows/levin-pretrained.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checkpoint-and-finite-bounds:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fixed CPU-only PyTorch
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned Arb interval runtime
        run: python -m pip install python-flint==0.9.0
      - name: Exact-rational mathematical checker and negative controls
        run: python -m unittest discover -s research/levin_sieve_v1/pretrained_trm -p 'test_*.py' -v
      - name: Download, verify and test external pretrained checkpoint
        run: |
          mkdir -p runs/lsv05
          python research/levin_sieve_v1/pretrained_trm/run_checkpoint.py --fetch --out runs/lsv05/receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lsv05-pinned-pretrained-cpu-receipt
          path: runs/lsv05/receipt.json
          if-no-files-found: ignore
          retention-days: 14
