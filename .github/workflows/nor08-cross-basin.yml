name: NOR-08D source-locked cross-basin code margin

on:
  push:
    paths:
      - 'research/nor01_numerical_orbit_sketch/nor08_cross_basin.py'
      - 'research/nor01_numerical_orbit_sketch/test_nor08_cross_basin.py'
      - '.github/workflows/nor08-cross-basin.yml'
  pull_request:
    paths:
      - 'research/nor01_numerical_orbit_sketch/nor08_cross_basin.py'
      - 'research/nor01_numerical_orbit_sketch/test_nor08_cross_basin.py'
      - '.github/workflows/nor08-cross-basin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-metric-gap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify rational metric separation and source receipts
        run: python -m unittest research.nor01_numerical_orbit_sketch.test_nor08_cross_basin -v
      - name: Publish exact cross-basin one-bit certificate
        run: python research/nor01_numerical_orbit_sketch/nor08_cross_basin.py --check --out /tmp/nor08_basin_codes.json
      - name: Print guaranteed cross-basin distance and label count
        run: |
          python - <<'PY'
          import json
          from fractions import Fraction as Q
          from pathlib import Path
          r=json.loads(Path('/tmp/nor08_basin_codes.json').read_text())
          gap=Q(r['first_second_ball_separation_lower_fraction'])
          assert gap>5 and r['minimum_fixed_width_terminal_label_bits']==1
          assert r['squared_natural_source_capture_certified_by_this_audit'] is False
          print('NOR08D EXACT GAP >',float(gap))
          print('NOR08D required basin labels = 2')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nor08-two-basin-distance-and-code-bit-certificate
          path: /tmp/nor08_basin_codes.json
