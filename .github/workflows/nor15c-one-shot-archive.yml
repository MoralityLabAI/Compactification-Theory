name: NOR-15C one-shot frozen full-evidence archive

on:
  push:
    paths:
      - '.github/workflows/nor15c-one-shot-archive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-verify-and-archive:
    if: github.ref == 'refs/heads/research/nor15c-full-evidence-archive-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate exact NOR-15C full JSON and check immutable original SHA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nor15c"
          python research/nor15_late_source_ceiling/ceiling.py --check --dev-cases 80 --test-cases 160 --out "$RUNNER_TEMP/nor15c/nor15c_full.json"
          echo "11b90206703a3e21c7163435de9f95d6c212cb320bf0a663bc86d0ce4981236e  $RUNNER_TEMP/nor15c/nor15c_full.json" | sha256sum --check
          test "$(wc -c < "$RUNNER_TEMP/nor15c/nor15c_full.json")" -eq 205705
      - name: Independently enumerate all 43,680 policies from frozen public and future masks
        run: |
          python research/nor15_late_source_ceiling/receipt_audit.py --check --full "$RUNNER_TEMP/nor15c/nor15c_full.json"
      - name: Archive original JSON in Git while preserving its SHA
        run: |
          set -euo pipefail
          zip -q -X -j research/nor15_late_source_ceiling/results/nor15c_full.zip "$RUNNER_TEMP/nor15c/nor15c_full.json"
          test "$(unzip -p research/nor15_late_source_ceiling/results/nor15c_full.zip nor15c_full.json | sha256sum | awk '{print $1}')" = 11b90206703a3e21c7163435de9f95d6c212cb320bf0a663bc86d0ce4981236e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/nor15_late_source_ceiling/results/nor15c_full.zip
          git diff --cached --check
          git commit -m "NOR-15C: preserve original 240-case full exact-order evidence"
          git push origin HEAD:research/nor15c-full-evidence-archive-20261115
