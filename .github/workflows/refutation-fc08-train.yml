name: FC-08 train-only conjunctive Horn source and Lean proofs

on:
  push:
    paths:
      - 'research/refutation_bench/fc08/train_data.py'
      - 'research/refutation_bench/tests/test_fc08_train.py'
      - '.github/workflows/refutation-fc08-train.yml'
  pull_request:
    paths:
      - 'research/refutation_bench/fc08/train_data.py'
      - 'research/refutation_bench/tests/test_fc08_train.py'
      - '.github/workflows/refutation-fc08-train.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source graph families and training proof budget
        run: |
          python -m unittest research.refutation_bench.tests.test_fc08_train -v
      - name: Generate source-locked JSONL and Lean theorem references
        run: |
          python -m research.refutation_bench.fc08.train_data \
            --out /tmp/FC08_train.jsonl \
            --lean /tmp/FC08_train.lean \
            --receipt /tmp/FC08_train_receipt.json
      - name: Install Lean 4.19.0
        run: |
          curl --fail --location --retry 3 \
            https://github.com/leanprover/lean4/releases/download/v4.19.0/lean-4.19.0-linux.tar.zst \
            -o /tmp/lean-4.19.0-linux.tar.zst
          tar --zstd -xf /tmp/lean-4.19.0-linux.tar.zst -C /tmp
          echo /tmp/lean-4.19.0-linux/bin >> "$GITHUB_PATH"
      - name: Compile all train/dev positive theorems without admitted axioms
        run: |
          lean /tmp/FC08_train.lean 2>&1 | tee /tmp/FC08_train_lean.log
          if grep -E 'error:|sorryAx' /tmp/FC08_train_lean.log; then exit 1; fi
          test "$(grep -c 'does not depend on any axioms' /tmp/FC08_train_lean.log)" -ge 2
      - name: Save train source hashes and Lean proof receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fc08-train-source-${{ github.run_id }}
          path: |
            /tmp/FC08_train.jsonl
            /tmp/FC08_train.lean
            /tmp/FC08_train_receipt.json
            /tmp/FC08_train_lean.log
          retention-days: 30
          if-no-files-found: warn
