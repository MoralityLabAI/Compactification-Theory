name: SCM-13 affine causal disks and source-locked pairing
on:
  push:
    paths:
      - 'research/seifert_activation/**'
      - '.github/workflows/scm13-affine-disk.yml'
  pull_request:
    paths:
      - 'research/seifert_activation/**'
      - '.github/workflows/scm13-affine-disk.yml'
permissions:
  contents: read
jobs:
  affine-disk-and-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned exact-algebra dependency
        run: python -m pip install sympy==1.14.0
      - name: Compile affine-disk and campaign integrity modules
        run: python -m compileall -q research/seifert_activation
      - name: Run source-conditional tests
        run: python -m unittest discover -s research/seifert_activation/tests -p test_scm13.py -v
      - name: Verify immutable synthetic reference
        run: python research/seifert_activation/scm13_reference.py --check --out research/seifert_activation/results/scm13_synthetic_reference.json
