name: SMC-08 pinned recurrent curvature and feature Jacobians

on:
  push:
    paths:
      - 'research/real_recurrence_sae_v1/smc08_curvature.py'
      - 'research/real_recurrence_sae_v1/validated_causal_tube.py'
      - 'research/real_recurrence_sae_v1/test_smc08_curvature.py'
      - '.github/workflows/smc08-curvature.yml'
  pull_request:
    paths:
      - 'research/real_recurrence_sae_v1/**'
      - '.github/workflows/smc08-curvature.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-locked-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU PyTorch
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Numerical Jacobian and exact-real outer-bound toy controls
        run: python -m unittest discover -s research/real_recurrence_sae_v1 -p 'test_smc08_curvature.py' -v
      - name: Source-locked 16-puzzle Jacobian pilot
        run: |
          python research/real_recurrence_sae_v1/smc08_curvature.py \
            --fetch --max-cases 16 --seeds 71 --sae-steps 75 \
            --radii 0.02,0.2,0.8 --out runs/smc08/pilot.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smc08-locked-curvature-pilot
          path: runs/smc08/pilot.json
          if-no-files-found: warn

  source-locked-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU PyTorch
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Source-locked 64-puzzle Jacobian and curvature audit
        run: |
          python research/real_recurrence_sae_v1/smc08_curvature.py \
            --fetch --max-cases 64 --seeds 71,89,113 --sae-steps 300 \
            --radii 0.02,0.2,0.8 --out runs/smc08/full.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smc08-locked-64-puzzle-curvature
          path: runs/smc08/full.json
          if-no-files-found: warn
