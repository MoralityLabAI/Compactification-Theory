name: NCG-01 exact boundary constraints

on:
  push:
    paths:
      - 'research/ncg01/**'
      - '.github/workflows/ncg01-exact.yml'
  pull_request:
    paths:
      - 'research/ncg01/**'
      - '.github/workflows/ncg01-exact.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce exact counts, codec and gluing receipts
        run: >-
          python research/ncg01/verify_ncg01.py
          --check research/ncg01/receipt.json
          --output "${{ runner.temp }}/ncg01-replay.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ncg01-exact-replay
          path: |
            ${{ runner.temp }}/ncg01-replay.json
            ${{ runner.temp }}/ncg01-replay.runtime.json
