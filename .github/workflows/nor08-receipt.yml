name: NOR-08C frozen expanded second-basin receipt audit

on:
  pull_request:
    paths:
      - 'research/nor01_numerical_orbit_sketch/nor08_receipt_audit.py'
      - 'research/nor01_numerical_orbit_sketch/results/nor08_second_basin_summary.json'
      - '.github/workflows/nor08-receipt.yml'
  push:
    paths:
      - 'research/nor01_numerical_orbit_sketch/nor08_receipt_audit.py'
      - 'research/nor01_numerical_orbit_sketch/results/nor08_second_basin_summary.json'
      - '.github/workflows/nor08-receipt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-fraction-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit 3e-6 ball against original 1e-20 proof and source checkpoint
        run: python research/nor01_numerical_orbit_sketch/nor08_receipt_audit.py --check
