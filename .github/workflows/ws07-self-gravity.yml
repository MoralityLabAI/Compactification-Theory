name: WS-07 Self-gravitating Charged Bulk

on:
  pull_request:
    paths:
      - 'research/warped_superfluid_v7/**'
      - '.github/workflows/ws07-self-gravity.yml'
  push:
    paths:
      - 'research/warped_superfluid_v7/**'
      - '.github/workflows/ws07-self-gravity.yml'

jobs:
  staticity-and-tensor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r research/warped_superfluid_v7/requirements.txt
      - name: Run 26 regression gates
        working-directory: research/warped_superfluid_v7
        run: python -m unittest discover -s tests -v
      - name: Generate reproducible sum-rule and tensor output
        working-directory: research/warped_superfluid_v7
        run: python run_experiment.py
      - name: Publish numerical evidence
        uses: actions/upload-artifact@v4
        with:
          name: ws07-static-charge-sum-rule-and-tensor
          path: research/warped_superfluid_v7/results/
          if-no-files-found: error
