name: SMC-13B calibrated cross-checkpoint feature alignment and heldout transfer

on:
  push:
    paths:
      - 'research/real_recurrence_sae_v1/smc13_transfer.py'
      - 'research/real_recurrence_sae_v1/test_smc13_transfer.py'
      - '.github/workflows/smc13-transfer.yml'
  pull_request:
    paths:
      - 'research/real_recurrence_sae_v1/smc13_transfer.py'
      - 'research/real_recurrence_sae_v1/test_smc13_transfer.py'
      - '.github/workflows/smc13-transfer.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  calibration-only-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned source-compatible CPU Torch
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify assignment optimality and puzzle-cluster scoring
        run: python -m unittest discover -s research/real_recurrence_sae_v1 -p 'test_smc13_transfer.py' -v
      - name: Fetch original pretrained-model SAE, exact source run
        uses: actions/download-artifact@v4
        with:
          name: smc11c-source-locked-same-fit-full
          run-id: 43721281348
          github-token: ${{ github.token }}
          path: runs/smc13/original
      - name: Fetch independent newly trained recurrent teachers and their SAEs
        uses: actions/download-artifact@v4
        with:
          name: smc13-independent-noncanonical-teachers
          run-id: 43728006836
          github-token: ${{ github.token }}
          path: runs/smc13/independent
      - name: Verify both complete source receipts and original frozen checkpoint pins
        run: |
          echo "7caafcb54e36f508b49a082892b689789a751f86b52d6d206e955e3782431087  runs/smc13/original/joint-full.json" | sha256sum -c -
          echo "1fc69e15c24087f631806a89d55beaf519c2f6ab58ac7b8193cf8fdc36d240e3  runs/smc13/independent/full.json" | sha256sum -c -
      - name: Fit calibration-only feature permutations and score entirely heldout cohorts
        run: |
          python research/real_recurrence_sae_v1/smc13_transfer.py \
            --fetch-source \
            --original-sae-artifact runs/smc13/original \
            --new-model-artifact runs/smc13/independent \
            --out runs/smc13/alignment.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smc13-calibration-only-independent-teacher-feature-transfer
          path: runs/smc13/alignment.json
          if-no-files-found: warn
          retention-days: 90
