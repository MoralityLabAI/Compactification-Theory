name: WS-05 Charged Bulk Goldstone and Tangent Response
on:
  pull_request:
    paths:
      - 'research/warped_superfluid_v5/**'
      - '.github/workflows/ws05-charged-bulk-tangent.yml'
  push:
    paths:
      - 'research/warped_superfluid_v5/**'
      - '.github/workflows/ws05-charged-bulk-tangent.yml'
jobs:
  goldstone-and-coupled-response:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU numerical dependencies
        run: python -m pip install -r research/warped_superfluid_v5/requirements.txt
      - name: Run 20 tangent and Goldstone physics regression tests
        working-directory: research/warped_superfluid_v5
        run: python -m unittest discover -s tests -v
      - name: Regenerate charged-background diagnostics
        working-directory: research/warped_superfluid_v5
        run: python run_experiment.py > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: ws05-charged-tangent-goldstone-diagnostics
          path: research/warped_superfluid_v5/results/
          if-no-files-found: error
