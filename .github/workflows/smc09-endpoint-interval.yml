name: SMC-09 exact-real endpoint interval dominance

on:
  push:
    paths:
      - 'research/real_recurrence_sae_v1/smc09_endpoint_arb.py'
      - 'research/real_recurrence_sae_v1/test_smc09_endpoint_arb.py'
      - '.github/workflows/smc09-endpoint-interval.yml'
  pull_request:
    paths:
      - 'research/real_recurrence_sae_v1/smc09_*'
      - '.github/workflows/smc09-endpoint-interval.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned validation and pretrained CPU runtime
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install python-flint==0.9.0
      - name: Validate exact finite-endpoint ordering algebra
        run: python -m unittest discover -s research/real_recurrence_sae_v1 -p 'test_smc09_endpoint_arb.py' -v
      - name: Source-locked Arb endpoint pilot, two heldout Sudoku puzzles
        run: |
          python research/real_recurrence_sae_v1/smc09_endpoint_arb.py \
            --fetch --max-test-puzzles 2 --sae-seeds 71 --sae-steps 300 \
            --radii 0.02,0.2 --precision 160 \
            --out runs/smc09/pilot.json
      - name: Archive pilot exact interval ordering
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smc09-exact-real-pilot
          path: runs/smc09/pilot.json
          if-no-files-found: warn
          retention-days: 45

  full:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned validation and pretrained CPU runtime
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install python-flint==0.9.0
      - name: Source-locked exact-real SAE endpoint ordering, sixteen heldout puzzles
        run: |
          python research/real_recurrence_sae_v1/smc09_endpoint_arb.py \
            --fetch --max-test-puzzles 16 --sae-seeds 71,89,113 --sae-steps 300 \
            --radii 0.02,0.2,0.8 --precision 160 \
            --out runs/smc09/full.json
      - name: Archive full exact interval ordering
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smc09-locked-16p-3seed-endpoints
          path: runs/smc09/full.json
          if-no-files-found: warn
          retention-days: 90
