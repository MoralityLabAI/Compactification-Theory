name: KSR-01C coarse state dependence audit
permissions:
  contents: read
on:
  push:
    paths:
      - 'research/tree_reconstruction_locality_v1/**'
      - 'research/rrc_compactification/**'
      - '.github/workflows/ksr01c-coarse-state.yml'
  pull_request:
    paths:
      - 'research/tree_reconstruction_locality_v1/**'
      - 'research/rrc_compactification/**'
      - '.github/workflows/ksr01c-coarse-state.yml'
  workflow_dispatch:
jobs:
  exact-dependence-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify covariance and correlated sibling counterexamples
        run: python -m unittest discover -s research/tree_reconstruction_locality_v1 -p test_dependence.py -v
      - name: Emit exact falsification witness
        run: python research/tree_reconstruction_locality_v1/dependence.py > /tmp/ksr01c_dependence.json
      - uses: actions/upload-artifact@v4
        with:
          name: ksr01c-exact-dependence
          path: /tmp/ksr01c_dependence.json
  frozen-rrc25-assumptions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen checkpoint, independent-edge enumeration and input isolation
        run: python -m unittest discover -s research/tree_reconstruction_locality_v1 -p test_rrc25_audit.py -v
      - name: Audit all registered root states and branching continuations
        run: python research/tree_reconstruction_locality_v1/audit_rrc25.py --out /tmp/ksr01c_rrc25.json
      - uses: actions/upload-artifact@v4
        with:
          name: ksr01c-frozen-rrc25-coarse-state
          path: /tmp/ksr01c_rrc25.json
