name: RB-CG-06 native bounded arithmetic critique
on:
  push:
    paths:
      - 'research/refutation_bench/critique_generation_cg06/**'
      - '.github/workflows/refutation-cg06.yml'
  pull_request:
    paths:
      - 'research/refutation_bench/critique_generation_cg06/**'
      - '.github/workflows/refutation-cg06.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-and-trained-critics:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: patrickdugan/MathCan
          ref: 6d02b611c7358216379cb36952512a104e0bdb8e
          path: _mathcan
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU Torch and Lean
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst -o /tmp/lean435.tar.zst
          tar --zstd -xf /tmp/lean435.tar.zst -C /tmp
          echo /tmp/lean-4.35.0-linux/bin >> "$GITHUB_PATH"
      - name: Certify native type adapters, train, and independently replay actor certificates
        run: |
          lean --version
          python -u research/refutation_bench/critique_generation_cg06/train.py --source _mathcan --out /tmp/cg06
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cg06-native-model-receipts
          path: /tmp/cg06
          retention-days: 30
