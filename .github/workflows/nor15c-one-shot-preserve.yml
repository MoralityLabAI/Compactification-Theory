name: NOR-15C one-shot source-locked full hindsight evidence archival writer

on:
  push:
    paths:
      - '.github/workflows/nor15c-one-shot-preserve.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reproduce-and-commit:
    if: github.ref == 'refs/heads/research/nor15c-aliased-verifier-ceiling-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-run all 43680 oracle rankings and require byte-identical original JSON
        run: |
          set -euo pipefail
          python research/nor15c_verifier_alias/ceiling.py --check \
            --out research/nor15c_verifier_alias/results/nor15c_full.json
          echo "f2dc2865fca360e4ccb717c0e84cde6fe5c1f4a1bea29111b5b1d250753e5f29  research/nor15c_verifier_alias/results/nor15c_full.json" | sha256sum --check
          test "$(wc -c < research/nor15c_verifier_alias/results/nor15c_full.json)" -eq 23205
          python research/nor15c_verifier_alias/audit_result.py \
            --check --full research/nor15c_verifier_alias/results/nor15c_full.json
      - name: Commit source-locked original full result to isolated research branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/nor15c_verifier_alias/results/nor15c_full.json
          git diff --cached --check
          git commit -m "NOR-15C: archive 40-case 43680-policy source-locked exact result JSON"
          git push origin "HEAD:research/nor15c-aliased-verifier-ceiling-20261115"
