name: IRTC-REV-01 exact interface disclosure audit
on:
  pull_request:
    paths:
      - 'research/interface_time_compactification/**'
      - '.github/workflows/irtc-rev01.yml'
  push:
    paths:
      - 'research/interface_time_compactification/**'
      - '.github/workflows/irtc-rev01.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s research/interface_time_compactification -p 'test_*.py' -v
