name: RB-CG-10 semantic and provenance audit
on:
  push:
    paths:
      - 'research/refutation_bench/critique_generation_cg10/**'
      - '.github/workflows/refutation-cg10.yml'
  pull_request:
    paths:
      - 'research/refutation_bench/critique_generation_cg10/**'
      - '.github/workflows/refutation-cg10.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  provenance-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU Torch and Lean
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          curl --fail --location --retry 3 https://github.com/leanprover/lean4/releases/download/v4.35.0/lean-4.35.0-linux.tar.zst -o /tmp/lean435.tar.zst
          tar --zstd -xf /tmp/lean435.tar.zst -C /tmp
          echo "/tmp/lean-4.35.0-linux/bin" >> "$GITHUB_PATH"
      - name: Verify source dependency closures and train joint audit scheduler
        run: |
          lean --version
          python -u research/refutation_bench/critique_generation_cg10/search.py --out /tmp/cg10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cg10-native-provenance-receipts
          path: /tmp/cg10
          retention-days: 30
