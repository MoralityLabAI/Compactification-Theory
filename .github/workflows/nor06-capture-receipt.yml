name: NOR-06C exact capture receipt audit

on:
  push:
    paths:
      - 'research/nor01_numerical_orbit_sketch/nor06_receipt_audit.py'
      - 'research/nor01_numerical_orbit_sketch/results/nor06_certified_capture_summary.json'
      - '.github/workflows/nor06-capture-receipt.yml'
  pull_request:
    paths:
      - 'research/nor01_numerical_orbit_sketch/nor06_receipt_audit.py'
      - 'research/nor01_numerical_orbit_sketch/results/nor06_certified_capture_summary.json'
      - '.github/workflows/nor06-capture-receipt.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-receipt-and-source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check signed positive and squared negative receipt exact fractions
        run: python research/nor01_numerical_orbit_sketch/nor06_receipt_audit.py --check
