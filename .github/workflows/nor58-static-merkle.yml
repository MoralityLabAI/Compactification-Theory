name: NOR-58 preregistered indexed sparse Merkle templates and signed exact CPU

on:
  push:
    branches:
      - research/nor58-static-merkle-template-20261118
    paths:
      - 'research/nor58_static_merkle/**'
      - '.github/workflows/nor58-static-merkle.yml'
  pull_request:
    paths:
      - 'research/nor58_static_merkle/**'
      - '.github/workflows/nor58-static-merkle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original_registration_and_source_free_signed_root_controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin GNU MP and research Ed25519 fixture dependencies
        run: python -m pip install --disable-pip-version-check cryptography==46.0.4 gmpy2==2.3.2
      - name: Verify original NOR58 registration precedes new sources and timing
        run: |
          git merge-base --is-ancestor ddbabc02cf8702fe2da2c9962174ddcfcbed39a4 HEAD
          test -s research/nor58_static_merkle/REGISTRATION.md
      - name: Compile exact indexed Merkle templates and CPU runner
        run: python -m compileall -q research/nor58_static_merkle
      - name: Exact index/padding tree and hostile source and signature controls
        run: python -m unittest research.nor58_static_merkle.test_template -v
      - name: Preserve original NOR57B 4-of-5 FAIL and source-locked historical SHA
        run: |
          python research/nor57b_independent/original_archive_audit.py
          python research/nor57_authenticated_router/original_failure_audit.py
      - name: Preserve original NOR56 signed-v2 and NOR50 authenticated program attacks
        run: |
          python -m unittest research.nor56_batch_codec.test_codec_v2 -v
          python -m unittest research.nor50_memoized_exact.test_cached -v
      - name: Admission only, no first NOR58 input generation
        run: |
          python - <<'PY'
          from research.nor58_static_merkle import cohort,template
          assert cohort.REGISTERED=='ddbabc02cf8702fe2da2c9962174ddcfcbed39a4'
          assert len(cohort.REPS)*len(cohort.LENGTHS)*len(cohort.PROFILES)*len(cohort.FAMILIES)==60
          assert len(cohort.historical_ids())==468
          assert template.SUPPORTED_STRIDES==(1,4,8)
          print('NOR58 original prospective predata and root security controls PASS')
          PY

  first_original_60_public_only_source_SHA_freeze:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'NOR58-FIRST-CPU')
    needs: original_registration_and_source_free_signed_root_controls
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Freeze first 60 new SHA-disjoint PUBLIC sources before inverse/templates/CPU
        run: |
          python -u research/nor58_static_merkle/cohort.py \
            --public-only-out /tmp/nor58_first_original_60_public_only.json
      - name: Independently audit source-only bytes, 468 exclusions and full grammar
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          from research.nor58_static_merkle import cohort
          p=Path('/tmp/nor58_first_original_60_public_only.json')
          x,h=cohort.read_fixture(p)
          rows=x['cases']
          assert len(rows)==len({r['source_sha256'] for r in rows})==60
          assert Counter(r['length'] for r in rows)=={769:20,1537:20,3073:20}
          assert Counter(r['stride'] for r in rows)=={1:12,4:36,8:12}
          assert set(r['source_sha256'] for r in rows).isdisjoint(cohort.historical_ids())
          assert x['no_inverse_root_payload_signature_session_or_timing']
          assert all(not set(r).intersection(('inverse','witness','root','nonce',
                  'signature','session','template','cache','payload','timing',
                  'provider','dynamic_hash','target')) for r in rows)
          print('NOR58 FIRST ORIGINAL SOURCE-ONLY 60 RAW BYTES SHA256',p.stat().st_size,h)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nor58_first_original_60_public_only_source_roster
          path: /tmp/nor58_first_original_60_public_only.json
          retention-days: 90
          if-no-files-found: error

  first_original_three_arm_five_repeat_signed_CPU:
    needs: first_original_60_public_only_source_SHA_freeze
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pin exact first NOR53 GMP and NOR56 Ed25519 versions
        run: python -m pip install --disable-pip-version-check cryptography==46.0.4 gmpy2==2.3.2
      - uses: actions/download-artifact@v4
        with:
          name: nor58_first_original_60_public_only_source_roster
          path: /tmp/nor58
      - name: First 60 signed full Merkle sources × original/warm/cold × five repeats
        run: |
          python -u research/nor58_static_merkle/benchmark_cpu.py \
            --public-file /tmp/nor58/nor58_first_original_60_public_only.json \
            --repeats 5 --out /tmp/nor58/nor58_first_original_cpu.json
      - name: Verify first raw CPU SHA and all five immutable original PASS or FAIL gates
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          path=Path('/tmp/nor58/nor58_first_original_cpu.json')
          raw=path.read_bytes()
          x=json.loads(raw)
          assert x['schema']=='nor58.first_60_source_authenticated_static_merkle_cpu.v1'
          assert x['first_registration_sha']=='ddbabc02cf8702fe2da2c9962174ddcfcbed39a4'
          assert x['source_count']==60 and len(x['source_records'])==60
          assert x['repeats']==5 and len(x['signed_full_root_arms'])==3
          assert len(x['first_original_five_registered_gates'])==5
          assert all(type(v) is bool for v in x['first_original_five_registered_gates'].values())
          assert x['first_original_engineering_pass']==all(x['first_original_five_registered_gates'].values())
          print('NOR58 FIRST ORIGINAL CPU RAW BYTES SHA256',len(raw),sha256(raw).hexdigest())
          print('NOR58 FIRST ORIGINAL FIVE GATES',x['first_original_five_registered_gates'])
          print('NOR58 FIRST ORIGINAL ENGINEERING PASS',x['first_original_engineering_pass'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nor58_first_original_60_signed_static_merkle_CPU
          path: |
            /tmp/nor58/nor58_first_original_cpu.json
            /tmp/nor58/nor58_first_original_60_public_only.json
          retention-days: 90
          if-no-files-found: warn
