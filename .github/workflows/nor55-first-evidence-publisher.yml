name: NOR-55 one-shot immutable first CPU FAIL and local TCP evidence archive

on:
  push:
    branches:
      - research/nor55-signed-compact-witness-20261118
    paths:
      - '.github/workflows/nor55-first-evidence-publisher.yml'

permissions:
  contents: write
  actions: read

jobs:
  preserve_immutable_first_authenticated_verifier_FAIL:
    if: github.ref == 'refs/heads/research/nor55-signed-compact-witness-20261118' && contains(github.event.head_commit.message, 'NOR55-ARCHIVE-FIRST')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/nor55-signed-compact-witness-20261118
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nor55_first_original_60_authenticated_compact_CPU
          run-id: 44292743862
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/nor55_original_cpu
      - uses: actions/download-artifact@v4
        with:
          name: nor55_first_original_secondary_two_process_TCP_loopback
          run-id: 44292743862
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/nor55_original_tcp
      - name: Freeze three original byte streams, gates, raw SHA and source-bound report
        run: |
          set -eu
          test ! -e research/nor55_compact_witness/results/nor55_first_original_hosted.zip
          mkdir -p research/nor55_compact_witness/results
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile,ZipInfo,ZIP_DEFLATED
          import json
          src=Path('/tmp/nor55_original_cpu')
          tcp_dir=Path('/tmp/nor55_original_tcp')
          cpu=(src/'nor55_first_original_cpu.json').read_bytes()
          public=(src/'nor55_first_original_60_public_only.json').read_bytes()
          tcp=(tcp_dir/'nor55_first_local_loopback_secondary.json').read_bytes()
          assert len(cpu)==230272 and sha256(cpu).hexdigest()==(
              '98c45ed555349fcfd860def1975d571d0e84565e6cad976d30941cae3384b10e')
          assert len(public)==1474567 and sha256(public).hexdigest()==(
              'd1e6b2f5f37edc37f4b996b42e10768b47b4c199ed274cf53643be34fddddd59')
          assert len(tcp)==20128 and sha256(tcp).hexdigest()==(
              '45d06c36990cd1cd005e6a0c8478ddca57f52afe1fef168c149e45787063e761')
          x,fixture,secondary=json.loads(cpu),json.loads(public),json.loads(tcp)
          assert x['schema']=='nor55.first_60_signed_compact_witness_cpu.v1'
          assert fixture['schema']=='nor55.first_public_only_60_signed_compact_sources.v1'
          assert x['first_registration_sha']==fixture['first_registration_sha']==(
              '9f7fb42a2e0a8648db63301bed381cb7f3aa0dc2')
          assert x['first_public_only_source_sha256']==sha256(public).hexdigest()
          assert x['source_count']==x['source_success_count']==60
          assert x['source_failure_count']==0
          assert x['first_original_five_registered_gates']=={
              'sparse_m3073_signed_compact_verifier_over_native_under_0p85':True,
              'sparse_m3073_signed_compact_over_signed_json_under_0p85':False,
              'all_48_sparse_signed_compact_wire_over_full_json_payload_under_0p55':True,
              'all_exact_full_roots_pinned_key_source_session_replay_tamper_controls':True,
              'source_first_60_sha_228_disjoint_five_repeats_caps_reentrant_archive':True}
          assert x['first_original_engineering_pass'] is False
          assert secondary['schema']=='nor55.first_source_matched_local_loopback_secondary.v1'
          assert secondary['original_first_CPU_sha256']==sha256(cpu).hexdigest()
          assert secondary['source_only_sha256']==sha256(public).hexdigest()
          assert secondary['source_count']==16 and secondary['repeats']==3
          assert secondary['producer_and_verifier_in_distinct_processes']
          assert all(r['all_three_independent_verifier_responses_matched']
                     for r in secondary['source_records'])
          dest=Path('research/nor55_compact_witness/results')
          archive=dest/'nor55_first_original_hosted.zip'
          with ZipFile(archive,'w',compression=ZIP_DEFLATED,compresslevel=9) as z:
              for name,raw in (
                  ('nor55_first_original_cpu.json',cpu),
                  ('nor55_first_original_60_public_only.json',public),
                  ('nor55_first_local_loopback_secondary.json',tcp)):
                  info=ZipInfo(name,date_time=(1980,1,1,0,0,0))
                  info.compress_type=ZIP_DEFLATED
                  z.writestr(info,raw,compress_type=ZIP_DEFLATED,compresslevel=9)
          sp=x['primary_sparse_m3073']
          wire=x['primary_all_sparse_wire']
          primary={
              'sparse_m3073_signed_compact_over_native':
                  sp['median_signed_compact_over_native'],
              'sparse_m3073_signed_compact_over_signed_json':
                  sp['median_signed_compact_over_signed_json'],
              'all_sparse_signed_compact_wire_over_full_json_payload':
                  wire['median_compact_signed_wire_over_full_json_payload']
          }
          receipt={
              'schema':'nor55.first_original_60_source_signed_compact_archive.v1',
              'first_run':44292743862,
              'first_cpu_artifact_id':14421997454,
              'first_source_artifact_id':14421873595,
              'first_secondary_TCP_artifact_id':14422382237,
              'first_registration_sha':'9f7fb42a2e0a8648db63301bed381cb7f3aa0dc2',
              'raw_cpu_bytes':230272,
              'raw_cpu_sha256':'98c45ed555349fcfd860def1975d571d0e84565e6cad976d30941cae3384b10e',
              'raw_source_bytes':1474567,
              'raw_source_sha256':'d1e6b2f5f37edc37f4b996b42e10768b47b4c199ed274cf53643be34fddddd59',
              'raw_secondary_bytes':20128,
              'raw_secondary_sha256':'45d06c36990cd1cd005e6a0c8478ddca57f52afe1fef168c149e45787063e761',
              'archive_zip_bytes':archive.stat().st_size,
              'archive_zip_sha256':sha256(archive.read_bytes()).hexdigest(),
              'first_original_five_registered_gates':x['first_original_five_registered_gates'],
              'original_first_engineering_pass':False,
              'original_primary':primary,
              'original_by_profile':x['by_profile'],
              'original_by_length':x['by_length'],
              'original_secondary_source_median_workload':
                  x['secondary_matched_source_median_workload'],
              'secondary_loopback':{
                  'source_count':16,'repeats':3,
                  'median_sourcewise_ratio':secondary[
                      'median_sourcewise_loopback_over_same_job_native'],
                  'p95_ms':secondary['p95_of_48_request_response_samples_ms']
              },
              'security_scope':'Deterministic public research fixture signing key; conditional source-bound Ed25519 integrity and replay controls only. No real trusted publisher identity.',
              'domain_scope':'Synthetic transparent exact integer witnesses, m3073 beyond NOR45 signed grammar, localhost TCP secondary only.'
          }
          (dest/'nor55_first_receipt.json').write_text(
              json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          fmt=lambda val:f'{val:.6f}x'
          totals=x['secondary_matched_source_median_workload']['sum_source_median_ms']
          root=totals['native_compressed_R_root']
          lines=[
              '# NOR-55: first source-bound signed compact exact witness verifier',
              '',
              '**Original first registered engineering result: FAIL (4/5 gates).**',
              '',
              'The first [source-locked Actions run #44292743862](https://github.com/MoralityLabAI/Compactification-Theory/actions/runs/44292743862) completed 60 fresh, 228 historical-excluded sources with four complete exact inverse/vector and independent NOR45 full-Merkle-root arms, five source-seeded interleaved repetitions. First registration [9f7fb42a](https://github.com/MoralityLabAI/Compactification-Theory/commit/9f7fb42a2e0a8648db63301bed381cb7f3aa0dc2) preceded any NOR55 source or CPU. A separate upstream source-only artifact was frozen before any witness/nonce/timing data.',
              '',
              '## First immutable evidence',
              '',
              '- Original first CPU JSON: **230,272 bytes**, SHA-256 `98c45ed555349fcfd860def1975d571d0e84565e6cad976d30941cae3384b10e`.',
              '- Original public-only 60-source JSON: **1,474,567 bytes**, SHA-256 `d1e6b2f5f37edc37f4b996b42e10768b47b4c199ed274cf53643be34fddddd59`.',
              '- Separate first two-process TCP loopback secondary JSON: **20,128 bytes**, SHA-256 `45d06c36990cd1cd005e6a0c8478ddca57f52afe1fef168c149e45787063e761`.',
              '- All three original byte streams are preserved inside [results/nor55_first_original_hosted.zip](results/nor55_first_original_hosted.zip); ZIP SHA, original five gate values, source medians and secondary scope are pinned in the [receipt](results/nor55_first_receipt.json), checked by [permanent read-only SHA auditor](original_archive_audit.py).',
              '- First source artifact **14421873595**, first CPU artifact **14421997454**, separate local TCP secondary artifact **14422382237**. Python 3.12, gmpy2 2.3.2, cryptography 46.0.4, Ubuntu 24.04. Test signing fixture key is deterministic and public, **insecure for deployment**.',
              '',
              '## Exactly five frozen original first engineering gates',
              '',
              '| Registered gate | Original measured result | Verdict |',
              '| --- | ---: | --- |',
              '| Authenticated compact verifier / compressed-native on 16 sparse m3073, <0.85 | **'+fmt(primary['sparse_m3073_signed_compact_over_native'])+'** | PASS |',
              '| Authenticated compact / authenticated decimal JSON on same 16, <0.85 | **'+fmt(primary['sparse_m3073_signed_compact_over_signed_json'])+'** | **FAIL** |',
              '| Complete signed compact envelope bytes / original full decimal JSON payload bytes on 48 sparse, <0.55 | **'+fmt(primary['all_sparse_signed_compact_wire_over_full_json_payload'])+'** | PASS |',
              '| Exact complete signed integers/full Merkle roots and pinned-key/replay/malformed witness controls | **60/60 plus predata CI** | PASS |',
              '| SHA-frozen 60-source upstream, 228 old IDs excluded, five repeats, resource caps, reentrancy, first evidence archive | **PASS** | PASS |',
              '',
              'The failed registered codec runtime threshold was missed by about **0.001483x**, which remains an original **FAIL**. Raw source and all five per-arm timing samples are preserved for independent uncertainty analysis. The compact signed format used about **41.3%** of the original unsigned full-decimal JSON witness payload bytes on the registered 48-source sparse group, including the complete signature/header in the compact numerator. This is an approximately **58.7% byte reduction**. On the 16 longest sparse sources, authenticated compact verifier-only execution was about **25.5% faster** than compressed-native recomputation of the inverse, assuming the full witness is already supplied.',
              '',
              '## Source profile dependence',
              '',
              '| Profile | Sources | Signed compact/native | Signed compact/signed JSON | Compact signed wire/full JSON payload |',
              '| --- | ---: | ---: | ---: | ---: |'
          ]
          for profile in ('s1-b2','s4-b2','s8-b2','s4-b8','s4-b16'):
              r=x['by_profile'][profile]
              lines.append(
                  '| '+profile+' | '+str(r['count'])+' | '+
                  fmt(r['median_signed_compact_over_native'])+' | '+
                  fmt(r['median_signed_compact_over_signed_json'])+' | '+
                  fmt(r['median_compact_signed_wire_over_full_json_payload'])+' |')
          lines+=['',
                  '## Secondary matched-workload total CPU times',
                  '',
                  '| Complete output+full root timed arm | Sum of source medians | Ratio to native |',
                  '| --- | ---: | ---: |']
          for arm,label in (
              ('native_compressed_R_root','NOR52 compressed native inverse'),
              ('raw_fast_compressed_gmp_root','NOR53 raw supplied inverse verification'),
              ('signed_compact_verifier_root','NOR55 authenticated compact verification'),
              ('signed_json_verifier_root','NOR55 authenticated full JSON verification')):
              lines.append(
                  f'| {label} | {totals[arm]:.3f} ms | {totals[arm]/root:.6f}x |')
          lines+=['',
                  'These are sums of first source-level medians, a registered **secondary** workload measure; they cannot convert the registered 0.851483x primary codec-speed FAIL to a PASS. Ten source-block descriptive bootstrap results are preserved in the original CPU JSON.',
                  '',
                  '## Separate actual local TCP loopback measurement',
                  '',
                  'After primary CPU completion, a second dependent CI job measured **16 sparse m3073 sources**, three each, with the producer and verifier running as separate Python processes connected through **real TCP 127.0.0.1 sockets on the same GitHub runner**. The producer freshly computes a complete compressed native inverse, creates canonical binary payload, signs its independently verifier-issued nonce/session/source/root context, sends the signed wire and receives a verified full-output SHA and original full Merkle root. Server process startup and issuance of nonces occur outside timed samples.',
                  '',
                  f'- Sourcewise median complete loopback/local compressed-native same-job ratio: **{secondary["median_sourcewise_loopback_over_same_job_native"]:.6f}x**.',
                  f'- 95th percentile of 48 request-response samples: **{secondary["p95_of_48_request_response_samples_ms"]:.3f} ms**.',
                  '- All **48/48** separate-process signed requests returned exact root and full vector digest. The request has a compact signed full witness; the response contains its exact result root and vector hash.',
                  '- The loopback source SHA and original primary CPU SHA are chained in its separate first JSON. The localhost transport latency is **secondary** and does not replace or alter the first five primary engineering gates.',
                  '',
                  '## Security and applicability limits',
                  '',
                  'The verifier checks a pinned **research-fixture** Ed25519 public key, canonical binary source-bound signed header/payload, full authenticated source-vector SHA, trusted original source record SHA, full Merkle-root premise, provider ID, session sequence and independently issued 256-bit nonce before marking a replay-guard session accepted. It rejects tampered signatures, alternate integer encodings, trailing bytes, invalid support, source-swapped data and stale nonces. All full original NOR47 coefficient and packing caps remain enforced before the NOR53 fast exact signed compressed inverse identity and full-root recomputation.',
                  '',
                  'The public fixture signing private seed is included in repository code, so **this is deliberately not secure deployed signing**. Authentication proves integrity only conditional on a private signing key and independently trusted source/root/session; it does not prove the remote source publisher honest or an external future correct. The supplied exact witness is transparent and nonsuccinct. m3073 remains outside original NOR45 native signed-program grammar. Separate local TCP is not cross-machine production network latency or a Bitcoin/ZK proof.',
                  '',
                  '## Follow-on mechanism',
                  '',
                  'A new prospective study can select JSON versus compact payload codec from **authenticated public source complexity** and use source-frozen unseen cases to test whether that improves the signed-verification latency frontier. The original 0.851483x codec gate stays FAIL. An off-host benchmark with genuine independently managed keys and trusted source distribution would require its own security and network protocol registration. Verify source-bound signed arithmetic and sparse support lemmas in Lean before calling this math machine checked.',
                  ''
          ]
          (dest.parent/'RESULTS.md').write_text('\n'.join(lines))
          print('NOR55 FIRST ORIGINAL CPU SHA',receipt['raw_cpu_sha256'])
          print('NOR55 FIRST SOURCE SHA',receipt['raw_source_sha256'])
          print('NOR55 SECONDARY LOCAL TCP SHA',receipt['raw_secondary_sha256'])
          print('NOR55 FIRST ENGINEERING 4/5 FAIL',receipt['original_primary'])
          PY
      - name: Independently audit original raw SHA, sourcewise medians and TCP provenance
        run: python research/nor55_compact_witness/original_archive_audit.py
      - name: Commit immutable first CPU/source/TCP bytes, receipt and negative results report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/nor55_compact_witness/results/nor55_first_original_hosted.zip \
                  research/nor55_compact_witness/results/nor55_first_receipt.json \
                  research/nor55_compact_witness/RESULTS.md
          git commit -m 'NOR-55: preserve original 60-source signed compact 4-of-5 FAIL and TCP'
          for i in $(seq 1 12); do
            git fetch origin research/nor55-signed-compact-witness-20261118
            git rebase FETCH_HEAD
            if git push origin HEAD:research/nor55-signed-compact-witness-20261118; then
              exit 0
            fi
            sleep 2
          done
          exit 1
