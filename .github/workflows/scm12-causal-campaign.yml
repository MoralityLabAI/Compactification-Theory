name: SCM-12 Seifert paired causal campaign checks
on:
  push:
    paths:
      - 'research/seifert_activation/**'
      - '.github/workflows/scm12-causal-campaign.yml'
  pull_request:
    paths:
      - 'research/seifert_activation/**'
      - '.github/workflows/scm12-causal-campaign.yml'
permissions:
  contents: read
jobs:
  synthetic-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install exact algebra and PyTorch CPU
        run: |
          python -m pip install sympy==1.14.0
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Compile instrument
        run: python -m compileall -q research/seifert_activation
      - name: Run SCM-12 isolation and provenance tests
        run: python -m unittest discover -s research/seifert_activation/tests -p 'test_scm12.py' -v
      - name: Replay sealed synthetic-only reference
        run: python research/seifert_activation/scm12_reference.py --check --out research/seifert_activation/results/scm12_synthetic_reference.json
