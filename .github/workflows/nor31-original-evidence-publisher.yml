name: NOR-31 one-shot publisher of original historical-TRAIN and heldout-TEST evidence

on:
  push:
    paths:
      - '.github/workflows/nor31-original-evidence-publisher.yml'

permissions:
  contents: write
  actions: read

jobs:
  preserve-original-first-run:
    if: github.ref == 'refs/heads/research/nor31-class-collapsed-constrained-minimax-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/nor31-class-collapsed-constrained-minimax-20261117
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nor31_original_historical_train_fresh_test_and_full_game
          run-id: 44032550237
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/nor31-original
      - name: Byte-pin the original precommitted training, public source and heldout outcome
        run: |
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          from zipfile import ZipFile,ZipInfo,ZIP_DEFLATED
          import json
          source=Path('/tmp/nor31-original')
          target=Path('research/nor31_class_constrained_minimax/results')
          target.mkdir(parents=True,exist_ok=True)
          files={
            'nor31_train_receipt.json':(5300,'ba6141e866324000e6fdb22068a9b56631e0eb5fddb8ec36daca16e5ce199dc0'),
            'nor31_fixture.json':(2245544,'b34f0cdefc7c4d06770af00ac659f11fd83b540fa40b02186157abc640bfae85'),
            'nor31_full.json':(317452,'f978a2c388715056e7999e01d4ddc30f6c24a778b0e6e3e741a070902223430c')
          }
          original={}
          for name,(size,h) in files.items():
            data=(source/name).read_bytes()
            assert len(data)==size,(name,len(data))
            assert sha256(data).hexdigest()==h,name
            original[name]=data
          tr=json.loads(original['nor31_train_receipt.json'])
          src=json.loads(original['nor31_fixture.json'])
          out=json.loads(original['nor31_full.json'])
          assert tr['schema']=='nor31.historical_two_cohort_alias_collapsed_training.v1'
          assert tr['fitted_constrained']['weights']==[2,0,1,1,4,8]
          assert tr['fitted_constrained']['historical_in_template_rate']>=.18
          assert tr['test_source_information_used'] is False
          assert src['schema']=='nor31.source_only_new_12_reps24_25.v1'
          assert src['source_replicates']==[24,25]
          assert len(src['cases'])==12
          assert out['schema']=='nor31.fresh_source_sixclass_template_constrained_minimax.v1'
          assert out['train_receipt_sha256']==files['nor31_train_receipt.json'][1]
          assert out['test_public_fixture_sha256']==files['nor31_fixture.json'][1]
          assert out['registered_primary_pass']
          assert out['primary_self_source_wins']==12
          assert out['primary_worst_source_wins']==12
          assert out['primary_template_75pct_source_count']==10
          assert all(out['registered_five_gates'].values())
          archive=target/'nor31_original_hosted.zip'
          with ZipFile(archive,'w',compression=ZIP_DEFLATED,compresslevel=9) as z:
            for name,raw in original.items():
              p=ZipInfo(name,(2026,11,17,0,0,0))
              p.compress_type=ZIP_DEFLATED
              z.writestr(p,raw,compress_type=ZIP_DEFLATED,compresslevel=9)
          receipt={
            'schema':'nor31.original_sourceheldout_sixclass_first_run.v1',
            'date_utc':'2026-11-17',
            'preregistered_first_commit':'7e37e8c57a68e7224a67626d2495e9bcf922a424',
            'original_fully_green_run':'https://github.com/MoralityLabAI/Compactification-Theory/actions/runs/44032550237',
            'original_artifact_id':14306125618,
            'original_artifact_name':'nor31_original_historical_train_fresh_test_and_full_game',
            'original_file_sizes_and_sha256':{
              name:{'bytes':size,'sha256':h} for name,(size,h) in files.items()},
            'historical_train_source_units':24,
            'fresh_test_source_units':12,
            'train_grid_enumerated':20349,
            'train_grid_feasible':9424,
            'trained_sixclass_weights':[2,0,1,1,4,8],
            'historical_in_template_detection':tr['fitted_constrained']['historical_in_template_rate'],
            'source_mean_template_detection':out['primary_template_mean'],
            'source_mean_self_response_gain':out['primary_mean_self_gain'],
            'source_self_response_wins':out['primary_self_source_wins'],
            'source_worstcase_wins':out['primary_worst_source_wins'],
            'source_template_retention_75pct_count':out['primary_template_75pct_source_count'],
            'registered_five_gates':out['registered_five_gates'],
            'registered_primary_pass':True,
            'independent_replay_passed':True,
            'independently_replayed_policy_world_decisions':4128768,
            'scope':'Finite synthetic RRC25; assumed honest target-dependent external witness; blinded attack sets fixed before reproducible audit challenges.'
          }
          (target/'nor31_first_frozen_receipt.json').write_text(
            json.dumps(receipt,sort_keys=True,indent=2)+'\n')
          print('NOR31 ORIGINAL SOURCE-CONTROLLED ZIP',len(archive.read_bytes()),sha256(archive.read_bytes()).hexdigest())
          PY
      - name: Independently reconstruct the exact original train and test artifact bytes
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from research.nor31_class_constrained_minimax.receipt_audit import replay_all
          archive=Path('research/nor31_class_constrained_minimax/results/nor31_original_hosted.zip')
          with ZipFile(archive) as z:
            assert z.testzip() is None
            for name in ('nor31_train_receipt.json','nor31_fixture.json','nor31_full.json'):
              Path('/tmp',name).write_bytes(z.read(name))
          result=replay_all(Path('/tmp/nor31_train_receipt.json'),
                            Path('/tmp/nor31_fixture.json'),
                            Path('/tmp/nor31_full.json'))
          assert result['registered_primary_pass']
          assert result['replayed_heldout_policy_world_decisions']==4128768
          print('NOR31 ORIGINAL POST-ARCHIVE INDEPENDENT REPLAY',result)
          PY
      - name: Commit original first-run bytes and immutable SHA receipt
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/nor31_class_constrained_minimax/results/nor31_original_hosted.zip \
                  research/nor31_class_constrained_minimax/results/nor31_first_frozen_receipt.json
          git commit -m "NOR-31: preserve immutable first TRAIN and TEST game evidence"
          git push origin HEAD:research/nor31-class-collapsed-constrained-minimax-20261117
