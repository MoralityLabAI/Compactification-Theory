name: SMC-13 independent recurrent Sudoku teachers and orbit-disjoint cohorts

on:
  push:
    paths:
      - 'research/real_recurrence_sae_v1/smc13_*'
      - 'research/real_recurrence_sae_v1/test_smc13_*'
      - '.github/workflows/smc13-independent-teacher.yml'
  pull_request:
    paths:
      - 'research/real_recurrence_sae_v1/smc13_*'
      - 'research/real_recurrence_sae_v1/test_smc13_*'
      - '.github/workflows/smc13-independent-teacher.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  independent-generator-and-model-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU Torch matching frozen source
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify exact Sudoku orbit obstruction and unique family splits
        run: python -m unittest discover -s research/real_recurrence_sae_v1 -p 'test_smc13_family.py' -v
      - name: Verify independently initialized teacher and SAE checkpoint controls
        run: python -m unittest discover -s research/real_recurrence_sae_v1 -p 'test_smc13_independent_teacher.py' -v
      - name: Reproduce fixed 24-puzzle smoke cohort manifest
        run: |
          mkdir -p runs/smc13
          python research/real_recurrence_sae_v1/smc13_family.py \
            --smoke --output runs/smc13/roster-smoke.json
      - name: Source-locked small independent teacher training replay
        run: |
          python research/real_recurrence_sae_v1/smc13_train_teachers.py \
            --fetch-source --quick --teacher-seeds 501 --sae-seeds 71 \
            --teacher-steps 25 --out runs/smc13/smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smc13-independent-teacher-smoke
          path: |
            runs/smc13/roster-smoke.json
            runs/smc13/smoke.json
          if-no-files-found: warn

  independently-trained-checkpoints-full:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU Torch matching original pretrained and SAE checkpoints
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Fetch exact original pretrained-model SAE comparison checkpoints
        uses: actions/download-artifact@v4
        with:
          name: smc11c-source-locked-same-fit-full
          run-id: 43721281348
          github-token: ${{ github.token }}
          path: runs/smc13/original
      - name: Verify immutable SMC-11C source teacher and three SAE checkpoint hashes
        run: |
          echo "7caafcb54e36f508b49a082892b689789a751f86b52d6d206e955e3782431087  runs/smc13/original/joint-full.json" | sha256sum -c -
          echo "00542304e1f15f606a20519d59c7617d574a4f0266c9a33b2220cf146015c3da  runs/smc13/original/joint-frozen-weights/sae_seed71.pt" | sha256sum -c -
          echo "ba0bfd9d82d68bd3398bb37e8b7539d93dff6d4e21f153d44bfa9f1ccae2ebcb  runs/smc13/original/joint-frozen-weights/sae_seed89.pt" | sha256sum -c -
          echo "087787bcfdd4d4350b56595049c07a7fd62bfd7db69f52258905a872e1f5b5af  runs/smc13/original/joint-frozen-weights/sae_seed113.pt" | sha256sum -c -
      - name: Train both recurrent checkpoints from scratch and freeze independent test results
        run: |
          python research/real_recurrence_sae_v1/smc13_train_teachers.py \
            --fetch-source \
            --original-sae-artifact runs/smc13/original \
            --teacher-seeds 501,701 --sae-seeds 71,89 \
            --teacher-steps 600 --out runs/smc13/full.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smc13-independent-noncanonical-teachers
          path: |
            runs/smc13/full.json
            runs/smc13/teachers/
            runs/smc13/saes/
          if-no-files-found: warn
          retention-days: 90
