name: BGI-01F verified repair and fresh semantic pilot

on:
  push:
    branches:
      - research/bgi01f-verified-repair-benchmark-20261030
    paths:
      - 'research/bgi_attractors_v1/verified_repair/**'
      - '.github/workflows/bgi01f-verified-repair.yml'
  pull_request:
    paths:
      - 'research/bgi_attractors_v1/verified_repair/**'
      - '.github/workflows/bgi01f-verified-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Test finite state transition, actual repair progress and prompt controls
        run: python -m unittest discover -s research/bgi_attractors_v1/verified_repair/tests -v
      - name: Verify exact finite oracle certificate
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "research/bgi_attractors_v1/verified_repair")
          from core import exhaustive_certificate
          data = exhaustive_certificate()
          assert data["verified_edges"] == 352
          assert data["blocked_regressions"] == 80
          assert data["accepted_state_changes"] == 80
          print("EXACT_FINITE_ORACLE=" + repr(data))
          PY

  real-model:
    needs: finite-oracle
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONHASHSEED: "20261030"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pinned CPU model runtime
        run: |
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check transformers==4.46.3 huggingface_hub==0.27.1 safetensors==0.4.5
      - name: Run 48 fresh synthetic cases in two paraphrases and seven three-round repair scenarios
        run: |
          python -u research/bgi_attractors_v1/verified_repair/run_model.py
      - name: Independent complete receipt and review-state check
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path("research/bgi_attractors_v1/verified_repair/results/bgi01f_real_qwen15b_v1.json")
          doc = json.loads(p.read_text())
          payload = doc["payload"]
          canonical = json.dumps(payload, sort_keys=True, separators=(",", ":"),
                                 ensure_ascii=False, allow_nan=False).encode()
          assert hashlib.sha256(canonical).hexdigest() == doc["sha256"]
          assert payload["schema"] == "BGI01F-engineering-pilot-v1"
          assert payload["model"]["id"] == "Qwen/Qwen2.5-1.5B-Instruct"
          assert payload["model"]["revision"] == "775b11afaf83e0dc75bd5abaf90133e47b3ec082"
          assert payload["environment"]["independent_human_review"] is False
          assert payload["model_callbacks"] == 138
          assert payload["real_model_forward_calls"] + payload["identical_prompt_cache_hits"] == 138
          assert payload["policy_certificate"]["verified_edges"] == 352
          assert payload["policy_certificate"]["blocked_regressions"] == 80
          assert len(payload["semantic"]["records"]) == 96
          assert len(payload["repair"]["scenarios"]) == 7
          for group in payload["semantic"]["groups"].values():
              assert group["n"] == 8
          for sc in payload["repair"]["scenarios"]:
              for result in sc["outcomes"]:
                  if result["mode"].endswith("_model"):
                      assert result["ledger_verified"] is True
                      assert len(result["attempts"]) == 3
                      for item in result["attempts"]:
                          ev = item["event"]
                          assert hashlib.sha256(json.dumps(
                              {k: v for k, v in ev.items() if k != "event_sha256"},
                              sort_keys=True, separators=(",", ":"),
                              ensure_ascii=False).encode()).hexdigest() == ev["event_sha256"]
                  if result["mode"] == "verified_model":
                      assert result["blocked_weakening"] >= 0
          review = Path("research/bgi_attractors_v1/verified_repair/results/review_template.csv").read_text()
          assert review.count(",NO") == 48
          print("BGI01F_EVIDENCE_VERIFIED=" + doc["sha256"])
          PY
      - name: Archive raw model outputs, policy ledgers and human audit template
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bgi01f-qwen15b-exact-repair-pilot
          path: |
            research/bgi_attractors_v1/verified_repair/results/bgi01f_real_qwen15b_v1.json
            research/bgi_attractors_v1/verified_repair/results/review_template.csv
          if-no-files-found: warn
          retention-days: 30
