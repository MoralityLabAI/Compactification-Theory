name: QO-11 expected gap paired probe audit
permissions:
  contents: read

on:
  push:
    paths:
      - 'research/ingression_dynamics_v1/expected_gap_probe.py'
      - 'research/ingression_dynamics_v1/expected_gap_pilot.py'
      - 'research/ingression_dynamics_v1/test_expected_gap_probe.py'
      - 'research/ingression_dynamics_v1/EXPECTED_GAP_THEORY.md'
      - 'scripts/verify_expected_gap_pilot.py'
      - 'results/expected_gap_pilot/**'
      - '.github/workflows/qo11-expected-gap.yml'
  pull_request:
    paths:
      - 'research/ingression_dynamics_v1/expected_gap_probe.py'
      - 'research/ingression_dynamics_v1/expected_gap_pilot.py'
      - 'research/ingression_dynamics_v1/test_expected_gap_probe.py'
      - 'research/ingression_dynamics_v1/EXPECTED_GAP_THEORY.md'
      - 'scripts/verify_expected_gap_pilot.py'
      - 'results/expected_gap_pilot/**'
      - '.github/workflows/qo11-expected-gap.yml'
  workflow_dispatch:
jobs:
  rational-paired:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify monotonicity and lookahead regression tests
        run: python -m unittest discover -s research/ingression_dynamics_v1 -p 'test_expected_gap_probe.py' -v
      - name: Reproduce all matched observations and SHA256 receipt
        run: PYTHONPATH=. python scripts/verify_expected_gap_pilot.py --check
