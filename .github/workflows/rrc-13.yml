name: RRC-13 active graph construction exact CPU audit
permissions:
  contents: read
on:
  push:
    paths:
      - 'research/rrc_compactification/graph13.py'
      - 'research/rrc_compactification/policy13.py'
      - 'research/rrc_compactification/train13.py'
      - 'research/rrc_compactification/bench13.py'
      - 'research/rrc_compactification/test_graph13.py'
      - 'research/rrc_compactification/RRC13_*.md'
      - 'research/rrc_compactification/README_RRC13.md'
      - 'research/rrc_compactification/results/rrc13_*.json'
      - 'research/rrc_compactification/graph11.py'
      - 'research/rrc_compactification/graph12.py'
      - 'research/rrc_compactification/model12.py'
      - 'research/rrc_compactification/train12.py'
      - 'research/rrc_compactification/results/rrc12_recurrent.json'
      - '.github/workflows/rrc-13.yml'
  pull_request:
    paths:
      - 'research/rrc_compactification/graph13.py'
      - 'research/rrc_compactification/policy13.py'
      - 'research/rrc_compactification/train13.py'
      - 'research/rrc_compactification/bench13.py'
      - 'research/rrc_compactification/test_graph13.py'
      - 'research/rrc_compactification/RRC13_*.md'
      - 'research/rrc_compactification/README_RRC13.md'
      - 'research/rrc_compactification/results/rrc13_*.json'
      - 'research/rrc_compactification/graph11.py'
      - 'research/rrc_compactification/graph12.py'
      - 'research/rrc_compactification/model12.py'
      - 'research/rrc_compactification/train12.py'
      - 'research/rrc_compactification/results/rrc12_recurrent.json'
      - '.github/workflows/rrc-13.yml'
  workflow_dispatch:
jobs:
  active-graph-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Finite formal-series, live feedback, isolation and certificate audits
        run: python -m unittest discover -s research/rrc_compactification -p 'test_graph13.py' -v
      - name: Exact frozen source and checkpoint replay
        run: python research/rrc_compactification/bench13.py --check
      - name: Prior graph search and direct-proposer regression
        run: |
          python -m unittest discover -s research/rrc_compactification -p 'test_graph11.py' -v
          python -m unittest discover -s research/rrc_compactification -p 'test_graph12.py' -v
