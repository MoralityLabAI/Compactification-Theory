name: NOR-16 one-shot source-locked full experiment ZIP archival writer

on:
  push:
    paths:
      - '.github/workflows/nor16-one-shot-archive.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reproduce-and-archive:
    if: github.ref == 'refs/heads/research/nor16-public-query-consensus-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reconstruct four fresh NOR-16 source cohorts and freeze original byte stream
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nor16"
          python research/nor16_public_query_consensus/experiment.py \
            --check --repetitions 4 --late-per-repetition 48 \
            --signed-per-repetition 12 --rational-per-repetition 12 \
            --out "$RUNNER_TEMP/nor16/nor16_full.json"
          echo "b1ca49c9fb0d95510f020d4318d29a10abc25759fa110370eef967d538a20cef  $RUNNER_TEMP/nor16/nor16_full.json" | sha256sum --check
          test "$(wc -c < "$RUNNER_TEMP/nor16/nor16_full.json")" -eq 1331006
          python research/nor16_public_query_consensus/receipt_audit.py \
            --check --full "$RUNNER_TEMP/nor16/nor16_full.json"
      - name: Preserve full original source evidence in deterministic ZIP
        run: |
          set -euo pipefail
          zip -q -X -j \
            research/nor16_public_query_consensus/results/nor16_full.zip \
            "$RUNNER_TEMP/nor16/nor16_full.json"
          test "$(unzip -p research/nor16_public_query_consensus/results/nor16_full.zip nor16_full.json | sha256sum | awk '{print $1}')" = \
            b1ca49c9fb0d95510f020d4318d29a10abc25759fa110370eef967d538a20cef
      - name: Commit evidence ZIP on isolated research branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/nor16_public_query_consensus/results/nor16_full.zip
          git diff --cached --check
          git commit -m "NOR-16: preserve original 288-case complete public-observation experiment ZIP"
          git push origin "HEAD:research/nor16-public-query-consensus-20261115"
