name: LSV-17 signed adjoint Taylor certification
on:
  push:
    paths:
      - 'research/levin_sieve_v1/goal_taylor_v1/**'
      - '.github/workflows/levin-goal-taylor.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rigorous:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU arithmetic
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install python-flint==0.9.0
      - name: Algebra, corrupted receipts and independent derivative tests
        run: python -m unittest discover -s research/levin_sieve_v1/goal_taylor_v1 -p 'test_*.py' -v
      - name: Full projected-curvature certificates and validated counterexamples
        run: python research/levin_sieve_v1/goal_taylor_v1/run_projected.py --fetch --cases 64 --attacks --out runs/lsv17/projected.json
      - name: Independent rational replay
        run: python research/levin_sieve_v1/goal_taylor_v1/replay.py runs/lsv17/projected.json --complete
      - name: Retain compatible validated arithmetic wheel for offline reproduction
        run: python -m pip download python-flint==0.9.0 --only-binary=:all: --no-deps --python-version 313 --implementation cp --abi cp313 --platform manylinux_2_17_x86_64 --platform manylinux2014_x86_64 -d runs/lsv17/runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lsv17-projected-curvature-and-attacks
          path: runs/lsv17/
          if-no-files-found: warn
          retention-days: 60
