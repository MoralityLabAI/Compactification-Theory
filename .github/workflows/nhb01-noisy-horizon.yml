name: NHB-01 noisy threshold horizon
permissions:
  contents: read
on:
  push:
    paths:
      - 'research/noisy_threshold_horizon_v1/**'
      - '.github/workflows/nhb01-noisy-horizon.yml'
  pull_request:
    paths:
      - 'research/noisy_threshold_horizon_v1/**'
      - '.github/workflows/nhb01-noisy-horizon.yml'
  workflow_dispatch:
jobs:
  exact-noisy-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exact small-cube and numerical entropy regression
        run: python -m unittest discover -s research/noisy_threshold_horizon_v1 -p 'test_*.py' -v
      - name: Source-locked horizon receipt
        run: python research/noisy_threshold_horizon_v1/reference.py --out /tmp/nhb01_exact.json
      - uses: actions/upload-artifact@v4
        with:
          name: nhb01-noisy-horizon
          path: /tmp/nhb01_exact.json
