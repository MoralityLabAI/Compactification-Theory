name: BGI-01D direct semantic actions and policy edits

on:
  push:
    branches:
      - research/bgi01d-direct-decisions-policy-edits-20261030
    paths:
      - 'research/bgi_attractors_v1/direct_pilot/**'
      - '.github/workflows/bgi01d-direct-pilot.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-model-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONHASHSEED: "20261030"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Independent fixture, action, policy and recovery regressions
        run: |
          python -m unittest discover -s research/bgi_attractors_v1/direct_pilot/tests -v
      - name: Install pinned CPU inference runtime
        run: |
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check transformers==4.46.3 huggingface_hub==0.27.1 safetensors==0.4.5
      - name: Generate natural-language actions and model-authored sandbox policy patches
        run: |
          python -u research/bgi_attractors_v1/direct_pilot/run_model.py
      - name: Check frozen provenance, full record, parser and receipt
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p = Path("research/bgi_attractors_v1/direct_pilot/results/qwen05b_direct_policy_v1.json")
          doc = json.loads(p.read_text())
          data = doc["payload"]
          canon = json.dumps(data, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode()
          assert hashlib.sha256(canon).hexdigest() == doc["sha256"]
          fixture = Path("research/bgi_attractors_v1/direct_pilot/fixtures.json").read_bytes()
          assert hashlib.sha256(fixture).hexdigest() == data["fixture"]["sha256_bytes"]
          assert data["model_revision"] == "7ae557604adf67be50417f59c2c2f167def9a775"
          assert data["total_action_rows"] == 512
          assert len(data["traces"]) == 512 and len(data["proposals"]) == 3
          assert len(data["summary"]) == 28
          assert data["actual_model_forward_calls"] > 0
          assert data["reused_identical_prompt_results"] >= 0
          assert data["actual_model_forward_calls"] + data["reused_identical_prompt_results"] == 518
          assert data["quality_gate"]["status"] in (
              "PASS_BASELINE_SEMANTIC_PROBE", "FAIL_BASELINE_SEMANTIC_PROBE")
          for row in data["traces"]:
              assert row["inference"]["model_forward"] == "deterministic_greedy_full_generation"
              assert row["inference"]["input_tokens"] <= 768
              assert row["inference"]["output_tokens"] <= 8
              assert row["emitted"] in ("ALLOW", "DENY")
              assert row["expected"] in ("ALLOW", "DENY")
          for record in data["proposals"]:
              assert record["update_inference"]["output_tokens"] <= 96
              assert record["recovery_inference"]["output_tokens"] <= 96
          print("BGI-01D reproducibility and complete trace check PASS:", doc["sha256"])
          PY
      - name: Publish raw output and full decision/patch evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bgi01d-direct-policy-qwen05b-complete
          path: research/bgi_attractors_v1/direct_pilot/results/qwen05b_direct_policy_v1.json
          if-no-files-found: warn
          retention-days: 30
