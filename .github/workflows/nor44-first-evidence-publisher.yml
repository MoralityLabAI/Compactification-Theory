name: NOR-44 one-shot first historical signed-session receipt publisher

on:
  push:
    branches:
      - research/nor44-session-precommit-historical-20261118
    paths:
      - '.github/workflows/nor44-first-evidence-publisher.yml'

permissions:
  contents: write
  actions: read

jobs:
  preserve_first_original_historical_sessions:
    if: github.ref == 'refs/heads/research/nor44-session-precommit-historical-20261118' && contains(github.event.head_commit.message, 'NOR44-ARCHIVE-FIRST')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/nor44-session-precommit-historical-20261118
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: nor44_first_historical_64_signed_sessions
          run-id: 44228006426
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/nor44_first
      - name: Validate original bytes and receipt contents without rebuilding sources
        shell: bash
        run: |
          test ! -e research/nor44_session_protocol/results/nor44_first_historical_64_sessions.json
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import json
          raw=Path('/tmp/nor44_first/nor44_original_64_session.json').read_bytes()
          assert len(raw)==121592
          assert sha256(raw).hexdigest()==(
             'b7f740b6916e651932dbd40ceee443bdd5fb40c4b7a7042830ef53f749bd1f83')
          x=json.loads(raw)
          assert x['schema']=='nor44.archived_nor42_session_ordering_smoke.v1'
          assert x['historical_source_pair_count']==64
          assert x['new_nor44_prospective_source_count']==0
          assert x['signed_sessions_per_source']==3
          assert x['challenge_queries_per_session']==16
          assert x['original_nor42_source_sha256']==(
            'f8bc6ef3db4fda78709f2b7cd1a6a09989dbc087bcfb963d00961cc23ce4f033')
          assert x['original_nor42_grade_sha256']==(
            'bd57751d94ea49755888000675b0df8fce6490873683268b8f8625518701adae')
          assert x['all_valid_proof_substitution_attacks_rejected']
          assert x['all_dishonest_authorized_provider_cases_crypto_accept_false_truth']
          assert x['test_signing_keys_are_public']
          assert x['test_nonces_and_challenges_are_public_deterministic']
          assert len({r['nor42_public_source_sha256'] for r in x['source_records']})==64
          print('NOR44 FIRST HISTORICAL RAW SHA LOCKED',len(raw),sha256(raw).hexdigest())
          PY
      - name: Commit original first raw JSON unchanged, preserve historical result
        run: |
          mkdir -p research/nor44_session_protocol/results
          cp /tmp/nor44_first/nor44_original_64_session.json \
             research/nor44_session_protocol/results/nor44_first_historical_64_sessions.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/nor44_session_protocol/results/nor44_first_historical_64_sessions.json
          git commit -m "NOR-44: preserve SHA-locked first historical-only signed sessions"
          for attempt in $(seq 1 20); do
            git fetch origin research/nor44-session-precommit-historical-20261118
            git rebase FETCH_HEAD
            if git push origin HEAD:research/nor44-session-precommit-historical-20261118; then
              exit 0
            fi
            sleep 2
          done
          exit 1
