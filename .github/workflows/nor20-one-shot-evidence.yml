name: NOR-20 one-shot original Linux Windows public CPU evidence publisher

on:
  push:
    paths:
      - '.github/workflows/nor20-one-shot-evidence.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  archive-original-cross-host-bytes:
    if: github.ref == 'refs/heads/research/nor20-crosshost-wide-coefficients-20261116'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: nor20_original_cross_host_fixture_linux_windows_results
          run-id: 43807479206
          github-token: ${{ github.token }}
          path: /tmp/nor20-original
      - name: Verify original fixture, both host raw timings and independent crosshost report
        run: |
          set -euo pipefail
          echo "de7ed801e0e8708afebdbe3699d9074375b156795b40372eb77e2a4a13218c19  /tmp/nor20-original/nor20_fixture/fixture.json" | sha256sum -c
          echo "6c033440be72ae470769e7a152286677cba8fa3b676e9f9207d0c335ab1ec01d  /tmp/nor20-original/nor20_results/linux_ubuntu_2404.json" | sha256sum -c
          echo "85686b13b4526d926f10b0b4f476bea82ab9d2f88dbc63d02704268f9ef88158  /tmp/nor20-original/nor20_results/windows_2025.json" | sha256sum -c
          echo "3a048cfbafb7c9e87f28ed04d7d7e2ecd1b06b3be5c513351aa7fb11fa6a07c4  /tmp/nor20-original/nor20_results/comparison.json" | sha256sum -c
          test "$(wc -c < /tmp/nor20-original/nor20_fixture/fixture.json)" -eq 5416693
          test "$(wc -c < /tmp/nor20-original/nor20_results/linux_ubuntu_2404.json)" -eq 683486
          test "$(wc -c < /tmp/nor20-original/nor20_results/windows_2025.json)" -eq 683275
          test "$(wc -c < /tmp/nor20-original/nor20_results/comparison.json)" -eq 1296
      - name: Reconstruct original 128 source masks and exact cross-host statistics independently
        run: |
          python research/nor20_crosshost/combine.py \
            --fixture /tmp/nor20-original/nor20_fixture/fixture.json \
            --linux /tmp/nor20-original/nor20_results/linux_ubuntu_2404.json \
            --windows /tmp/nor20-original/nor20_results/windows_2025.json \
            --out /tmp/nor20-archive-audit.json
      - name: Compress all original byte streams under immutable names
        run: |
          set -euo pipefail
          mkdir -p research/nor20_crosshost/results
          zip -q -X -j research/nor20_crosshost/results/nor20_original_crosshost.zip \
            /tmp/nor20-original/nor20_fixture/fixture.json \
            /tmp/nor20-original/nor20_results/linux_ubuntu_2404.json \
            /tmp/nor20-original/nor20_results/windows_2025.json \
            /tmp/nor20-original/nor20_results/comparison.json
          test "$(unzip -p research/nor20_crosshost/results/nor20_original_crosshost.zip fixture.json | sha256sum | awk '{print $1}')" = \
            de7ed801e0e8708afebdbe3699d9074375b156795b40372eb77e2a4a13218c19
          test "$(unzip -p research/nor20_crosshost/results/nor20_original_crosshost.zip comparison.json | sha256sum | awk '{print $1}')" = \
            3a048cfbafb7c9e87f28ed04d7d7e2ecd1b06b3be5c513351aa7fb11fa6a07c4
      - name: Commit unchanged first hosted Linux and Windows evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/nor20_crosshost/results/nor20_original_crosshost.zip
          git diff --cached --check
          git commit -m "NOR-20: preserve first exact two-host wide public verifier CPU evidence bytes"
          git push origin "HEAD:research/nor20-crosshost-wide-coefficients-20261116"
