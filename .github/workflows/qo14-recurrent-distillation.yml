name: QO-14 CPU recurrent Bellman distillation audit
permissions:
  contents: read

on:
  push:
    paths:
      - 'research/ingression_dynamics_v1/recurrent_teacher_data.py'
      - 'research/ingression_dynamics_v1/recurrent_probe_student.py'
      - 'research/ingression_dynamics_v1/recurrent_distillation_pilot.py'
      - 'research/ingression_dynamics_v1/test_recurrent_distillation.py'
      - 'research/ingression_dynamics_v1/RECURRENT_CERTIFICATE_DISTILLATION.md'
      - 'research/ingression_dynamics_v1/certificate_reachability.py'
      - 'scripts/verify_recurrent_distillation.py'
      - 'results/recurrent_certificate_distillation/**'
      - '.github/workflows/qo14-recurrent-distillation.yml'
  pull_request:
    paths:
      - 'research/ingression_dynamics_v1/recurrent_teacher_data.py'
      - 'research/ingression_dynamics_v1/recurrent_probe_student.py'
      - 'research/ingression_dynamics_v1/recurrent_distillation_pilot.py'
      - 'research/ingression_dynamics_v1/test_recurrent_distillation.py'
      - 'research/ingression_dynamics_v1/RECURRENT_CERTIFICATE_DISTILLATION.md'
      - 'research/ingression_dynamics_v1/certificate_reachability.py'
      - 'scripts/verify_recurrent_distillation.py'
      - 'results/recurrent_certificate_distillation/**'
      - '.github/workflows/qo14-recurrent-distillation.yml'
  workflow_dispatch:
jobs:
  cpu-student:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only NumPy
        run: python -m pip install numpy==2.3.5
      - name: Verify teacher first-action Q targets and fixed recurrent readout
        run: PYTHONPATH=. python -m unittest discover -s research/ingression_dynamics_v1 -p 'test_recurrent_distillation.py' -v
      - name: Refit readout and reproduce every held-out and paired result
        run: PYTHONPATH=. python scripts/verify_recurrent_distillation.py --check
