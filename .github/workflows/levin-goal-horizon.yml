name: LSV-10 goal-horizon quotient and pretrained tangent audit
on:
  push:
    paths:
      - 'research/levin_sieve_v1/pretrained_trm/**'
      - '.github/workflows/levin-goal-horizon.yml'
  pull_request:
    paths:
      - 'research/levin_sieve_v1/pretrained_trm/**'
      - '.github/workflows/levin-goal-horizon.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-goal-quotient:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU PyTorch
        run: python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install pinned Arb interval runtime
        run: python -m pip install python-flint==0.9.0
      - name: Exact quotient proofs and pretrained interfaces
        run: python -m unittest discover -s research/levin_sieve_v1/pretrained_trm -p 'test_*.py' -v
      - name: Frozen pretrained tangent goal-horizon diagnostic
        run: |
          mkdir -p runs/lsv10
          python research/levin_sieve_v1/pretrained_trm/run_goal_horizon.py --fetch --out runs/lsv10/receipt.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lsv10-goal-horizon-local-tangent-diagnostic
          path: runs/lsv10/receipt.json
          if-no-files-found: ignore
          retention-days: 30
